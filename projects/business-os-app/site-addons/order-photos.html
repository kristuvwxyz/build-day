<!--
  Regal Spritz PH: product photos in My account > Orders (2026-10-06).
  Paste into WebCake: Settings (gear, top left) > HTML/JavaScript > the "Before </body>" box, under anything already there, then Publish.

  Why: when an on-hand item sells out, RS OS takes it off the product list, so the account page can't find its
  photo anymore and shows the gold crown instead (example: RS9996, Kayali Freedom Discovery Layering Set).
  What it does: finds order items that show the crown and puts the listing's photo in its place. It looks the
  photo up in the live list (window.RS_PRODUCTS) and in the photos of sold-out listings RS OS now sends along.
  Nothing else on the page changes.
-->
<style>.rs-op-img{width:100%;height:100%;object-fit:contain;display:block}</style>
<script>
(function () {
  function nk(s) { return String(s || '').toLowerCase().replace(/[^a-z0-9]/g, ''); }
  function txt(el) { return (el.textContent || '').replace(/\s+/g, ' ').trim(); }

  var index = null;
  function build() {
    var list = window.RS_PRODUCTS || window.PRODUCTS;
    if (!list || !list.length) return null;
    var rows = [];
    for (var i = 0; i < list.length; i++) {
      var p = list[i], img = p.imgs && p.imgs[0];
      if (img) rows.push([nk(p.brand), nk(p.name), nk(p.size), img]);
    }
    var extra = list[0] && list[0]._photos;
    if (extra && extra.length) rows = rows.concat(extra);
    return rows;
  }
  // Order titles look like "Kayali Freedom Discovery Layering Set" (brand + name); the line under it starts with the size.
  function photoFor(title, detail) {
    var t = nk(title), size = nk((detail || '').split(/[\/·]/)[0]), best = null;
    if (!t) return null;
    for (var i = 0; i < index.length; i++) {
      var r = index[i];
      if (t !== r[0] + r[1] && t !== r[1]) continue;
      if (size && r[2] === size) return r[3];
      if (!best) best = r[3];
    }
    return best;
  }
  function isPlaceholder(box) {
    var imgs = box.querySelectorAll('img');
    if (!imgs.length) return true;
    for (var i = 0; i < imgs.length; i++) {
      var im = imgs[i], src = im.getAttribute('src') || '';
      if (im.classList.contains('rs-op-img')) return false;
      if (/crown|logo|placeholder|^data:image\/svg/i.test(src) || (im.complete && !im.naturalWidth)) return true;
    }
    return false;
  }

  function fix() {
    if (!index) index = build();
    if (!index) return;
    // Each order line: a small picture box, then the title and a "1.5ml / Set · Qty 1 · ₱1,500" line.
    var details = document.querySelectorAll('body *');
    for (var i = 0; i < details.length; i++) {
      var d = details[i];
      if (d.children.length || !/\bQty\s*\d/i.test(txt(d))) continue;
      var info = d.parentElement, title = info && info.firstElementChild && info.firstElementChild !== d ? txt(info.firstElementChild) : '';
      if (!title) { var prev = d.previousElementSibling; title = prev ? txt(prev) : ''; }
      var line = info && info.parentElement, box = null;
      for (var up = 0; line && up < 3 && !box; up++, line = line.parentElement) {
        var kids = line.children;
        for (var k = 0; k < kids.length; k++) { var kk = kids[k]; if (kk.contains(d) || !kk.offsetWidth || kk.offsetWidth >= 160 || kk.offsetHeight >= 160) continue;
          // never another add-on's tag (e.g. the Sold out tag) or a box that already shows a real photo
          if (kk.getAttribute('data-rs-op') || kk.querySelector('.rs-op-img')) { box = kk; break; }  // already done
          if (kk.classList.contains('rs-so-tag') || kk.closest('.rs-so-tag') || (kk.querySelector('img') && !isPlaceholder(kk))) continue;
          box = kk; break; }
      }
      if (!box || box.getAttribute('data-rs-op') === title || !isPlaceholder(box)) continue;
      var src = photoFor(title, txt(d));
      if (!src) continue;
      box.setAttribute('data-rs-op', title);
      box.innerHTML = '';
      var img = document.createElement('img');
      img.className = 'rs-op-img'; img.alt = title; img.loading = 'lazy'; img.referrerPolicy = 'no-referrer'; img.src = src;
      box.appendChild(img);
    }
  }

  var t = 0;
  function soon() { clearTimeout(t); t = setTimeout(fix, 150); }
  new MutationObserver(soon).observe(document.documentElement, { childList: true, subtree: true });
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', soon); else soon();
})();
</script>
