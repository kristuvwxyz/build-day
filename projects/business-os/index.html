<title>Regal Spritz PH OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: left rail nav (bottom tab bar on phones) + one working pane; summary first, detail below. */
/* BRAND TOKENS: swap these for Regal Spritz's exact colors and fonts. */
:root {
  --brand: #4A2545;        /* primary (deep plum) */
  --brand-ink: #FFFFFF;    /* text on primary */
  --gold: #A9814A;         /* secondary accent */
  --bg: #F7F5F7;
  --surface: #FFFFFF;
  --surface-2: #F0ECF0;
  --line: #E2DCE2;
  --fg: #231A23;
  --muted: #6E636D;
  --good: #2E7D4F;  --good-bg: #E3F2E8;
  --warn: #9A6400;  --warn-bg: #FBF0D9;
  --bad: #B3261E;   --bad-bg: #FBE4E2;
  --info: #3D5A99;  --info-bg: #E5EBF7;
  --amber: #8A5A00; --amber-bg: #FFE9A8;   /* unfulfilled */
  --orange: #A3470C; --orange-bg: #FFDCC2; /* pending / on hold */
  --font-display: "Marcellus", "Cormorant Garamond", Georgia, serif;
  --font-body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --brand: #C9A3C2; --brand-ink: #1E141D; --gold: #D2B07A;
  --bg: #151115; --surface: #1F191F; --surface-2: #2A222A; --line: #3A303A;
  --fg: #F1EAF0; --muted: #A99DA7;
  --good: #7CCB9B; --good-bg: #1D3226; --warn: #E7B85C; --warn-bg: #3A2C12;
  --bad: #F2948D; --bad-bg: #3D1C1A; --info: #9DB5EE; --info-bg: #1E2840; --amber: #F5D06B; --amber-bg: #3D3112; --orange: #F7AE7C; --orange-bg: #43260F;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --brand: #C9A3C2; --brand-ink: #1E141D; --gold: #D2B07A;
  --bg: #151115; --surface: #1F191F; --surface-2: #2A222A; --line: #3A303A;
  --fg: #F1EAF0; --muted: #A99DA7;
  --good: #7CCB9B; --good-bg: #1D3226; --warn: #E7B85C; --warn-bg: #3A2C12;
  --bad: #F2948D; --bad-bg: #3D1C1A; --info: #9DB5EE; --info-bg: #1E2840; --amber: #F5D06B; --amber-bg: #3D3112; --orange: #F7AE7C; --orange-bg: #43260F;
  color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 14px/1.5 var(--font-body); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

.app { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: 100%; }
.rail { background: var(--surface); border-right: 1px solid var(--line); padding: 24px 14px; display: flex; flex-direction: column; gap: 24px; position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; }
.mark { font-family: var(--font-display); font-size: 22px; color: var(--brand); padding-inline: 10px; line-height: 1.1; }
.mark small { display: block; font-family: var(--font-body); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); margin-top: 4px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button { display: flex; align-items: center; gap: 10px; text-align: left; border: 0; background: none; padding: 9px 10px; border-radius: 8px; color: var(--muted); font-weight: 500; }
.nav button svg { width: 18px; height: 18px; flex: none; }
.nav button:hover { background: var(--surface-2); color: var(--fg); }
.nav button[aria-current="page"] { background: var(--brand); color: var(--brand-ink); }
.rail-foot { margin-top: auto; font-size: 12px; color: var(--muted); padding-inline: 10px; display: flex; flex-direction: column; gap: 10px; }
#theme-slot .seg button { padding: 4px 8px; font-size: 12px; }

main { min-width: 0; padding: 28px 32px 48px; display: flex; flex-direction: column; gap: 20px; }
.head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: 28px; margin: 0; text-wrap: balance; }
h2 { font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }

.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 8px; font-weight: 600; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { border-color: transparent; background: none; color: var(--muted); padding: 6px 8px; }
.btn.ghost:hover { color: var(--fg); background: var(--surface-2); }
.btn.danger { color: var(--bad); }
.btn.sm { padding: 4px 10px; font-size: 13px; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; }
.kpi .label { font-size: 12px; color: var(--muted); font-weight: 600; }
.kpi .value { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
.kpi .sub { font-size: 12px; color: var(--muted); }

.seg { display: inline-flex; background: var(--surface-2); border-radius: 8px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: none; padding: 5px 12px; border-radius: 6px; font-weight: 600; font-size: 13px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.08); }

.bars { display: flex; flex-direction: column; gap: 10px; }
.bar-row { display: grid; grid-template-columns: 96px minmax(0, 1fr) 96px; gap: 10px; align-items: center; font-size: 13px; }
.bar-track { height: 10px; background: var(--surface-2); border-radius: 5px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--brand); border-radius: 5px; }
.bar-row .num { text-align: right; font-weight: 600; }

.list { display: flex; flex-direction: column; }
.li { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); }
.li:first-child { border-top: 0; }
.li .main { min-width: 0; }
.li .t { font-weight: 600; overflow-wrap: anywhere; }
.li .s { font-size: 12px; color: var(--muted); }
.empty { color: var(--muted); font-size: 13px; padding: 6px 0; }

.chip { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; white-space: nowrap; background: var(--surface-2); color: var(--muted); }
.chip.good { background: var(--good-bg); color: var(--good); }
.chip.warn { background: var(--warn-bg); color: var(--warn); }
.chip.bad { background: var(--bad-bg); color: var(--bad); }
.chip.info { background: var(--info-bg); color: var(--info); }
.chip.ex { background: none; border: 1px dashed var(--gold); color: var(--gold); }

.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.toolbar input, .toolbar select { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 10px; min-width: 0; }
.toolbar input { flex: 1 1 200px; }

.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 700; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px 12px; border-top: 1px solid var(--line); vertical-align: middle; }
tr:first-child td { border-top: 0; }
td.r, th.r { text-align: right; }
td .s { font-size: 12px; color: var(--muted); }
select.status { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 3px 6px; font-size: 12px; font-weight: 600; }

.notice { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 10px 14px; border-radius: var(--radius); background: var(--warn-bg); color: var(--warn); font-size: 13px; font-weight: 600; }

.scrim { position: fixed; inset: 0; background: rgba(20, 10, 20, .45); display: flex; justify-content: flex-end; z-index: 20; }
.sheet { background: var(--surface); width: min(480px, 100%); height: 100%; overflow-y: auto; padding: calc(22px + env(safe-area-inset-top, 0px)) 22px calc(22px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; }
.sheet h3 { font-family: var(--font-display); font-weight: 400; font-size: 22px; margin: 0; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 12px; font-weight: 700; color: var(--muted); }
.field input, .field select, .field textarea { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 8px 10px; width: 100%; }
.row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.item-row { display: grid; grid-template-columns: minmax(0, 1fr) 64px 92px 32px; gap: 6px; align-items: end; }
.item-row select, .item-row input { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 8px; width: 100%; min-width: 0; }
.total-line { display: flex; justify-content: space-between; font-weight: 700; padding-top: 8px; border-top: 1px solid var(--line); }
.sheet-foot { display: flex; gap: 8px; justify-content: flex-end; margin-top: auto; padding-top: 8px; }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--bad); font-weight: 600; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-weight: 600; z-index: 30; }

/* Shopify-style orders */
.strip { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(168px, 1fr); overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.strip > div { padding: 14px 16px; border-left: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.strip > div:first-child { border-left: 0; justify-content: center; }
.strip select { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 8px; font-weight: 600; }
.metric-name { font-weight: 700; font-size: 13px; text-decoration: underline dotted var(--muted); text-underline-offset: 3px; }
.metric-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; }
.metric-val { font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.delta { font-size: 11px; font-weight: 700; margin-left: 4px; }
.delta.up { color: var(--good); } .delta.down { color: var(--bad); } .delta.flat { color: var(--muted); }
.spark { width: 90px; height: 26px; flex: none; }
.spark polyline { fill: none; stroke: var(--brand); stroke-width: 1.5; stroke-linejoin: round; }
.spark line { stroke: var(--line); stroke-dasharray: 2 2; }

.otable td, .otable th { padding: 9px 12px; }
.otable th { text-transform: none; letter-spacing: 0; font-size: 13px; color: var(--muted); font-weight: 600; background: var(--surface-2); }
.otable tbody tr { cursor: pointer; }
.otable.dir td { vertical-align: top; }
.otable.inv td, .otable.inv th { font-size: 12.5px; }
.otable tfoot td { background: var(--surface-2); border-top: 1px solid var(--line); }
.sheet h2 { margin-top: 4px; }
.otable.inv tfoot td { background: var(--warn-bg); border-top: 1px solid var(--line); }
summary.yr { cursor: pointer; display: flex; gap: 10px; align-items: baseline; font-size: 18px; padding: 4px 0; }
summary.yr span { font-size: 13px; color: var(--muted); }
.otable tbody tr:hover td { background: var(--surface-2); }
.otable tr.sel td { background: var(--info-bg); }
.otable tr.done td { color: var(--muted); }
.otable tr.void td.strike { text-decoration: line-through; color: var(--muted); }
.otable .cb { width: 36px; padding-right: 0; }
.otable input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--brand); cursor: pointer; }
.onum { font-weight: 700; white-space: nowrap; display: inline-flex; align-items: center; gap: 8px; }
.onum svg { width: 15px; height: 15px; color: var(--muted); }
.nowrap { white-space: nowrap; }
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px 2px 7px; border-radius: 7px; font-size: 12.5px; font-weight: 600; white-space: nowrap; background: var(--surface-2); color: var(--fg); }
.badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: .7; flex: none; }
.badge.hollow::before { background: none; border: 1.5px solid currentColor; width: 6px; height: 6px; opacity: 1; }
.badge.orange { background: var(--orange-bg); color: var(--orange); }
.badge.amber { background: var(--amber-bg); color: var(--amber); }
.badge.red { background: var(--bad-bg); color: var(--bad); }
.badge.grey { background: var(--surface-2); color: var(--muted); }
.badge.green { background: var(--good-bg); color: var(--good); }
.badge.violet { background: color-mix(in srgb, #8B5CF6 14%, var(--surface)); color: #7C3AED; }
.badge.blue { background: color-mix(in srgb, #3B82F6 14%, var(--surface)); color: #2563EB; }
.badge.teal { background: color-mix(in srgb, #0D9488 14%, var(--surface)); color: #0F766E; }
.tags { display: flex; gap: 6px; flex-wrap: nowrap; align-items: center; }
.tag { display: inline-block; padding: 1px 8px; border-radius: 6px; font-size: 12.5px; background: var(--surface-2); border: 1px solid var(--line); color: var(--fg); white-space: nowrap; }
.tag.more { background: none; border: 0; color: var(--muted); padding: 1px 2px; }
.tag button { border: 0; background: none; padding: 0 0 0 4px; color: var(--muted); }
.bulk { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 8px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); font-size: 13px; }
.bulk input { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 5px 8px; width: 120px; }
.pager { display: flex; align-items: center; gap: 6px; }
.pager span { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--muted); padding-inline: 6px; }
.dropzone { border: 1.5px dashed var(--line); border-radius: var(--radius); padding: 20px; text-align: center; color: var(--muted); display: flex; flex-direction: column; gap: 8px; align-items: center; }
.steps { margin: 0; padding-left: 18px; color: var(--muted); font-size: 13px; display: flex; flex-direction: column; gap: 4px; }

/* Back office: nav groups, tabs, home, tasks, departments */
.nav-label { font-size: 10px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); padding: 14px 10px 4px; }
.nav .lock-ico { width: 13px; height: 13px; margin-left: auto; opacity: .55; }
.nav .account-item { margin-top: 10px; border-top: 1px solid var(--line); border-radius: 0 0 8px 8px; padding-top: 12px; }
.mobile-only { display: none !important; }
.btn-ico { width: 14px; height: 14px; vertical-align: -2px; }
.linkish { border: 0; background: none; padding: 0; color: var(--brand); font-weight: 700; text-decoration: underline; text-underline-offset: 2px; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 8px 14px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--brand); border-bottom-color: var(--brand); }

.carousel { position: relative; overflow: hidden; border-radius: 14px; background: var(--brand); color: var(--brand-ink); }
.car-track { display: flex; transition: transform .5s ease; }
@media (prefers-reduced-motion: reduce) { .car-track { transition: none; } }
.slide { flex: 0 0 100%; min-width: 0; padding: 22px 28px 50px; display: flex; flex-direction: column; gap: 6px; min-height: 168px; }
.slide-eyebrow { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); font-weight: 700; }
.carousel h2.slide-title { font-family: var(--font-display); font-weight: 400; font-size: clamp(22px, 3vw, 30px); color: inherit; text-transform: none; letter-spacing: 0; text-wrap: balance; }
.slide-body { max-width: 62ch; font-size: 14px; opacity: .92; }
.slide-body p { margin: 0; }
.slide-quote { font-family: var(--font-display); font-size: 17px; line-height: 1.4; }
.slide-goals { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.slide-ph { opacity: .8; }
.slide-ph .linkish { color: inherit; }
.slide-stats { display: flex; gap: 8px 20px; flex-wrap: wrap; margin-top: 8px; font-size: 13px; }
.slide-stats b { font-size: 17px; margin-right: 4px; }
.car-ctrl { position: absolute; left: 0; right: 0; bottom: 10px; display: flex; justify-content: center; align-items: center; gap: 12px; }
.car-btn { border: 1px solid color-mix(in srgb, var(--brand-ink) 35%, transparent); background: none; color: inherit; width: 30px; height: 30px; border-radius: 50%; font-size: 16px; line-height: 1; }
.car-dots { display: flex; gap: 8px; }
.car-dots button { width: 8px; height: 8px; border-radius: 4px; border: 0; padding: 0; background: color-mix(in srgb, var(--brand-ink) 40%, transparent); transition: width .2s; }
.car-dots button[aria-current="true"] { width: 22px; background: var(--gold); }

/* home hero */
.hero { position: relative; border-radius: 16px; background: var(--brand); color: var(--brand-ink); padding: clamp(28px, 5vw, 52px) clamp(22px, 5vw, 56px); display: flex; flex-direction: column; gap: 14px; overflow: hidden; }
.hero::after { content: ""; position: absolute; inset: 10px; border: 1px solid color-mix(in srgb, var(--gold) 45%, transparent); border-radius: 10px; pointer-events: none; }
.hero-top { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--gold); font-weight: 700; }
.hero-greet { font-family: var(--font-display); font-weight: 400; font-size: clamp(26px, 4vw, 40px); line-height: 1.1; margin: 0; color: inherit; text-transform: none; letter-spacing: 0; text-wrap: balance; }
.hero-rule { width: 48px; height: 1px; background: var(--gold); border: 0; margin: 4px 0; }
.hero-q { margin: 0; max-width: 60ch; }
.hero-q blockquote { margin: 0; font-family: var(--font-display); font-style: italic; font-size: clamp(16px, 2vw, 20px); line-height: 1.45; opacity: .95; text-wrap: pretty; }
.hero-q figcaption { margin-top: 8px; font-size: 11px; letter-spacing: .18em; text-transform: uppercase; opacity: .75; }
.today { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
.today > * { padding: 16px 18px; display: flex; flex-direction: column; gap: 4px; border: 0; border-left: 1px solid var(--line); background: none; text-align: left; color: inherit; font: inherit; min-width: 0; }
.today > *:first-child { border-left: 0; }
.today button:hover { background: var(--surface-2); }
.today b { font-family: var(--font-display); font-weight: 400; font-size: 28px; line-height: 1; }
.today span { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.today .actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
@media (max-width: 720px) { .today { grid-template-columns: repeat(2, minmax(0, 1fr)); } .today > *:nth-child(3) { border-left: 0; } .today > *:nth-child(n+3) { border-top: 1px solid var(--line); } }
.quiet h2 { font-size: 11px; letter-spacing: .16em; }
.goals-line { font-size: 13px; color: var(--muted); text-align: center; padding: 4px 8px; }
.goals-line b { color: var(--gold); letter-spacing: .14em; text-transform: uppercase; font-size: 11px; margin-right: 6px; }
/* employee of the month */
.eom-card { display: flex; gap: 18px; align-items: center; border: 1px solid color-mix(in srgb, var(--gold) 55%, var(--line)); border-radius: 14px; padding: 18px 20px; background: linear-gradient(135deg, color-mix(in srgb, var(--gold) 12%, var(--surface)), var(--surface)); }
.eom-card .eyebrow { font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--gold); font-weight: 700; }
.eom-card .nm { font-family: var(--font-display); font-size: clamp(22px, 3vw, 28px); line-height: 1.15; }
.eom-card .sub { font-size: 13px; color: var(--muted); }
.eom-medal { font-size: 30px; margin-left: auto; }
.crit { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.crit > div { border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.crit b { font-family: var(--font-display); font-weight: 400; font-size: 24px; color: var(--brand); }
@media (max-width: 720px) { .crit { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.sbar { display: inline-block; width: 46px; height: 5px; border-radius: 3px; background: var(--surface-2); vertical-align: middle; margin-right: 6px; overflow: hidden; }
.sbar i { display: block; height: 100%; background: var(--gold); }
/* reviews */
.stars { color: var(--gold); letter-spacing: 1px; white-space: nowrap; }

.rv-sum { display: flex; gap: 28px; flex-wrap: wrap; align-items: center; }
.rv-avg { display: flex; flex-direction: column; gap: 2px; }
.rv-avg b { font-family: var(--font-display); font-weight: 400; font-size: 40px; line-height: 1; }
.rv-dist { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 200px; max-width: 360px; }
.rv-dist button { display: grid; grid-template-columns: 34px 1fr 34px; gap: 8px; align-items: center; border: 0; background: none; padding: 2px 0; font: inherit; font-size: 12px; color: var(--muted); text-align: left; }
.rv-dist button[aria-pressed="true"] { color: var(--fg); font-weight: 700; }
.rv-dist i { display: block; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.rv-dist i s { display: block; height: 100%; background: var(--gold); text-decoration: none; }
.rv-text { max-width: 420px; font-size: 13px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
tr.dim td { opacity: .55; }
/* salary */
.blur-amt .amt { filter: blur(7px); user-select: none; }
/* pomodoro */
.pomo { position: fixed; right: 16px; bottom: 16px; z-index: 40; display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 8px 6px 14px; box-shadow: 0 6px 24px rgb(0 0 0 / .14); font-size: 13px; }
.pomo .ph { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.pomo .tm { font-family: var(--font-display); font-size: 20px; min-width: 58px; text-align: center; }
.pomo.focus { border-color: var(--brand); }
.pomo.brk { border-color: var(--gold); }
.pomo button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 50%; width: 30px; height: 30px; padding: 0; line-height: 1; color: inherit; }
@media (max-width: 860px) { .pomo { bottom: 76px; } }
body.has-pomo #view { padding-bottom: 64px; }
.dept-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.dept-card { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 2px; position: relative; }
.dept-card:hover { border-color: var(--brand); }
.dept-card strong { font-size: 15px; }
.dept-card span { font-size: 12px; color: var(--muted); }
.dept-card .lock-ico { position: absolute; top: 12px; right: 12px; width: 15px; height: 15px; color: var(--muted); }
.lock-card { max-width: 380px; margin: 24px auto; align-items: center; text-align: center; padding: 28px; }
.lock-big { width: 34px; height: 34px; color: var(--brand); }

.tsum { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.tsum-line { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; font-size: 14px; }
.tsum-part b { font-size: 17px; }
.tsum-sep { color: var(--line); }
.tsum-bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--surface-2); }
.tsum-label { font-size: 12px; color: var(--muted); }
.s-todo { --c: var(--muted); --cb: var(--surface-2); }
.s-in_progress { --c: var(--info); --cb: var(--info-bg); }
.s-done { --c: var(--good); --cb: var(--good-bg); }
.s-cancelled { --c: var(--bad); --cb: var(--bad-bg); }
.tsum-part b { color: var(--c); }
.tsum-bar i { background: var(--c); }
.pbar { flex: 1; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; min-width: 60px; }
.pbar i { display: block; height: 100%; background: var(--brand); border-radius: 3px; }

.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--line); gap: 1px; }
.cal-h { background: var(--surface-2); font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 6px 8px; }
.cal-d { background: var(--surface); min-height: 104px; padding: 6px; display: flex; flex-direction: column; gap: 4px; cursor: pointer; min-width: 0; }
.cal-d.out { background: var(--bg); }
.cal-d.out .cal-n span { color: var(--muted); opacity: .6; }
.cal-d.picked { box-shadow: inset 0 0 0 2px var(--gold); }
.cal-n { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
.cal-d.today .cal-n span { background: var(--brand); color: var(--brand-ink); border-radius: 999px; padding: 1px 7px; }
.cal-add { border: 0; background: none; color: var(--muted); font-size: 16px; line-height: 1; padding: 0 4px; border-radius: 4px; opacity: 0; }
.cal-d:hover .cal-add, .cal-add:focus-visible { opacity: 1; }
.cal-add:hover { background: var(--surface-2); color: var(--fg); }
.cal-items { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.tpill { display: flex; align-items: center; gap: 4px; border: 0; border-left: 3px solid var(--c); background: var(--cb); color: var(--fg); border-radius: 4px; padding: 2px 5px; font-size: 11.5px; text-align: left; min-width: 0; width: 100%; }
.tpill .tt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.tpill.s-cancelled .tt { text-decoration: line-through; color: var(--muted); }
.tpill.overdue { box-shadow: inset 0 0 0 1px var(--bad); }
.tpill .ini { flex: none; font-size: 9.5px; font-weight: 800; background: var(--surface); border-radius: 999px; padding: 0 4px; color: var(--muted); }
.cal-more { font-size: 11px; color: var(--muted); padding-left: 4px; }
.cal-dots { display: none; gap: 3px; }
.cal-dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--c); }

.pack-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.pack { gap: 10px; }
.pick { margin: 0; padding: 10px 12px; list-style: none; background: var(--surface-2); border-radius: 8px; display: flex; flex-direction: column; gap: 4px; }

/* attendance */
.a-present { --c: var(--good); --cb: var(--good-bg); }
.a-late { --c: var(--warn); --cb: var(--warn-bg); }
.a-leave, .a-sick { --c: var(--info); --cb: var(--info-bg); }
.a-absent { --c: var(--bad); --cb: var(--bad-bg); }
.a-off, .a-holiday { --c: var(--muted); --cb: var(--surface-2); }
.a-notin { --c: var(--line); --cb: var(--surface); }
.tsum-part[class*="a-"] b { color: var(--c); }
.tsum-bar i[class*="a-"] { background: var(--c); }
.att-sheet { font-size: 12px; }
.att-sheet th, .att-sheet td { padding: 6px 4px; text-align: center; }
.att-sheet th { font-size: 11px; text-transform: none; letter-spacing: 0; line-height: 1.2; }
.att-sheet th small { color: var(--muted); font-weight: 500; }
.att-sheet th.wk { color: var(--muted); opacity: .6; }
.att-sheet th.now { color: var(--brand); }
.att-sheet .sticky { position: sticky; left: 0; background: var(--surface); text-align: left; padding-inline: 12px; white-space: nowrap; z-index: 1; }
.att-sheet td.r, .att-sheet th.r { text-align: right; padding-inline: 10px; }
.ac { background: var(--cb, transparent); color: var(--c, var(--muted)); font-weight: 700; font-size: 10.5px; cursor: pointer; min-width: 26px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--muted); }
.clock-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.clock-big { font-family: var(--font-display); font-size: 30px; line-height: 1; }

.av { position: relative; width: var(--sz); height: var(--sz); flex: none; display: inline-grid; place-items: center; border-radius: 50%; background: color-mix(in srgb, var(--avc) 18%, var(--surface)); color: var(--avc); box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--avc) 45%, transparent); font-weight: 700; font-size: calc(var(--sz) * .36); }
.av > img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
.av .bottle { position: absolute; right: calc(var(--sz) * -.12); bottom: calc(var(--sz) * -.08); width: max(16px, calc(var(--sz) * .42)); height: max(20px, calc(var(--sz) * .52)); padding: 2px 3px; border: 0; border-radius: 6px; background: var(--surface); box-shadow: 0 0 0 1.5px var(--line); color: var(--fg); display: grid; place-items: center; cursor: pointer; }
.av .bottle svg { width: 100%; height: 100%; }
.av .bottle.empty { opacity: .5; }
.av .bottle:hover { box-shadow: 0 0 0 1.5px var(--gold); opacity: 1; }
.av .bottle:disabled { cursor: default; }
.team-strip { display: flex; gap: 18px; overflow-x: auto; padding: 4px 2px 6px; }
.tm { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 76px; max-width: 96px; text-align: center; }
.tm strong { font-size: 13px; margin-top: 4px; }
.tm span { font-size: 11.5px; color: var(--muted); line-height: 1.25; }
.bday { display: flex; align-items: center; gap: 16px; padding: 16px 20px; border-radius: 14px; background: linear-gradient(120deg, color-mix(in srgb, var(--gold) 26%, var(--surface)), var(--surface)); border: 1px solid color-mix(in srgb, var(--gold) 50%, var(--line)); }
.bday-avs { display: flex; gap: 8px; }
.bday-title { font-family: var(--font-display); font-size: clamp(22px, 3.4vw, 30px); line-height: 1.15; }
.bday-cake { margin-left: auto; font-size: 34px; }
.otable tr.grp td { background: var(--surface-2); font-weight: 700; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; cursor: default; }
code.pw { font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; background: var(--surface-2); padding: 2px 6px; border-radius: 5px; }
html, body { overflow-x: clip; }
.av .bottle img { width: 100%; height: 100%; object-fit: contain; border-radius: 3px; }
.scent-prev { width: 56px; height: 68px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 6px; color: var(--fg); }
.scent-prev img, .scent-prev svg { width: 100%; height: 100%; object-fit: contain; }
.s-money { --c: var(--gold); --cb: color-mix(in srgb, var(--gold) 16%, var(--surface)); }
.tpill.s-money.paid .tt { text-decoration: line-through; color: var(--muted); }
.cal-dots i.s-money { background: var(--gold); }


/* department colour coding */
.nav .dept-item svg:first-child { color: var(--dc); }
.nav .dept-item[aria-current="page"] { background: var(--dc); color: #fff; }
.nav .dept-item[aria-current="page"] svg:first-child { color: #fff; }
.dept-card { border-top: 4px solid var(--dc, var(--line)); }
.dept-card strong { color: var(--dc, var(--fg)); }
.tabs button[aria-selected="true"] { color: var(--dc, var(--brand)); border-bottom-color: var(--dc, var(--brand)); }
h1.dept-title { display: inline-flex; align-items: center; gap: 10px; }
h1.dept-title::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--dc); }
.dchip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; }
.dchip::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--dc); }
/* home orders */
.orders-home { border-top: 4px solid var(--dc); }
.otiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.otile { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface-2); text-align: left; min-height: 76px; cursor: pointer; }
.otile b { font-size: 28px; line-height: 1; }
.otile span { font-size: 13px; font-weight: 600; color: var(--muted); }
.otile:hover { border-color: var(--dc); }
.otile.hot { background: color-mix(in srgb, var(--dc) 16%, var(--surface)); border-color: color-mix(in srgb, var(--dc) 55%, var(--line)); }
.otile.hot span { color: var(--fg); }
.olist { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.orow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 12px 14px; border: 0; border-bottom: 1px solid var(--line); background: var(--surface); text-align: left; cursor: pointer; min-height: 56px; }
.orow:last-child { border-bottom: 0; }
.orow:hover { background: var(--surface-2); }
.ocust { display: flex; flex-direction: column; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ocust small { font-weight: 500; color: var(--muted); font-size: 12px; }
.ototal { font-weight: 700; }
.slide-link { border: 0; background: none; color: inherit; padding: 0; font: inherit; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: color-mix(in srgb, currentColor 40%, transparent); }
/* listings */
.lgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
.lcard { display: flex; flex-direction: column; text-align: left; padding: 0; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); overflow: hidden; cursor: pointer; color: var(--fg); }
.lcard:hover { border-color: var(--dc, var(--brand)); }
.lcard .lphoto { width: 100%; height: 170px; border-radius: 0; border: 0; border-bottom: 1px solid var(--line); }
.lphoto { width: 96px; height: 96px; flex: none; display: grid; place-items: center; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; color: var(--gold); }
.lphoto img { width: 100%; height: 100%; object-fit: contain; background: #fff; }
.lphoto > span, .lphoto > svg { width: 34px; height: 42px; display: block; opacity: .7; }
.lphoto > span svg { width: 100%; height: 100%; }
.lphoto.sm { width: 48px; height: 48px; }
.lbody { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 4px; }
.lname { font-weight: 700; font-size: 13.5px; line-height: 1.3; }
.lprice b { font-size: 16px; } .lprice s { color: var(--muted); font-size: 12px; }
.lchips { display: flex; gap: 4px; flex-wrap: wrap; }
/* scanning */
.scanbar { border-top: 4px solid var(--dc); }
.scanrow { display: flex; gap: 8px; flex-wrap: wrap; }
.scanrow input { flex: 1; min-width: 200px; font-size: 16px; padding: 11px 12px; border: 2px solid color-mix(in srgb, var(--dc) 45%, var(--line)); border-radius: 10px; background: var(--bg); color: var(--fg); }
.scanrow input:focus { outline: none; border-color: var(--dc); }
.scanres { display: flex; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); }
@media (max-width: 720px) { .otiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } .orow { grid-template-columns: auto minmax(0, 1fr) auto; } .orow .badge { display: none; } .lgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .lcard .lphoto { height: 130px; } }

.shop-chip { display: inline-flex; align-items: center; gap: 6px; font: inherit; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); cursor: pointer; }
.shop-chip i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.shop-chip.ok { color: var(--fg); } .shop-chip.ok i { background: #16A34A; box-shadow: 0 0 0 3px color-mix(in srgb, #16A34A 22%, transparent); }
.shop-chip.syncing i { background: var(--gold); animation: shoppulse 1s infinite alternate; }
.shop-chip.error i, .shop-chip.blocked i { background: var(--bad); }
.shop-chip.off { cursor: default; }

.shop-msg { font-size: 12px; color: var(--bad); }
.shop-slot { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-left: auto; margin-right: 8px; }
.shop-line { display: flex; margin: 0 0 10px; }
.shop-line:empty { display: none; }
th.sortable { cursor: pointer; user-select: none; white-space: nowrap; }
th.sortable:hover { color: var(--fg); }
th .sarr { margin-left: 4px; font-size: 10px; opacity: .45; }
th[aria-sort="ascending"] .sarr, th[aria-sort="descending"] .sarr { opacity: 1; color: var(--dc, var(--brand)); }
.wb-set { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; font-size: 13px; margin-top: 10px; }
.wb-set label { display: inline-flex; gap: 6px; align-items: center; }
.wb-set select, #pack-filter, .bulk select, .wb-in { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 9px; width: auto; }
.wb-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.wb-row .wb-in { flex: 1; min-width: 160px; }
.wb-done { width: 100%; font-size: 13px; }
.ei-row { display: grid; grid-template-columns: minmax(0, 1fr) 70px 110px auto; gap: 6px; }
.status.st-orange { background: var(--orange-bg); color: var(--orange); border-color: transparent; }
.status.st-amber { background: var(--amber-bg); color: var(--amber); border-color: transparent; }
.status.st-green { background: var(--good-bg); color: var(--good); border-color: transparent; }
.status.st-red { background: var(--bad-bg); color: var(--bad); border-color: transparent; }
.status.st-violet { background: color-mix(in srgb, #8B5CF6 14%, var(--surface)); color: #7C3AED; border-color: transparent; }
.status.st-blue { background: color-mix(in srgb, #3B82F6 14%, var(--surface)); color: #2563EB; border-color: transparent; }
.status.st-teal { background: color-mix(in srgb, #0D9488 14%, var(--surface)); color: #0F766E; border-color: transparent; }
.status.st-grey { background: var(--surface-2); color: var(--fg); border-color: transparent; }
.items-btn { border: 1px dashed var(--line); background: none; border-radius: 6px; padding: 2px 8px; font: inherit; font-size: 13px; cursor: pointer; color: inherit; }
.items-btn:hover { border-color: var(--fg); }
.ipop { position: fixed; z-index: 40; width: min(380px, calc(100vw - 16px)); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 12px 32px rgba(0,0,0,.18); padding: 12px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.ipop-h { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); } .ipop-h b { color: var(--fg); }
.ipop-i { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; padding: 4px 0; border-top: 1px solid var(--line); }
.ipop-t { display: flex; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 6px; }
.from { display: inline-block; font-size: 11px; font-weight: 700; padding: 0 6px; border-radius: 5px; background: var(--info-bg); color: var(--info); }
.olog { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); font-size: 11px; color: var(--muted); display: flex; flex-direction: column; gap: 3px; }
.olog-h { font-weight: 700; text-transform: uppercase; letter-spacing: .06em; font-size: 10px; }
.olog b { color: var(--fg); font-weight: 600; } .olog span { opacity: .8; }
.supbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 0 0 10px; }
.supbar .lab { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-right: 4px; }
.supbar button[data-sup] { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 11px; font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer; color: inherit; }
.supbar button[data-sup] span { opacity: .55; margin-left: 2px; }
.supbar button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.colrows { display: flex; flex-direction: column; gap: 4px; }
.colrow { display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; }
.colrow label { display: flex; gap: 8px; align-items: center; font-weight: 600; }
.radio-line { display: flex; gap: 8px; align-items: center; font-size: 13.5px; padding: 4px 0; font-weight: 400; }
.wb-cell .wb-row { flex-wrap: nowrap; } .wb-cell .wb-in { min-width: 130px; }
.bigsearch { display: flex; align-items: center; gap: 10px; border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 4px 14px; position: relative; }
.bigsearch:focus-within { border-color: var(--fg); }
.bigsearch svg { width: 20px; height: 20px; color: var(--muted); flex: none; }
.bigsearch input { border: 0; background: none; font-size: 16px; padding: 10px 0; flex: 1; min-width: 0; outline: none; }
.sx { border: 0; background: var(--surface-2); color: var(--fg); border-radius: 999px; width: 26px; height: 26px; font-size: 12px; cursor: pointer; flex: none; margin-left: -4px; }
.toolbar .sx { align-self: center; }
.cust-link { border: 0; background: none; padding: 0; font: inherit; color: inherit; text-align: left; cursor: pointer; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
.cust-link:hover { text-decoration-color: currentColor; }
.nicons { border: 0; background: none; padding: 0 0 0 6px; cursor: pointer; color: var(--muted); display: inline-flex; gap: 4px; vertical-align: middle; }
.nicons .ni { display: inline-flex; align-items: center; gap: 1px; } .nicons svg { width: 15px; height: 15px; } .nicons b { font-size: 10px; }
.nicons:hover { color: var(--fg); }

  else if (ch.tags) { const f = fulFromTags(o.fulfillment, ch.tags); if (f !== o.fulfillment) { upd.fulfillment = f; ch = { ...ch, fulfillment: f }; } }
  if (ch.fulfillment && ch.fulfillment !== o.fulfillment) {
    if (ch.fulfillment === "fulfilled") upd.fulfilledAt = o.fulfilledAt || now;
    if (ch.fulfillment === "delivered") { upd.deliveredAt = now; upd.fulfilledAt = o.fulfilledAt || now; }
  }
  if (ch.payment && ch.payment !== o.payment) {
    const was = isVoid(o), will = VOIDPAY.has(ch.payment);

    if (was && !will) { upd.voidedAt = 0; if (!o.noStock && o.restocked) { upd.restocked = false; stockDelta = -1; } }
  }
  const L = { payment: ["Payment Status", v => pay(v).name], fulfillment: ["Fulfillment Status", v => ful(v).name], courier: ["Courier", v => v], tracking: ["Tracking #", v => v || "(cleared)"], assignee: ["Assigned to", v => v ? memberName(v) : "Unassigned"] };
  const msgs = [];
  for (const [k, [lab, f]] of Object.entries(L)) if (upd[k] !== undefined && upd[k] !== (o[k] ?? (k === "courier" ? courierOf(o) : undefined))) msgs.push(`changed ${lab} → ${f(upd[k])}`);
  if (upd.tags) { const add = upd.tags.filter(t => !(o.tags || []).includes(t)), rm = (o.tags || []).filter(t => !upd.tags.includes(t)); if (add.length) msgs.push(`added tag ${add.join(", ")}`); if (rm.length) msgs.push(`removed tag ${rm.join(", ")}`); }

  const by = upd._by; delete upd._by;

  if (stockDelta) for (const i of o.items || []) if (i.productId) await adjustStock(i.productId, stockDelta * (Number(i.qty) || 0));
  return stockDelta;
}

function parseTable(text) {
  text = String(text || "").replace(/\r\n?/g, "\n");
  const delim = text.includes("\t") ? "\t" : ",";
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; continue; }
    if (ch === '"' && cell === "") { q = true; continue; }
    if (ch === delim) { row.push(cell); cell = ""; continue; }
    if (ch === "\n") { row.push(cell); rows.push(row); row = []; cell = ""; continue; }
    cell += ch;
  }
  if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
  return rows.map(r => r.map(c => c.trim())).filter(r => r.some(Boolean));
}

function loginRows(text) {
  const rows = parseTable(text); if (!rows.length) return [];
  const H = rows[0].map(h => h.toLowerCase());
  const ix = {
    account: headIdx(H, h => /^(account|platform|app|site|service)$/.test(h)),
    accountName: headIdx(H, h => /name/.test(h) && !/user/.test(h)),
    username: headIdx(H, h => /user|email|e-mail|login/.test(h)),
    pw: headIdx(H, h => /pass|^pw$|pin/.test(h)),
    phone: headIdx(H, h => /phone|mobile|contact|number/.test(h)),
    url: headIdx(H, h => /link|url|website/.test(h)),
    notes: headIdx(H, h => /note|remark/.test(h)),
    status: headIdx(H, h => /status/.test(h)),
  };
  if (ix.account < 0) ix.account = headIdx(H, h => /account/.test(h) && !/name/.test(h));
  const hasHead = ix.account >= 0 || ix.pw >= 0 || ix.username >= 0;
  if (!hasHead) Object.assign(ix, { account: 0, accountName: 1, username: 2, pw: 3, phone: 4, notes: 5, url: -1, status: -1 });
  const g = (r, k) => ix[k] >= 0 ? (r[ix[k]] || "") : "";
  let section = "active"; const out = [];
  for (const r of rows.slice(hasHead ? 1 : 0)) {
    const filled = r.filter(Boolean);
    if (filled.length === 1 && !g(r, "pw") && !g(r, "username")) { section = /inactive|old|closed|unused/i.test(filled[0]) ? "inactive" : "active"; continue; }
    if (!g(r, "account")) continue;
    const st = g(r, "status");
    out.push({ account: g(r, "account"), accountName: g(r, "accountName"), username: g(r, "username"), pw: g(r, "pw"), phone: g(r, "phone"), url: g(r, "url"), notes: g(r, "notes"), status: st ? (/inactive|old|closed/i.test(st) ? "inactive" : "active") : section });
  }
  return out;
}

const pomoState = () => { try { return JSON.parse(localStorage.getItem("rs-pomo") || "null"); } catch (e) { return S.pomoMem || null; } };

async function eomDraw() {
  const ym = eomMonth(), rec = eomRec(ym), cfg = eomCfg();
  if (rec.perfectWinner || rec.potAdd) return;
  const pool = eomScores(ym).filter(r => r.perfect && r.m.id !== rec.winner);
  if (!pool.length) { await save("eom", ym, { ...clean(rec), potAdd: cfg.perfectBonus }); toast(`${peso(cfg.perfectBonus)} added to the year-end pot.`); return; }
  const pickR = pool[crypto.getRandomValues(new Uint32Array(1))[0] % pool.length];
  await save("eom", ym, { ...clean(rec), perfectWinner: pickR.m.id, drawPool: pool.map(r => r.m.id), drawAt: Date.now() });
  toast(`🎉 ${memberName(pickR.m.id)} wins the perfect attendance draw!`);
}
async function eomBonus(mid, amt, kind) {
  const ym = eomMonth(), rec = eomRec(ym);
  const t = mToday(), key = `${t.slice(0, 7)}-${Number(t.slice(8)) <= 15 ? "A" : "B"}`, id = key + "_" + mid;
  const ps = S.payroll.find(x => x.id === id) || {};
  if (ps.status === "paid") return toast("That payslip is already paid. Add the bonus on the next one in Finance → Payroll.");
  const note = `${kind === "winner" ? "Employee of the Month bonus" : "Perfect attendance draw"} (${monthLabel(ym)})`;
  await save("payroll", id, { ...clean(ps), period: key, memberId: mid, incentives: (Number(ps.incentives) || 0) + amt, notes: [ps.notes, note].filter(Boolean).join(" · "), status: ps.status || "draft", updatedAt: Date.now() });
  await save("eom", ym, { ...clean(rec), bonus: { ...(rec.bonus || {}), [kind]: { amt, payslip: id, at: Date.now() } } });
  toast(`${peso(amt)} added to ${memberName(mid)}'s current payslip as Incentives.`);
}
async function saveEomCfg() {
  const weights = Object.fromEntries(EOM_CRIT.map(c => [c.k, Math.max(0, Math.round(numv("ew-" + c.k)))]));
  if (!Object.values(weights).some(Boolean)) return toast("Give at least one criterion some points.");
  if (numv("ew-bonus") + numv("ew-pbonus") > EOM_BUDGET) return toast(`The two prizes add up to ${peso(numv("ew-bonus") + numv("ew-pbonus"))}. Keep them within ${peso(EOM_BUDGET)}.`);
  const data = { weights, bonus: numv("ew-bonus"), perfectBonus: numv("ew-pbonus"), rewards: val("ew-rewards") || EOM_DEFAULT.rewards, updatedAt: Date.now() };
  if (S.db) await S.db.doc("config/eom").set(data); else S.eomSettings = data;
  toast("Criteria and rewards saved."); render();
}

function resizeImage(file, max = 256, square = true) {

  </div>`;
  const monthNav = `<div class="head"><div class="pager"><button class="btn sm" type="button" data-tmonth="-1" aria-label="Previous month">‹</button><strong style="min-width:150px;text-align:center">${monthLabel(ym)}</strong><button class="btn sm" type="button" data-tmonth="1" aria-label="Next month">›</button><button class="btn ghost sm" type="button" data-tmonth="0">Today</button></div></div>`;

    const sorted = [...monthTasks].sort((a, b) => (a.due || "").localeCompare(b.due || ""));

      <thead><tr><th>Task</th><th>Assigned to</th><th>Department</th><th>Due</th><th>Progress</th><th>Status</th></tr></thead>

  }
  const extra = forceDept ? workload(monthTasks, "person")
    : S.t.scope === "team" ? workload(monthTasks, "person")
    : S.t.scope === "dept" && !S.t.dept ? workload(monthTasks, "dept")

    </div>

      <div class="field"><label for="k-pri">Priority</label><select id="k-pri" ${ro ? "disabled" : ""}>${PRIORITIES.map(p => `<option value="${p.id}" ${t.priority === p.id ? "selected" : ""}>${p.name}</option>`).join("")}</select></div>
    </div>

    ${id && t.createdByName ? `<div style="font-size:12px;color:var(--muted)">Added by ${esc(t.createdByName)}${t.createdAt ? " · " + relTime(t.createdAt) : ""}</div>` : ""}
    <div id="sheet-err" class="confirm" hidden></div>

  ro ? null : async () => {
    if (!val("k-title")) return sheetError("Give the task a name.");
    const start = "", due = val("k-due");
    const status = val("k-status");
    let progress = Math.round(numv("k-prog"));
    if (status === "done") progress = 100;
    const data = { ...(id ? clean(t) : {}), title: val("k-title"), notes: val("k-notes"), department: val("k-dept"), assigneeId: val("k-who"), start: start && start !== due ? start : "", due, status, progress, priority: val("k-pri"), updatedAt: Date.now() };

    if (due) { S.t.day = due; S.t.month = due.slice(0, 7); }
    closeSheet(); toast(id ? "Task updated." : "Task added.");
  });
}

async function sha(text) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
}
async function tryUnlock() {
  const d = S.dept, rec = S.security[d], pw = val("unlock-pw");
  if (!rec || !pw) return;
  if ((await sha(rec.salt + ":" + pw)) === rec.hash) { S.unlocked.add(d); saveUnlocked(); render(); toast(d === "CEO" ? "CEO unlocked: every department is open." : d === "ADMIN" ? "Admin unlocked: every department except CEO is open." : `${dept(d).name} unlocked.`); }
  else { const e = $("#unlock-err"); if (e) e.hidden = false; $("#unlock-pw").value = ""; $("#unlock-pw").focus(); }
}

    <div style="font-size:13px;color:var(--muted)">Who sees what: <strong>CEO</strong> sees every department, <strong>Admin</strong> sees all except CEO, everyone else sees only their own department (from Directory). The CEO password opens everything; the Admin password opens everything except CEO.</div>
    <div class="notice" style="background:var(--surface-2);color:var(--muted);font-weight:500">These passwords keep each department's pages out of view for staff who don't need them. They aren't bank-level security: anyone you share this app with can technically reach its data. Share the app only with your team, and change a password when someone leaves.</div>

async function setPassword(d, clear) {
  const next = { ...S.security };
  if (clear) delete next[d];
  else {
    const pw = val("pw-" + d);
    if (pw.length < 4) { toast("Use at least 4 characters."); return; }
    const salt = Math.random().toString(36).slice(2) + Date.now().toString(36);
    next[d] = { salt, hash: await sha(salt + ":" + pw), setAt: Date.now() };
  }
  await S.db?.doc("config/security").set(next);
  if (!S.db) S.security = next;
  render(); toast(clear ? `${dept(d).name} password removed.` : `${dept(d).name} password saved. Share it with that team.`);
}

/* ---------- orders: stats strip ---------- */
function rangeBounds() {
  const now = new Date(), start = new Date(today() + "T00:00:00").getTime();
  const days = { today: 1, "7d": 7, "30d": 30 }[S.of.range];
  const from = start - (days - 1) * 864e5, to = now.getTime() + 1;
  const len = start + 864e5 - from;
  return { from, to, prevFrom: from - len, prevTo: from, buckets: days === 1 ? 24 : days, bucketMs: days === 1 ? 36e5 : 864e5 };
}
function metricSeries(fn) {
  const b = rangeBounds();
  const series = Array(b.buckets).fill(0);
  let cur = 0, prev = 0;
  for (const o of S.orders) for (const [t, v] of fn(o)) {
    if (!t) continue;
    if (t >= b.from && t < b.to) { cur += v; const i = Math.min(b.buckets - 1, Math.floor((t - b.from) / b.bucketMs)); series[i] += v; }
    else if (t >= b.prevFrom && t < b.prevTo) prev += v;
  }
  return { cur, prev, series };
}
function spark(series) {
  const w = 90, h = 26, max = Math.max(1, ...series.map(Math.abs));
  const pts = series.map((v, i) => `${(i / Math.max(1, series.length - 1) * (w - 2) + 1).toFixed(1)},${(h - 2 - Math.abs(v) / max * (h - 4)).toFixed(1)}`).join(" ");
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" aria-hidden="true"><line x1="0" y1="${h - 1.5}" x2="${w}" y2="${h - 1.5}"/><polyline points="${pts}"/></svg>`;
}
function delta(cur, prev, invert) {
  if (!prev && !cur) return `<span class="delta flat">–</span>`;
  if (!prev) return `<span class="delta ${invert ? "down" : "up"}">new</span>`;
  const pct = Math.round((Math.abs(cur) - Math.abs(prev)) / Math.abs(prev) * 100);
  if (pct === 0) return `<span class="delta flat">0%</span>`;
  const up = pct > 0, good = invert ? !up : up;
  return `<span class="delta ${good ? "up" : "down"}">${up ? "↗" : "↘"} ${Math.abs(pct).toLocaleString("en-PH")}%</span>`;
}
function statsStrip() {
  const m = memo("stats", [S.orders, S.orders.length, S.of.range, today()], () => [
    ["Orders", metricSeries(o => [[o.createdAt, 1]]), v => v.toLocaleString("en-PH")],
    ["Items ordered", metricSeries(o => isVoid(o) ? [] : [[o.createdAt, itemCount(o)]]), v => v.toLocaleString("en-PH")],
    ["Sales reversals", metricSeries(o => isVoid(o) ? [[o.voidedAt || o.createdAt, -total(o)]] : []), v => peso2(v), true],
    ["Orders fulfilled", metricSeries(o => [[o.fulfilledAt, 1]]), v => v.toLocaleString("en-PH")],
    ["Orders delivered", metricSeries(o => [[o.deliveredAt, 1]]), v => v.toLocaleString("en-PH")],
  ]);
  return `<div class="strip">

async function traceItems(o) {

  if (!S.mcp) { toast("Open the app in claude.ai with Shopify connected to look this up."); return; }

      const p = await shopCall(`query RSByName($q: String!) { orders(first: 5, query: $q) { nodes { name lineItems(first: 50) { nodes { name quantity } } } } }`, { q: "name:" + n }, 5);
      for (const node of (dig(p, "orders") || {}).nodes || []) if (String(node.name).replace(/^#/, "").toUpperCase() === n) for (const li of (node.lineItems || {}).nodes || []) if (!map.has(li.name)) map.set(li.name, n);
    } catch (e) {}
  }
  if (!map.size) { toast("Shopify has no separate orders under those numbers."); return; }
  const items = (o.items || []).map(i => i.from || !map.has(i.name) ? i : { ...i, from: map.get(i.name) });
  await patch("orders", o.id, { items, log: logAdd(o, ["matched each item to its order # from Shopify"]) });

/* ---------- J&T VIP booking export (simple CSV / copy) ---------- */
function shipOf(o) {
  if (o.ship && (o.ship.address1 || o.ship.city)) return { name: o.ship.name || o.customer || "", phone: o.ship.phone || o.phone || "", ...o.ship };
  const parts = (o.address || "").split(",").map(x => x.trim()).filter(Boolean);
  const country = /philippines/i.test(parts[parts.length - 1] || "") ? parts.pop() : "";
  const zip = /^\d{4}$/.test(parts[parts.length - 1] || "") ? parts.pop() : "";
  const province = parts.length > 2 ? parts.pop() : "", city = parts.length > 1 ? parts.pop() : "";
  const address2 = parts.length > 1 ? parts.pop() : "";
  return { name: o.customer || "", phone: o.phone || "", address1: parts.join(", "), address2, city, province, zip, country };
}
function jntRows() {
  const sel = S.orders.filter(o => S.sel.has(o.id));
  const list = sel.length ? sel : packList().filter(o => courierOf(o) === "J&T");
  return [["Order No.", "Receiver Name", "Receiver Phone", "Province", "City/Municipality", "Barangay", "Street Address", "Zip Code", "Item Name", "Quantity", "Weight (kg)", "COD Amount", "Declared Value", "Remarks"],
    ...list.map(o => { const sh = shipOf(o); return [onum(o), sh.name || o.customer, (sh.phone || o.phone || "").replace(/^\+63/, "0"), sh.province, sh.city, sh.address2, sh.address1, sh.zip, (o.items || []).map(i => `${i.qty}x ${i.name}`).join("; ").slice(0, 120), itemCount(o), "", o.payment === "paid" ? 0 : o.payment === "pending" ? total(o) : "", total(o), o.note || ""]; })];
}
async function jntExport() {

async function bulkAction(kind) {
  const targets = S.orders.filter(o => S.sel.has(o.id));
  if (kind === "clear") { S.sel.clear(); render(); return; }
  if (kind === "archive") { for (const o of targets) await archiveOrder(o, ""); toast(`Archived ${targets.length} order${targets.length === 1 ? "" : "s"}.`); S.sel.clear(); render(); return; }
  if (kind === "tag") {
    const t = val("bulk-tag").toUpperCase(); if (!t) { toast("Type a tag first."); return; }
    for (const o of targets) if (!(o.tags || []).includes(t)) await updateOrder(o, { tags: [...(o.tags || []), t] });
    toast(`Added ${t} to ${targets.length} order${targets.length === 1 ? "" : "s"}.`);
  } else {
    const ch = kind === "paid" ? { payment: "paid" } : kind.startsWith("pay:") ? { payment: kind.slice(4) } : { fulfillment: kind.replace(/^ful:/, "") };
    const risky = ["unfulfilled", "fulfilled"].includes(ch.fulfillment) ? targets.filter(isDispute) : [];
    const go = targets.filter(o => !risky.includes(o));
    for (const o of go) await updateOrder(o, ch);
    toast(`Updated ${go.length} order${go.length === 1 ? "" : "s"}.` + (risky.length ? ` ⚠️ Skipped ${risky.map(onum).join(", ")}: DISPUTE tag. Open each one to check and update it.` : ""));
  }
  S.sel.clear(); render();
}

// Remembers a result until its inputs change (same arrays, same settings), so redraws stay fast.
const _memo = new Map();
function memo(name, deps, fn) { const m = _memo.get(name); if (m && m.deps.length === deps.length && m.deps.every((d, i) => d === deps[i])) return m.v; const v = fn(); _memo.set(name, { deps, v }); return v; }
const customerList = () => memo("cust", [S.orders, S.orders.length, S.customers, S.customers.length], customerListRaw);
function customerListRaw() {
  const map = new Map(), byName = new Map();
  for (const c of S.customers) {
    const k = custKey(c); if (!k) continue;
    if (c.name) byName.set(c.name.toLowerCase(), k);
    map.set(k, { ...c, docId: c.id, platforms: new Set(c.shopifyOrders ? ["Website"] : []), base: { orders: c.shopifyOrders || 0, spent: c.shopifySpent || 0 }, imp: { orders: 0, spent: 0 }, man: { orders: 0, spent: 0 }, last: 0, orderIds: [], example: false });
  }
  for (const o of S.orders) {
    const name = (o.customer || "").trim();
    const k = (o.email && map.has(o.email.toLowerCase())) ? o.email.toLowerCase() : (o.email || name.toLowerCase());
    if (!k) continue;
    let c = map.get(k) || (byName.has(name.toLowerCase()) ? map.get(byName.get(name.toLowerCase())) : null);
    if (!c) { if (name) byName.set(name.toLowerCase(), k); c = { name: name || o.email, email: o.email || "", phone: "", address: "", tags: [], platforms: new Set(), base: null, imp: { orders: 0, spent: 0 }, man: { orders: 0, spent: 0 }, last: 0, orderIds: [], example: true }; map.set(k, c); }
    if (!isVoid(o)) { const b = o.imported ? c.imp : c.man; b.orders++; b.spent += total(o); }
    c.platforms.add(plat(o.platform));
    if (!c.phone && o.phone) c.phone = o.phone;
    if (!c.address && o.address) c.address = o.address;
    if ((o.createdAt || 0) > c.last) c.last = o.createdAt;
    c.orderIds.push(o.id);
    if (!o.example) c.example = false;
  }
  return [...map.values()].map(c => {
    const shop = c.base && c.base.orders ? c.base : c.imp;
    return { ...c, orders: shop.orders + c.man.orders, spent: shop.spent + c.man.spent };
  }).sort((a, b) => b.spent - a.spent);
}

function viewCustomers() {

  const all = customerList();
  const cs = S.csort || { sort: "spent", dir: "desc" };
  const assigneeOf = c => { const os = c.orderIds.map(id => S.orders.find(o => o.id === id)).filter(o => o && o.assignee).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)); return os[0] ? os[0].assignee : ""; };
  const CS = { name: c => (c.name || "").toLowerCase(), phone: c => c.phone || "", loc: c => (c.city || c.address || "").toLowerCase(), assigned: c => assigneeOf(c) ? memberName(assigneeOf(c)).toLowerCase() : "~", channels: c => [...c.platforms].join(), orders: c => c.orders, spent: c => c.spent, last: c => c.last || 0, tags: c => (c.tags || []).join() };
  const rows = all.filter(c => !q || [c.name, c.email, c.phone, c.address, ...(c.tags || [])].join(" ").toLowerCase().includes(q)).sort((a, b) => { const f = CS[cs.sort] || CS.spent, x = f(a), y = f(b); return (typeof x === "string" ? x.localeCompare(y, "en", { numeric: true }) : x - y) * (cs.dir === "asc" ? 1 : -1); });
  const pages = Math.max(1, Math.ceil(rows.length / PAGE)); if (S.cpage >= pages) S.cpage = pages - 1;
  const page = rows.slice(S.cpage * PAGE, S.cpage * PAGE + PAGE);
  const repeat = all.filter(c => c.orders > 1).length;
  const sum = all.reduce((a, c) => a + c.spent, 0);
  return `
  <div class="kpis">
    <div class="kpi"><span class="label">Customers</span><span class="value">${all.length.toLocaleString("en-PH")}</span></div>
    <div class="kpi"><span class="label">Repeat buyers</span><span class="value">${repeat.toLocaleString("en-PH")}</span><span class="sub">${all.length ? Math.round(repeat / all.length * 100) : 0}% of customers</span></div>
    <div class="kpi"><span class="label">Lifetime sales</span><span class="value">${peso(sum)}</span></div>
    <div class="kpi"><span class="label">Avg per customer</span><span class="value">${peso(all.length ? sum / all.length : 0)}</span></div>
  </div>
  <div class="toolbar"><input id="cq" type="search" placeholder="Search name, email, phone, city or tag" value="${esc(S.cq)}" aria-label="Search customers"></div>
  <div class="table-wrap"><table class="otable" data-own="1">
    <thead><tr>${[["name", "Customer"], ["phone", "Phone"], ["loc", "Location"], ["assigned", "Assigned to"], ["channels", "Channels"], ["orders", "Orders", "r"], ["spent", "Amount spent", "r"], ["last", "Last order"], ["tags", "Tags"]].map(([k, l, c]) => sortTh(k, l, c || "", cs, "csort")).join("")}</tr></thead>
    <tbody>${page.map(c => `<tr data-cust="${esc(custKey(c))}">
      <td><div style="font-weight:600">${esc(c.name)}${c.example ? ' <span class="chip ex">Example</span>' : ""}${c.orders > 1 ? ' <span class="chip good">Repeat</span>' : ""}</div><div class="s">${esc(c.email || "")}</div></td>
      <td class="nowrap">${esc(c.phone || "")}</td>
      <td>${esc(c.city || (c.address || "").split(",").slice(-3, -2)[0] || "")}</td>
      <td>${canAll() && c.orderIds.length ? `<select class="status st-grey" data-cassign="${esc(custKey(c))}" aria-label="Assigned to"><option value="">Unassigned</option>${salesTeam().map(m => `<option value="${m.id}" ${assigneeOf(c) === m.id ? "selected" : ""}>${esc(m.nickname || m.name)}</option>`).join("")}</select>` : esc(assigneeOf(c) ? memberName(assigneeOf(c)) : "–")}</td>
      <td>${[...c.platforms].map(esc).join(", ")}</td>
      <td class="r num">${c.orders.toLocaleString("en-PH")}</td>

  </table>${rows.length ? "" : `<div class="empty" style="padding:16px">${all.length ? "No customers match." : "No customers yet. Click “Import from Shopify” to bring in your customer list, or they'll appear automatically from orders."}</div>`}</div>
  <div class="head"><div class="pager">
    <button class="btn sm" type="button" data-cpage="-1" ${S.cpage === 0 ? "disabled" : ""} aria-label="Previous page">‹</button>

function viewExpenses() {
  const rows = S.expenses.filter(e => inPeriod(e.date)).sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  const tot = rows.reduce((a, e) => a + (Number(e.amount) || 0), 0);
  const byCat = EXP_CATS.map(c => ({ c, v: rows.filter(e => e.category === c).reduce((a, e) => a + (Number(e.amount) || 0), 0) })).filter(x => x.v > 0).sort((a, b) => b.v - a.v);
  const max = Math.max(1, ...byCat.map(x => x.v));
  return `
  <div class="head">${periodSeg()}</div>
  <div class="grid-2">
    <section class="panel"><h2>Total ${periodLabel()}</h2><div class="kpi" style="border:0;padding:0"><span class="value">${peso(tot)}</span><span class="sub">${rows.length} expense${rows.length === 1 ? "" : "s"}</span></div></section>
    <section class="panel"><h2>By category</h2><div class="bars">${byCat.map(x => `<div class="bar-row"><span>${esc(x.c)}</span><div class="bar-track"><div class="bar-fill" style="width:${(x.v / max * 100).toFixed(1)}%;background:var(--gold)"></div></div><span class="num">${peso(x.v)}</span></div>`).join("") || `<div class="empty">No expenses ${periodLabel()}.</div>`}</div></section>
  </div>
  <div class="table-wrap"><table>
    <thead><tr><th>Date</th><th>Category</th><th>Note</th><th class="r">Amount</th><th></th></tr></thead>
    <tbody>${rows.map(e => `<tr><td class="num">${fmtDate(e.date)}</td><td>${esc(e.category)}${exChip(e)}</td><td>${esc(e.note || "")}</td><td class="r num" style="font-weight:700">${peso(e.amount)}</td><td class="r">${S.readOnly ? "" : `<button class="btn ghost sm" type="button" data-act="edit-expense" data-id="${e.id}">Edit</button>`}</td></tr>`).join("")}</tbody>
  </table>${rows.length ? "" : `<div class="empty" style="padding:16px">No expenses ${periodLabel()}. Log ingredients, packaging, ads and other costs so net profit stays accurate.</div>`}</div>`;
}

/* ---------- sheets (forms) ---------- */
let sheetSubmit = null;
S.sheetStack = []; S.sheetCur = null;
function openSheet(html, onSubmit) {
  const open = !$("#scrim").hidden, next = S.sheetReopen || null; S.sheetReopen = null;
  if (!open) S.sheetStack = [];
  else if (!S.sheetNoPush && S.sheetCur) S.sheetStack.push(S.sheetCur);
  S.sheetNoPush = false; S.sheetCur = next;
  if (S.sheetStack.length) html = `<button class="btn ghost sm sheet-back" type="button" data-act="sheet-back">← Back</button>` + html;
  $("#sheet").innerHTML = html; $("#sheet").scrollTop = 0;
  sheetSubmit = onSubmit;
  $("#scrim").hidden = false;
  const f = $("#sheet").querySelector("input:not([type=file]), select, textarea"); if (f) f.focus();
}
function closeSheet() {
  const sh0 = $("#sheet"); if (sh0) sh0.classList.remove("wide"); $("#scrim").hidden = true; $("#sheet").innerHTML = ""; sheetSubmit = null; S.sheetStack = []; S.sheetCur = null; render(); }
const val = id => { const el = document.getElementById(id); return el ? el.value.trim() : ""; };
const numv = id => Number(val(id)) || 0;
function sheetError(msg) { const el = $("#sheet-err"); if (el) { el.textContent = msg; el.hidden = false; } }
const parseTags = s => [...new Set(s.split(",").map(t => t.trim().toUpperCase()).filter(Boolean))];
const opts = (list, sel) => list.map(s => `<option value="${s.id}" ${sel === s.id ? "selected" : ""}>${s.name}</option>`).join("");
function allTags() { const m = new Map(); for (const o of S.orders) for (const t of o.tags || []) m.set(t, (m.get(t) || 0) + 1); return [...m.entries()].sort((a, b) => b[1] - a[1]).map(x => x[0]); }
function tagField(tags) {
  const sug = ["DISPUTE", ...allTags().filter(t => t !== "DISPUTE").slice(0, 14)];
  return `<div class="field"><label for="o-tags">Tags (comma separated)</label><input id="o-tags" value="${esc((tags || []).join(", "))}" placeholder="e.g. 1.AA, 6.BILLED, 8.FWD" autocomplete="off">
    ${sug.length ? `<div class="tags" style="flex-wrap:wrap;margin-top:4px">${sug.map(t => `<button type="button" class="tag" data-addtag="${esc(t)}">+ ${esc(t)}</button>`).join("")}</div>` : ""}</div>`;
}

function productOptions(sel) {
  return `<option value="">Choose product…</option>` + [...S.products].sort((a, b) => (a.name || "").localeCompare(b.name || "")).map(p => `<option value="${p.id}" ${sel === p.id ? "selected" : ""}>${esc(p.name)} (${Number(p.stock) || 0} left)</option>`).join("");

function itemRow(i = {}) {

}
function updateOrderTotal() {

function openOrderForm() {
  if (!S.products.length) { toast("Add your products first in Packing → Inventory, then create orders."); S.view = "dept"; S.dept = "PACKING"; S.tab = "inventory"; render(); return; }
  const num = nextNum();
  openSheet(`
    <h3>Create order #${num}</h3>
    <div class="row">
      <div class="field"><label for="o-date">Date</label><input id="o-date" type="date" value="${today()}"></div>

      <div class="field"><label for="o-customer">Customer name</label><input id="o-customer" autocomplete="off" list="cust-list"><datalist id="cust-list">${customerList().map(c => `<option value="${esc(c.name)}"></option>`).join("")}</datalist></div>
      <div class="field"><label for="o-ref">Platform order # (optional)</label><input id="o-ref" autocomplete="off" placeholder="Shopee / TikTok ref"></div>
    </div>

    <div class="field"><label>Items</label><div id="items" style="display:flex;flex-direction:column;gap:6px">${itemRow()}</div><button class="btn sm" type="button" data-act="add-item" style="align-self:flex-start;margin-top:4px">+ Add item</button></div>
    <div class="row">
      <div class="field"><label for="o-fees">Platform fees (₱)</label><input id="o-fees" type="number" min="0" step="0.01" placeholder="0"></div>
      <div class="field"><label for="o-ship">Shipping you paid (₱)</label><input id="o-ship" type="number" min="0" step="0.01" placeholder="0"></div>
    </div>
    <div class="row">
      <div class="field"><label for="o-pay">Payment status</label><select id="o-pay">${opts(PAYMENTS.filter(p => !VOIDPAY.has(p.id)), "pending")}</select></div>
      <div class="field"><label for="o-ful">Fulfillment status</label><select id="o-ful">${opts(FULFILLMENTS.filter(f => f.id !== "delivered"), "unfulfilled")}</select></div>
    </div>

    <div class="total-line"><span>Order total</span><span id="order-total" class="num">₱0.00</span></div>
    <div style="font-size:12px;color:var(--muted)">Saving deducts these quantities from inventory.</div>
    <div id="sheet-err" class="confirm" hidden></div>
    <div class="sheet-foot"><button class="btn" type="button" data-act="close">Cancel</button><button class="btn primary" type="submit">Save order</button></div>`,
  async () => {
    const items = [];
    document.querySelectorAll("#sheet .item-row").forEach(r => {
      const pid = r.querySelector(".it-p").value, qty = Number(r.querySelector(".it-q").value) || 0;
      if (!pid || qty <= 0) return;
      const p = S.products.find(x => x.id === pid);
      const price = r.querySelector(".it-price").value === "" ? Number(p.price) || 0 : Number(r.querySelector(".it-price").value) || 0;
      items.push({ productId: pid, name: p.name, sku: p.sku || "", qty, price, cost: Number(p.cost) || 0 });
    });
    if (!items.length) return sheetError("Add at least one product with a quantity.");
    const date = val("o-date") || today();
    const createdAt = date === today() ? Date.now() : new Date(date + "T12:00:00").getTime();
    const fulfillment = val("o-ful");
    const order = { num, createdAt, date, platform: val("o-platform"), customer: val("o-customer"), ref: val("o-ref"), phone: val("o-phone"), items, fees: numv("o-fees"), shipping: numv("o-ship"), adjust: 0, payment: val("o-pay"), fulfillment, tags: parseTags(val("o-tags")), note: val("o-note"), restocked: false, fulfilledAt: fulfillment === "fulfilled" ? createdAt : 0, deliveredAt: 0, voidedAt: 0 };
    await save("orders", uid("o"), order);
    const qtyBy = {}; items.forEach(i => qtyBy[i.productId] = (qtyBy[i.productId] || 0) + i.qty);
    for (const [pid, q] of Object.entries(qtyBy)) await adjustStock(pid, -q);
    closeSheet(); toast(`Order #${num} saved. Inventory updated.`);
  });
}

/* ---------- waybill scan → tracking # → Shopify fulfillment ---------- */
async function saveWaybill(id, code) {
  const o = S.orders.find(x => x.id === id); if (!o || S.readOnly) return;
  const tracking = String(code).trim().replace(/\s+/g, ""), courier = courierOf(o);
  const dupe = S.orders.find(x => x.id !== id && x.tracking === tracking);
  if (dupe) { toast(`That waybill is already on #${dupe.num}.`); return; }
  await patch("orders", o.id, { tracking, courier, trackingAt: Date.now(), shopShipErr: "", log: logAdd(o, [`scanned waybill ${tracking} (${courier})`]) });
  Object.assign(o, { tracking, courier });
  if (S.wbShip !== false) {
    if (o.fulfillment !== "fulfilled" && o.fulfillment !== "delivered") await updateOrder(o, { fulfillment: "fulfilled" });
    toast(`#${o.num}: ${tracking} saved · shipped`);
    if ((o.ref && /^\d+$/.test(o.ref)) || (o.mergedParts || []).some(p => /^\d+$/.test(p.ref || ""))) await shopifyShip(o, false);
  } else toast(`#${o.num}: tracking ${tracking} saved`);
}
const SHIP_FO_Q = `query RSFO($id: ID!) { order(id: $id) { id displayFulfillmentStatus fulfillmentOrders(first: 10) { nodes { id status requestStatus } } } }`;
const SHIP_RELEASE_M = `mutation RSRelease($id: ID!) { fulfillmentOrderReleaseHold(id: $id) { fulfillmentOrder { id status } userErrors { field message } } }`;
const SHIP_CREATE_M = `mutation RSShip($fulfillment: FulfillmentInput!) { fulfillmentCreate(fulfillment: $fulfillment) { fulfillment { id status trackingInfo { number company url } } userErrors { field message } } }`;
async function shopMut(query, variables) {
  const p = shopPayload(await S.mcp.callTool(SHOP_SERVER, "graphql_mutation", { query, variables }));
  const ue = dig(p, "userErrors"), errs = dig(p, "errors");
  if (Array.isArray(ue) && ue.length) throw { code: "tool_error", message: ue.map(e => e.message).join("; ") };
  if (Array.isArray(errs) && errs.length) throw { code: "tool_error", message: errs.map(e => e.message || e).join("; ") };
  return p;
}
async function shopifyShip(o, manual) {
  if (!S.mcp) { const m = "Open the app in claude.ai with Shopify connected to send tracking."; await patch("orders", o.id, { shopShipErr: m }); if (manual) toast(m); return; }
  const refs = [o.ref, ...(o.mergedParts || []).map(p => p.ref)].filter(r => /^\d+$/.test(r || ""));
  try {
    for (const ref of refs) {
      const gid = "gid://shopify/Order/" + ref;
      let fos = ((dig(await shopCall(SHIP_FO_Q, { id: gid }, 10), "fulfillmentOrders") || {}).nodes || []);
      for (const fo of fos.filter(f => f.status === "ON_HOLD")) await shopMut(SHIP_RELEASE_M, { id: fo.id });
      if (fos.some(f => f.status === "ON_HOLD")) fos = ((dig(await shopCall(SHIP_FO_Q, { id: gid }, 10), "fulfillmentOrders") || {}).nodes || []);
      const open = fos.filter(f => ["OPEN", "IN_PROGRESS", "SCHEDULED"].includes(f.status));
      if (!open.length) { if (fos.some(f => f.status === "CLOSED")) continue; throw { code: "tool_error", message: "Shopify has nothing left to fulfill on order " + ref + "." }; }
      await shopMut(SHIP_CREATE_M, { fulfillment: { lineItemsByFulfillmentOrder: open.map(f => ({ fulfillmentOrderId: f.id })), trackingInfo: { number: o.tracking, company: SHOP_COMPANY[courierOf(o)] || "Other" }, notifyCustomer: true } });
    }
    const cur = findOrder(o.id) || o;
    await patch("orders", o.id, { shopShippedAt: Date.now(), shopShipErr: "", shopFul: "fulfilled", log: logAdd(cur, [`sent tracking ${o.tracking} to Shopify`]) });
    toast(`${onum(o)}: tracking sent to Shopify. The buyer can see it in their Order History.`);
  } catch (e) {
    const m = e && e.code === "needs_reauth" ? "Shopify needs you to sign in again (claude.ai → Settings → Connectors)." : e && e.code === "not_in_manifest" ? "Allow Shopify for this page in its Permissions menu." : "Shopify: " + ((e && e.message) || "couldn't send tracking.");
    await patch("orders", o.id, { shopShipErr: m }); toast(m);
  }
}

const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
const LSORTS = { name: p => (p.brand + " " + p.name).toLowerCase(), size: p => (p.size || "").toLowerCase(), type: p => (p.ptype || "").toLowerCase(), kind: p => p.kind || "", eta: p => { const i = MONTHS.indexOf(p.eta); return i < 0 ? 99 : i; }, price: p => Number(p.price) || 0, stock: p => Number(p.stock) || 0, status: p => p.status || "active", web: p => p.webSync || "", edited: p => p.editedAt || p.createdAt || 0 };
function viewListings() {
  const q = (S.liq || "").trim().toLowerCase(), f = S.lfilter || "all", ls = S.ls || (S.ls = { sort: "edited", dir: "desc" });

async function decodeBarcode(file) {

/* ---------- Shopify CSV import ---------- */
function parseCSV(text) {
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ",") { row.push(f); f = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(f); rows.push(row); row = []; f = ""; }
    else f += c;
  }
  if (f || row.length) { row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}
function shopifyTime(s) {

async function readImportFile(file) {

      const parsed = shopifyOrders(text).filter(o => !openOnly || have.has(orderDocId(o)) || (OPEN_FUL.has(o.fulfillment) && !isVoid(o)));

      if (unmatched.size) warn = `${unmatched.size} product name${unmatched.size === 1 ? "" : "s"} don't match your Inventory yet, so profit for those items won't include product cost. Add them in Inventory with the same name or SKU, then import again.`;
      prev.innerHTML = summary(parsed.length, "orders", fresh, updated, sample, warn, "Importing doesn't change your inventory counts.");
    } else {

async function clock(mid, dir) {

function openAttForm(mid) {

      ${cur ? "" : `<option value="" selected>No record</option>`}
    </select></div>
    <div class="row">
