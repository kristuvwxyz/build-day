async function savePayCfg() {
  const positions = val("pc-pos").split("\n").map(l => { const m = /^(.+?)\s*[:=\-]\s*₱?\s*([\d,.]+)/.exec(l.trim()); return m ? { name: m[1].trim(), rate: Number(m[2].replace(/,/g, "")) } : null; }).filter(Boolean);
  if (!positions.length) { toast("Add at least one position with a rate, like “Packer: 550”."); return; }
  const data = { positions, deductLate: $("#pc-late").checked, paidLeave: $("#pc-leave").checked, paidHoliday: $("#pc-hol").checked };
  if (S.db) await S.db.doc("config/payroll").set(data); else S.paySettings = data;
  for (const sel of document.querySelectorAll("[data-ppos]")) {
    const m = member(sel.dataset.ppos), rateIn = document.querySelector(`[data-prate="${sel.dataset.ppos}"]`);
    const upd = { payPosition: sel.value, dailyRate: rateIn.value === "" ? 0 : Number(rateIn.value) };
    if (m && (m.payPosition !== upd.payPosition || Number(m.dailyRate || 0) !== upd.dailyRate)) await patch("team", m.id, upd);
  }
  toast("Rates and settings saved."); render();
}

function payslipText(c, per) {
  const L = [`REGAL SPRITZ PAYSLIP`, `${c.m.name}${c.m.idNumber ? " (ID " + c.m.idNumber + ")" : ""}`, `${positionOf(c.m)} · Pay period ${per.label}`, ``,
    `Days worked: ${c.paidDays} × ${peso2(c.rate)} = ${peso2(c.basic)}`, `Late: ${c.late} day(s), ${c.lateMin} min · Leave: ${c.leave} · Absent: ${c.absent}`];
  const adds = ADD_FIELDS.filter(([k]) => Number(c.rec[k])); const deds = DED_FIELDS.filter(([k]) => Number(c.rec[k]));
  if (adds.length) { L.push("", "ADDITIONS"); adds.forEach(([k, n]) => L.push(`${n}: ${peso2(c.rec[k])}`)); }
  if (deds.length || c.lateDed) { L.push("", "DEDUCTIONS"); if (c.lateDed) L.push(`Late (${c.lateMin} min): ${peso2(c.lateDed)}`); deds.forEach(([k, n]) => L.push(`${n}: ${peso2(c.rec[k])}`)); }
  L.push("", `NET PAY: ${peso2(c.net)}`);
  if (c.rec.notes) L.push("", "Notes: " + c.rec.notes);
  return L.join("\n");
}
function payslipHTML(c, per) {
  const e = esc, rowsA = ADD_FIELDS.filter(([k]) => Number(c.rec[k])).map(([k, n]) => `<tr><td>${n}</td><td class="r">${peso2(c.rec[k])}</td></tr>`).join("");
  const rowsD = (c.lateDed ? `<tr><td>Late (${c.lateMin} min)</td><td class="r">${peso2(c.lateDed)}</td></tr>` : "") + DED_FIELDS.filter(([k]) => Number(c.rec[k])).map(([k, n]) => `<tr><td>${n}</td><td class="r">${peso2(c.rec[k])}</td></tr>`).join("");
  return `<!doctype html><html><head><meta charset="utf-8"><title>Payslip ${e(c.m.name)} ${e(per.label)}</title><style>body{font-family:Arial,sans-serif;color:#231A23;max-width:640px;margin:32px auto;padding:0 16px}h1{font-family:Georgia,serif;font-weight:400;color:#4A2545;margin:0}table{width:100%;border-collapse:collapse;margin:8px 0 18px}td,th{padding:6px 8px;border-bottom:1px solid #E2DCE2;font-size:14px;text-align:left}.r{text-align:right}.net{font-size:20px;font-weight:700;background:#F0ECF0}.muted{color:#6E636D;font-size:13px}h2{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#A9814A;margin:18px 0 0}</style></head><body>
  <h1>Regal Spritz</h1><div class="muted">Payslip · ${e(per.label)}</div>
  <table><tr><td>Employee</td><td>${e(c.m.name)}</td></tr><tr><td>ID number</td><td>${e(c.m.idNumber || "")}</td></tr><tr><td>Position</td><td>${e(positionOf(c.m))}</td></tr><tr><td>Daily rate</td><td>${peso2(c.rate)}</td></tr></table>
  <h2>Earnings</h2><table><tr><td>Basic pay (${c.paidDays} day${c.paidDays === 1 ? "" : "s"} × ${peso2(c.rate)})</td><td class="r">${peso2(c.basic)}</td></tr>${rowsA}</table>
  ${rowsD ? `<h2>Deductions</h2><table>${rowsD}</table>` : ""}
  <table><tr class="net"><td>NET PAY</td><td class="r">${peso2(c.net)}</td></tr></table>
  <h2>Attendance</h2><table><tr><th>Date</th><th>Status</th><th>In</th><th>Out</th><th class="r">Hours</th></tr>${c.days.map(x => `<tr><td>${fmtDate(x.d)}</td><td>${astat(x.st).name}</td><td>${mTime(x.r && x.r.in)}</td><td>${mTime(x.r && x.r.out)}</td><td class="r">${fmtHours(hoursOf(x.r))}</td></tr>`).join("")}</table>
  ${c.rec.notes ? `<p class="muted">Notes: ${e(c.rec.notes)}</p>` : ""}
  <p class="muted" style="margin-top:40px">Received by: ____________________ &nbsp; Date: __________</p></body></html>`;
}

function openPayslip(mid) {
  const m = member(mid); if (!m) return;
  const per = payPeriod(), c = payCalc(m, per), ro = S.readOnly;
  const num = (k, n) => `<div class="field"><label for="ps-${k}">${n}</label><input id="ps-${k}" type="number" min="0" step="0.01" value="${c.rec[k] || ""}" placeholder="0" ${ro ? "disabled" : ""}></div>`;
  openSheet(`
    <h3>Payslip · ${esc(m.nickname || m.name)}</h3>
    <div style="color:var(--muted);font-size:13px">${esc(m.name)}${m.idNumber ? " · ID " + esc(m.idNumber) : ""} · ${esc(positionOf(m) || "No position")} · ${esc(per.label)}</div>
    <div class="list">
      <div class="li"><span>Days worked (from Attendance)</span><span class="num">${c.worked}</span></div>
      <div class="li"><span>Late</span><span class="num">${c.late} day${c.late === 1 ? "" : "s"} · ${c.lateMin} min</span></div>
      <div class="li"><span>Leave · Absent · Holiday</span><span class="num">${c.leave} · ${c.absent} · ${c.hol}</span></div>
      <div class="li"><span>Hours logged</span><span class="num">${fmtHours(c.hours)}</span></div>
    </div>
    <div class="row">
      <div class="field"><label for="ps-days">Paid days (blank = automatic: ${c.worked + (payCfg().paidLeave ? c.leave : 0) + (payCfg().paidHoliday ? c.hol : 0)})</label><input id="ps-days" type="number" min="0" step="0.5" value="${c.rec.daysOverride ?? ""}" ${ro ? "disabled" : ""}></div>
      <div class="field"><label>Daily rate</label><input value="${c.rate ? peso2(c.rate) : "Not set"}" disabled></div>
    </div>
    <h2>Additions</h2><div class="row">${ADD_FIELDS.map(([k, n]) => num(k, n)).join("")}</div>
    <h2>Deductions</h2><div class="row">${DED_FIELDS.map(([k, n]) => num(k, n)).join("")}</div>
    ${c.lateDed ? `<div style="font-size:13px;color:var(--warn)">Late deduction applied automatically: ${peso2(c.lateDed)}</div>` : ""}
    <div class="field"><label for="ps-notes">Notes on payslip</label><input id="ps-notes" value="${esc(c.rec.notes || "")}" ${ro ? "disabled" : ""}></div>
    <div class="total-line"><span>Basic ${peso2(c.basic)} + ${peso2(c.adds)} − ${peso2(c.deds)}</span><span>Net ${peso2(c.net)}</span></div>
    <div class="field"><label for="ps-status">Status</label><select id="ps-status" ${ro ? "disabled" : ""}>${Object.entries(PAY_STATUS).map(([k, s]) => `<option value="${k}" ${c.status === k ? "selected" : ""}>${s.name}</option>`).join("")}</select></div>
    <div class="actions"><button class="btn sm" type="button" data-act="ps-copy" data-mid="${mid}">Copy payslip text</button>${S.dl ? `<button class="btn sm" type="button" data-act="ps-dl" data-mid="${mid}">Download payslip</button>` : ""}</div>
    <div style="font-size:12px;color:var(--muted)">Save first, then copy or download so the payslip shows your latest changes. The downloaded file opens in any browser, where you can print it or save it as PDF.</div>
    <div id="sheet-err" class="confirm" hidden></div>
    <div class="sheet-foot"><button class="btn" type="button" data-act="close">${ro ? "Close" : "Cancel"}</button>${ro ? "" : `<button class="btn primary" type="submit">Save payslip</button>`}</div>`,
  ro ? null : async () => {
    const data = { period: per.key, memberId: mid, status: val("ps-status"), notes: val("ps-notes"), daysOverride: val("ps-days") === "" ? "" : numv("ps-days"), updatedAt: Date.now() };
    [...ADD_FIELDS, ...DED_FIELDS].forEach(([k]) => data[k] = numv("ps-" + k));
    await save("payroll", per.key + "_" + mid, data);
    const after = payCalc(m, per);
    if (data.status === "paid") await patch("payroll", per.key + "_" + mid, { snapshot: { rate: after.rate, paidDays: after.paidDays, basic: after.basic, adds: after.adds, deds: after.deds, net: after.net, at: Date.now() } });
    openPayslip(mid); toast("Payslip saved.");
  });
}
async function copyPayslip(mid) {
  const per = payPeriod(), text = payslipText(payCalc(member(mid), per), per);
  try { await navigator.clipboard.writeText(text); toast("Payslip copied. Paste it in Messenger or Viber."); }
  catch (e) { openSheet(`<h3>Payslip text</h3><textarea id="ps-text" rows="18" style="width:100%;font-family:monospace;font-size:12px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg)">${esc(text)}</textarea><div style="font-size:12px;color:var(--muted)">Select all and copy.</div><div class="sheet-foot"><button class="btn primary" type="button" data-act="close">Done</button></div>`, null); const t = $("#ps-text"); t.focus(); t.select(); }
}
async function downloadPayslip(mid) {
  const m = member(mid), per = payPeriod(), c = payCalc(m, per);
  const name = `payslip-${(m.nickname || m.name).toLowerCase().replace(/[^a-z0-9]+/g, "-")}-${per.key}`;
  try { await S.dl.save({ filename: name + ".html", data: payslipHTML(c, per) }); toast("Payslip downloaded."); }
  catch (e) {
    if (e && e.code === "rejected_extension") { try { await S.dl.save({ filename: name + ".txt", data: payslipText(c, per) }); toast("Saved as a text file."); return; } catch (e2) {} }
    if (!e || e.code !== "declined") toast("Couldn't download. Use Copy payslip text instead.");
  }

  if (db) {
    const keep = () => { if ($("#scrim").hidden) render(); else renderNav(); };
    db.doc("config/home").onSnapshot(s => { S.home = s.exists ? s.data() : {}; keep(); }, () => {});
    db.doc("config/payroll").onSnapshot(s => { S.paySettings = s.exists ? s.data() : {}; keep(); }, () => {});
    db.doc("config/attendance").onSnapshot(s => { S.attSettings = s.exists ? s.data() : {}; keep(); }, () => {});
    db.doc("config/vault").onSnapshot(s => { S.vault = s.exists ? s.data() : null; keep(); }, () => {});
    db.doc("config/security").onSnapshot(s => { S.security = s.exists ? s.data() : {}; keep(); }, () => {});
    if (S.uid) db.doc("data/users/" + S.uid + "/profile").onSnapshot(s => { S.profile = s.exists ? s.data() : {}; keep(); }, () => {});
    for (const col of ["colprefs", "products", "orders", "expenses", "customers", "tasks", "team", "attendance", "investments", "payroll", "scents", "logins", "fixedexp", "dues", "checks", "payrecords", "bir", "birtax"]) {
      db.collection(col).onSnapshot(snap => {
        const docs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        if (col === "orders") { S.orders = docs.filter(r => !r.archived).map(norm); S.archived = docs.filter(r => r.archived); }
        else S[col] = docs;
        S.loaded[col] = true;
        if ($("#scrim").hidden) render(); else renderNav();
      }, () => { S.loaded[col] = true; $("#sync").textContent = "Connection lost · reload the page"; render(); });
    }
  }
  render();
  startShopSync(c);
})();
})();
</script>
