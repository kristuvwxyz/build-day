<title>Regal Spritz OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: left rail nav (bottom tab bar on phones) + one working pane; summary first, detail below. */
/* BRAND TOKENS: swap these for Regal Spritz's exact colors and fonts. */
:root {
  --brand: #4A2545;        /* primary (deep plum) */
  --brand-ink: #FFFFFF;    /* text on primary */
  --gold: #A9814A;         /* secondary accent */
  --bg: #F7F5F7;
  --surface: #FFFFFF;
  --surface-2: #F0ECF0;
  --line: #E2DCE2;
  --fg: #231A23;
  --muted: #6E636D;
  --good: #2E7D4F;  --good-bg: #E3F2E8;
  --warn: #9A6400;  --warn-bg: #FBF0D9;
  --bad: #B3261E;   --bad-bg: #FBE4E2;
  --info: #3D5A99;  --info-bg: #E5EBF7;
  --amber: #8A5A00; --amber-bg: #FFE9A8;   /* unfulfilled */
  --orange: #A3470C; --orange-bg: #FFDCC2; /* pending / on hold */
  --font-display: "Marcellus", "Cormorant Garamond", Georgia, serif;
  --font-body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --brand: #C9A3C2; --brand-ink: #1E141D; --gold: #D2B07A;
  --bg: #151115; --surface: #1F191F; --surface-2: #2A222A; --line: #3A303A;
  --fg: #F1EAF0; --muted: #A99DA7;
  --good: #7CCB9B; --good-bg: #1D3226; --warn: #E7B85C; --warn-bg: #3A2C12;
  --bad: #F2948D; --bad-bg: #3D1C1A; --info: #9DB5EE; --info-bg: #1E2840; --amber: #F5D06B; --amber-bg: #3D3112; --orange: #F7AE7C; --orange-bg: #43260F;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --brand: #C9A3C2; --brand-ink: #1E141D; --gold: #D2B07A;
  --bg: #151115; --surface: #1F191F; --surface-2: #2A222A; --line: #3A303A;
  --fg: #F1EAF0; --muted: #A99DA7;
  --good: #7CCB9B; --good-bg: #1D3226; --warn: #E7B85C; --warn-bg: #3A2C12;
  --bad: #F2948D; --bad-bg: #3D1C1A; --info: #9DB5EE; --info-bg: #1E2840; --amber: #F5D06B; --amber-bg: #3D3112; --orange: #F7AE7C; --orange-bg: #43260F;
  color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 14px/1.5 var(--font-body); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

.app { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: 100%; }
.rail { background: var(--surface); border-right: 1px solid var(--line); padding: 24px 14px; display: flex; flex-direction: column; gap: 24px; position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; }
.mark { font-family: var(--font-display); font-size: 22px; color: var(--brand); padding-inline: 10px; line-height: 1.1; }
.mark small { display: block; font-family: var(--font-body); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); margin-top: 4px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button { display: flex; align-items: center; gap: 10px; text-align: left; border: 0; background: none; padding: 9px 10px; border-radius: 8px; color: var(--muted); font-weight: 500; }
.nav button svg { width: 18px; height: 18px; flex: none; }
.nav button:hover { background: var(--surface-2); color: var(--fg); }
.nav button[aria-current="page"] { background: var(--brand); color: var(--brand-ink); }
.rail-foot { margin-top: auto; font-size: 12px; color: var(--muted); padding-inline: 10px; display: flex; flex-direction: column; gap: 10px; }
#theme-slot .seg button { padding: 4px 8px; font-size: 12px; }

main { min-width: 0; padding: 28px 32px 48px; display: flex; flex-direction: column; gap: 20px; }
.head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: 28px; margin: 0; text-wrap: balance; }
h2 { font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }

.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 8px; font-weight: 600; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { border-color: transparent; background: none; color: var(--muted); padding: 6px 8px; }
.btn.ghost:hover { color: var(--fg); background: var(--surface-2); }
.btn.danger { color: var(--bad); }
.btn.sm { padding: 4px 10px; font-size: 13px; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; }
.kpi .label { font-size: 12px; color: var(--muted); font-weight: 600; }
.kpi .value { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
.kpi .sub { font-size: 12px; color: var(--muted); }

.seg { display: inline-flex; background: var(--surface-2); border-radius: 8px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: none; padding: 5px 12px; border-radius: 6px; font-weight: 600; font-size: 13px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.08); }

.bars { display: flex; flex-direction: column; gap: 10px; }
.bar-row { display: grid; grid-template-columns: 96px minmax(0, 1fr) 96px; gap: 10px; align-items: center; font-size: 13px; }
.bar-track { height: 10px; background: var(--surface-2); border-radius: 5px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--brand); border-radius: 5px; }
.bar-row .num { text-align: right; font-weight: 600; }

.list { display: flex; flex-direction: column; }
.li { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); }
.li:first-child { border-top: 0; }
.li .main { min-width: 0; }
.li .t { font-weight: 600; overflow-wrap: anywhere; }
.li .s { font-size: 12px; color: var(--muted); }
.empty { color: var(--muted); font-size: 13px; padding: 6px 0; }

.chip { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; white-space: nowrap; background: var(--surface-2); color: var(--muted); }
.chip.good { background: var(--good-bg); color: var(--good); }
.chip.warn { background: var(--warn-bg); color: var(--warn); }
.chip.bad { background: var(--bad-bg); color: var(--bad); }
.chip.info { background: var(--info-bg); color: var(--info); }
.chip.ex { background: none; border: 1px dashed var(--gold); color: var(--gold); }

.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.toolbar input, .toolbar select { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 10px; min-width: 0; }
.toolbar input { flex: 1 1 200px; }

.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 700; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px 12px; border-top: 1px solid var(--line); vertical-align: middle; }
tr:first-child td { border-top: 0; }
td.r, th.r { text-align: right; }
td .s { font-size: 12px; color: var(--muted); }
select.status { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 3px 6px; font-size: 12px; font-weight: 600; }

.notice { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 10px 14px; border-radius: var(--radius); background: var(--warn-bg); color: var(--warn); font-size: 13px; font-weight: 600; }

.scrim { position: fixed; inset: 0; background: rgba(20, 10, 20, .45); display: flex; justify-content: flex-end; z-index: 20; }
.sheet { background: var(--surface); width: min(480px, 100%); height: 100%; overflow-y: auto; padding: calc(22px + env(safe-area-inset-top, 0px)) 22px calc(22px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; }
.sheet h3 { font-family: var(--font-display); font-weight: 400; font-size: 22px; margin: 0; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 12px; font-weight: 700; color: var(--muted); }
.field input, .field select, .field textarea { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 8px 10px; width: 100%; }
.row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.item-row { display: grid; grid-template-columns: minmax(0, 1fr) 64px 92px 32px; gap: 6px; align-items: end; }
.item-row select, .item-row input { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 8px; width: 100%; min-width: 0; }
.total-line { display: flex; justify-content: space-between; font-weight: 700; padding-top: 8px; border-top: 1px solid var(--line); }
.sheet-foot { display: flex; gap: 8px; justify-content: flex-end; margin-top: auto; padding-top: 8px; }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--bad); font-weight: 600; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-weight: 600; z-index: 30; }

/* Shopify-style orders */
.strip { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(168px, 1fr); overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.strip > div { padding: 14px 16px; border-left: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.strip > div:first-child { border-left: 0; justify-content: center; }
.strip select { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 8px; font-weight: 600; }
.metric-name { font-weight: 700; font-size: 13px; text-decoration: underline dotted var(--muted); text-underline-offset: 3px; }
.metric-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; }
.metric-val { font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.delta { font-size: 11px; font-weight: 700; margin-left: 4px; }
.delta.up { color: var(--good); } .delta.down { color: var(--bad); } .delta.flat { color: var(--muted); }
.spark { width: 90px; height: 26px; flex: none; }
.spark polyline { fill: none; stroke: var(--brand); stroke-width: 1.5; stroke-linejoin: round; }
.spark line { stroke: var(--line); stroke-dasharray: 2 2; }

.otable td, .otable th { padding: 9px 12px; }
.otable th { text-transform: none; letter-spacing: 0; font-size: 13px; color: var(--muted); font-weight: 600; background: var(--surface-2); }
.otable tbody tr { cursor: pointer; }
.otable.dir td { vertical-align: top; }
.otable.inv td, .otable.inv th { font-size: 12.5px; }
.otable tfoot td { background: var(--surface-2); border-top: 1px solid var(--line); }
.sheet h2 { margin-top: 4px; }
.otable.inv tfoot td { background: var(--warn-bg); border-top: 1px solid var(--line); }
summary.yr { cursor: pointer; display: flex; gap: 10px; align-items: baseline; font-size: 18px; padding: 4px 0; }
summary.yr span { font-size: 13px; color: var(--muted); }
.otable tbody tr:hover td { background: var(--surface-2); }
.otable tr.sel td { background: var(--info-bg); }
.otable tr.done td { color: var(--muted); }
.otable tr.void td.strike { text-decoration: line-through; color: var(--muted); }
.otable .cb { width: 36px; padding-right: 0; }
.otable input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--brand); cursor: pointer; }
.onum { font-weight: 700; white-space: nowrap; display: inline-flex; align-items: center; gap: 8px; }
.onum svg { width: 15px; height: 15px; color: var(--muted); }
.nowrap { white-space: nowrap; }
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px 2px 7px; border-radius: 7px; font-size: 12.5px; font-weight: 600; white-space: nowrap; background: var(--surface-2); color: var(--fg); }
.badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: .7; flex: none; }
.badge.hollow::before { background: none; border: 1.5px solid currentColor; width: 6px; height: 6px; opacity: 1; }
.badge.orange { background: var(--orange-bg); color: var(--orange); }
.badge.amber { background: var(--amber-bg); color: var(--amber); }
.badge.red { background: var(--bad-bg); color: var(--bad); }
.badge.grey { background: var(--surface-2); color: var(--muted); }
.badge.green { background: var(--good-bg); color: var(--good); }
.badge.violet { background: color-mix(in srgb, #8B5CF6 14%, var(--surface)); color: #7C3AED; }
.badge.blue { background: color-mix(in srgb, #3B82F6 14%, var(--surface)); color: #2563EB; }
.badge.teal { background: color-mix(in srgb, #0D9488 14%, var(--surface)); color: #0F766E; }
.tags { display: flex; gap: 6px; flex-wrap: nowrap; align-items: center; }
.tag { display: inline-block; padding: 1px 8px; border-radius: 6px; font-size: 12.5px; background: var(--surface-2); border: 1px solid var(--line); color: var(--fg); white-space: nowrap; }
.tag.more { background: none; border: 0; color: var(--muted); padding: 1px 2px; }
.tag button { border: 0; background: none; padding: 0 0 0 4px; color: var(--muted); }
.bulk { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 8px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); font-size: 13px; }
.bulk input { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 5px 8px; width: 120px; }
.pager { display: flex; align-items: center; gap: 6px; }
.pager span { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--muted); padding-inline: 6px; }
.dropzone { border: 1.5px dashed var(--line); border-radius: var(--radius); padding: 20px; text-align: center; color: var(--muted); display: flex; flex-direction: column; gap: 8px; align-items: center; }
.steps { margin: 0; padding-left: 18px; color: var(--muted); font-size: 13px; display: flex; flex-direction: column; gap: 4px; }

/* Back office: nav groups, tabs, home, tasks, departments */
.nav-label { font-size: 10px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); padding: 14px 10px 4px; }
.nav .lock-ico { width: 13px; height: 13px; margin-left: auto; opacity: .55; }
.nav .account-item { margin-top: 10px; border-top: 1px solid var(--line); border-radius: 0 0 8px 8px; padding-top: 12px; }
.mobile-only { display: none !important; }
.btn-ico { width: 14px; height: 14px; vertical-align: -2px; }
.linkish { border: 0; background: none; padding: 0; color: var(--brand); font-weight: 700; text-decoration: underline; text-underline-offset: 2px; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 8px 14px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--brand); border-bottom-color: var(--brand); }

.carousel { position: relative; overflow: hidden; border-radius: 14px; background: var(--brand); color: var(--brand-ink); }
.car-track { display: flex; transition: transform .5s ease; }
@media (prefers-reduced-motion: reduce) { .car-track { transition: none; } }
.slide { flex: 0 0 100%; min-width: 0; padding: 22px 28px 50px; display: flex; flex-direction: column; gap: 6px; min-height: 168px; }
.slide-eyebrow { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); font-weight: 700; }
.carousel h2.slide-title { font-family: var(--font-display); font-weight: 400; font-size: clamp(22px, 3vw, 30px); color: inherit; text-transform: none; letter-spacing: 0; text-wrap: balance; }
.slide-body { max-width: 62ch; font-size: 14px; opacity: .92; }
.slide-body p { margin: 0; }
.slide-quote { font-family: var(--font-display); font-size: 17px; line-height: 1.4; }
.slide-goals { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.slide-ph { opacity: .8; }
.slide-ph .linkish { color: inherit; }
.slide-stats { display: flex; gap: 8px 20px; flex-wrap: wrap; margin-top: 8px; font-size: 13px; }
.slide-stats b { font-size: 17px; margin-right: 4px; }
.car-ctrl { position: absolute; left: 0; right: 0; bottom: 10px; display: flex; justify-content: center; align-items: center; gap: 12px; }
.car-btn { border: 1px solid color-mix(in srgb, var(--brand-ink) 35%, transparent); background: none; color: inherit; width: 30px; height: 30px; border-radius: 50%; font-size: 16px; line-height: 1; }
.car-dots { display: flex; gap: 8px; }
.car-dots button { width: 8px; height: 8px; border-radius: 4px; border: 0; padding: 0; background: color-mix(in srgb, var(--brand-ink) 40%, transparent); transition: width .2s; }
.car-dots button[aria-current="true"] { width: 22px; background: var(--gold); }

.dept-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.dept-card { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 2px; position: relative; }
.dept-card:hover { border-color: var(--brand); }
.dept-card strong { font-size: 15px; }
.dept-card span { font-size: 12px; color: var(--muted); }
.dept-card .lock-ico { position: absolute; top: 12px; right: 12px; width: 15px; height: 15px; color: var(--muted); }
.lock-card { max-width: 380px; margin: 24px auto; align-items: center; text-align: center; padding: 28px; }
.lock-big { width: 34px; height: 34px; color: var(--brand); }

.tsum { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.tsum-line { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; font-size: 14px; }
.tsum-part b { font-size: 17px; }
.tsum-sep { color: var(--line); }
.tsum-bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--surface-2); }
.tsum-label { font-size: 12px; color: var(--muted); }
.s-todo { --c: var(--muted); --cb: var(--surface-2); }
.s-in_progress { --c: var(--info); --cb: var(--info-bg); }
.s-done { --c: var(--good); --cb: var(--good-bg); }
.s-cancelled { --c: var(--bad); --cb: var(--bad-bg); }
.tsum-part b { color: var(--c); }
.tsum-bar i { background: var(--c); }
.pbar { flex: 1; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; min-width: 60px; }
.pbar i { display: block; height: 100%; background: var(--brand); border-radius: 3px; }

.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--line); gap: 1px; }
.cal-h { background: var(--surface-2); font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 6px 8px; }
.cal-d { background: var(--surface); min-height: 104px; padding: 6px; display: flex; flex-direction: column; gap: 4px; cursor: pointer; min-width: 0; }
.cal-d.out { background: var(--bg); }
.cal-d.out .cal-n span { color: var(--muted); opacity: .6; }
.cal-d.picked { box-shadow: inset 0 0 0 2px var(--gold); }
.cal-n { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
.cal-d.today .cal-n span { background: var(--brand); color: var(--brand-ink); border-radius: 999px; padding: 1px 7px; }
.cal-add { border: 0; background: none; color: var(--muted); font-size: 16px; line-height: 1; padding: 0 4px; border-radius: 4px; opacity: 0; }
.cal-d:hover .cal-add, .cal-add:focus-visible { opacity: 1; }
.cal-add:hover { background: var(--surface-2); color: var(--fg); }
.cal-items { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.tpill { display: flex; align-items: center; gap: 4px; border: 0; border-left: 3px solid var(--c); background: var(--cb); color: var(--fg); border-radius: 4px; padding: 2px 5px; font-size: 11.5px; text-align: left; min-width: 0; width: 100%; }
.tpill .tt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.tpill.s-cancelled .tt { text-decoration: line-through; color: var(--muted); }
.tpill.overdue { box-shadow: inset 0 0 0 1px var(--bad); }
.tpill .ini { flex: none; font-size: 9.5px; font-weight: 800; background: var(--surface); border-radius: 999px; padding: 0 4px; color: var(--muted); }

(() => {
const PLATFORMS = [
  { id: "website", name: "Website" },

];
const PAYMENTS = [
  { id: "pending", name: "Unpaid", cls: "orange hollow" },

  { id: "voided", name: "Voided", cls: "grey" },
];
/* pre-order pipeline stages come from Shopify tags (8.FWD … 2.AB); lower number = further along */
const STAGES = [
  { id: "fwd", name: "FWD", tag: "8.FWD", cls: "violet hollow" },
  { id: "to_confirm", name: "To confirm", tag: "7.CONF", cls: "violet hollow" },
  { id: "billed", name: "Billed", tag: "6.BILLED", cls: "blue hollow" },
  { id: "dp", name: "Partially paid (DP)", tag: "5.DP", cls: "blue hollow" },
  { id: "arrived", name: "Arrived", tag: "4.ARRIVED", cls: "teal hollow" },
  { id: "sorted", name: "Sorted", tag: "3.SORTED", cls: "teal hollow" },
  { id: "arrived_hold", name: "Arrived-Hold", tag: "2.AB", cls: "orange hollow" },
];
const FULFILLMENTS = [
  ...STAGES,
  { id: "unfulfilled", name: "To ship", cls: "amber hollow" },
  { id: "on_hold", name: "On hold", cls: "orange hollow" },
  { id: "fulfilled", name: "Shipped", cls: "grey" },
  { id: "delivered", name: "Delivered", cls: "green" },
  { id: "cancelled", name: "Cancelled", cls: "red" },
  { id: "not_required", name: "Not required", cls: "grey" },
];
const VOIDPAY = new Set(["refunded", "voided"]);
const STAGE_IDS = new Set(STAGES.map(x => x.id));
const OPEN_FUL = new Set(["unfulfilled", "on_hold", ...STAGE_IDS]);
const normTag = t => String(t || "").toUpperCase().replace(/\s+/g, "");
const tagStage = tags => { const set = new Set((tags || []).map(normTag)); for (let i = STAGES.length - 1; i >= 0; i--) if (set.has(STAGES[i].tag)) return STAGES[i].id; return ""; };
/* open orders follow their stage tag; a stage with its tag removed falls back to To ship */
const fulFromTags = (f, tags) => !OPEN_FUL.has(f) ? f : (tagStage(tags) || (STAGE_IDS.has(f) ? "unfulfilled" : f));
const STAGE_TAGS = new Set(STAGES.map(x => x.tag));
const withStageTag = (tags, f) => { const st = STAGES.find(x => x.id === f); const rest = (tags || []).filter(t => !STAGE_TAGS.has(normTag(t))); return st ? [...rest, st.tag] : rest; };
const COURIERS = ["J&T", "SDD"];
const SHOP_COMPANY = { "J&T": "J&T Express", SDD: "Other" };
const courierOf = o => { const c = o.courier || ""; if (/j\s*&?\s*t|jnt/i.test(c)) return "J&T"; if (c === "SDD") return "SDD"; return o.pickup ? "SDD" : "J&T"; };
const pickCourier = (title, hasAddr) => /j\s*&\s*t|jnt|j\s*n\s*t/i.test(title || "") ? "J&T" : (!hasAddr || /pick ?up|branch|sdd|same ?day/i.test(title || "")) ? "SDD" : "J&T";
const onum = o => [o.num, ...(o.merged || [])].map(n => "#" + n).join(" ");
const findOrder = id => S.orders.find(o => o.id === id) || S.archived.find(o => o.id === id);
/* who can do what on orders: CEO, Sales, Admin everything · Finance payment + fulfillment · Packing fulfillment + shipping · others view */
const myDept = () => S.isOwner ? "CEO" : ((member(myMemberId()) || {}).department || "");
const orderRole = () => S.readOnly ? "view" : (S.isOwner || ["CEO", "SALES", "ADMIN"].includes(myDept())) ? "all" : myDept() === "FINANCE" ? "status" : myDept() === "PACKING" ? "pack" : "view";
const canAll = () => orderRole() === "all";
const canPay = () => ["all", "status"].includes(orderRole());
const canFul = () => ["all", "status", "pack"].includes(orderRole());
const canShip = () => ["all", "pack"].includes(orderRole());
const actor = () => { const m = member(myMemberId()); if (m) return `${m.nickname || m.name}, the ${m.role || (dept(m.department) || {}).name || "team"}`; return ((S.me && S.me.name) || "Owner") + (S.isOwner ? ", the owner" : ""); };
const logAdd = (o, msgs, by) => [...(o.log || []), ...msgs.map(msg => ({ at: Date.now(), by: by || actor(), msg }))].slice(-80);
const salesTeam = () => activeTeam().filter(m => m.department === "SALES");
const clsKey = st => String(st.cls || "").split(" ")[0] || "grey";
const ORDER_VIEWS = [
  { id: "all", name: "All" },
  { id: "unfulfilled", name: "To ship" },
  { id: "unpaid", name: "Unpaid" },
  { id: "on_hold", name: "On hold" },
  { id: "open", name: "Open" },
  { id: "archived", name: "Completed" },

function relTime(t) {
  if (!t) return "";
  const d = new Date(t), now = new Date();
  const time = d.toLocaleTimeString("en-PH", { hour: "numeric", minute: "2-digit" }).replace(/\s?(AM|PM)/i, (m, x) => " " + x.toLowerCase());
  const days = Math.round((new Date(dstr(now) + "T00:00:00") - new Date(dstr(d) + "T00:00:00")) / 864e5);
  let day;
  if (days === 0) day = "Today";
  else if (days === 1) day = "Yesterday";
  else if (days > 1 && days < 7) day = d.toLocaleDateString("en-PH", { weekday: "long" });
  else day = d.toLocaleDateString("en-PH", { month: "short", day: "numeric", ...(d.getFullYear() !== now.getFullYear() ? { year: "numeric" } : {}) });
  return `${day} at ${time}`;
}

async function save(col, id, data) {
  if (S.db) { await S.db.collection(col).doc(id).set(data); }
  else { const arr = S[col]; const i = arr.findIndex(r => r.id === id); const row = { id, ...data }; i >= 0 ? arr.splice(i, 1, row) : arr.push(row); render(); }
}
async function patch(col, id, data) {
  if (S.db) { await S.db.collection(col).doc(id).update(data); }
  else { const r = S[col].find(r => r.id === id); if (r) Object.assign(r, data); render(); }
}
async function remove(col, id) {
  if (S.db) { await S.db.collection(col).doc(id).delete(); }
  else { S[col] = S[col].filter(r => r.id !== id); render(); }
}

async function adjustStock(productId, delta) {
  const p = S.products.find(x => x.id === productId);
  if (!p) return;
  const next = (Number(p.stock) || 0) + delta;
  p.stock = next;
  await patch("products", productId, { stock: next });
}

/* Applies a payment/fulfillment/tag/note change and keeps stock + timestamps right. */
async function updateOrder(o, ch) {
  ch = { ...ch };
  const upd = { ...ch }, now = Date.now();
  let stockDelta = 0;
  if (ch.fulfillment && ch.fulfillment !== o.fulfillment) { if (OPEN_FUL.has(ch.fulfillment)) upd.tags = withStageTag(ch.tags || o.tags, ch.fulfillment); }
  else if (ch.tags) { const f = fulFromTags(o.fulfillment, ch.tags); if (f !== o.fulfillment) { upd.fulfillment = f; ch = { ...ch, fulfillment: f }; } }
  if (ch.fulfillment && ch.fulfillment !== o.fulfillment) {
    if (ch.fulfillment === "fulfilled") upd.fulfilledAt = o.fulfilledAt || now;
    if (ch.fulfillment === "delivered") { upd.deliveredAt = now; upd.fulfilledAt = o.fulfilledAt || now; }
  }
  if (ch.payment && ch.payment !== o.payment) {
    const was = isVoid(o), will = VOIDPAY.has(ch.payment);
    if (!was && will) { upd.voidedAt = now; if (!o.noStock && !o.restocked) { upd.restocked = true; stockDelta = 1; } }
    if (was && !will) { upd.voidedAt = 0; if (!o.noStock && o.restocked) { upd.restocked = false; stockDelta = -1; } }
  }
  const L = { payment: ["Payment Status", v => pay(v).name], fulfillment: ["Fulfillment Status", v => ful(v).name], courier: ["Courier", v => v], tracking: ["Tracking #", v => v || "(cleared)"], assignee: ["Assigned to", v => v ? memberName(v) : "Unassigned"] };
  const msgs = [];
  for (const [k, [lab, f]] of Object.entries(L)) if (upd[k] !== undefined && upd[k] !== (o[k] ?? (k === "courier" ? courierOf(o) : undefined))) msgs.push(`changed ${lab} → ${f(upd[k])}`);
  if (upd.tags) { const add = upd.tags.filter(t => !(o.tags || []).includes(t)), rm = (o.tags || []).filter(t => !upd.tags.includes(t)); if (add.length) msgs.push(`added tag ${add.join(", ")}`); if (rm.length) msgs.push(`removed tag ${rm.join(", ")}`); }
  if (upd.note !== undefined && (upd.note || "") !== (o.note || "")) msgs.push("edited the note");
  const by = upd._by; delete upd._by;
  if (msgs.length) upd.log = logAdd(o, msgs, by);
  await patch("orders", o.id, upd);
  if (stockDelta) for (const i of o.items || []) if (i.productId) await adjustStock(i.productId, stockDelta * (Number(i.qty) || 0));
  return stockDelta;
}

  const rows = [...groups.entries()].map(([k, ts]) => {
    const live = ts.filter(t => t.status !== "cancelled");
    const avg = live.length ? Math.round(live.reduce((a, t) => a + (t.status === "done" ? 100 : Number(t.progress) || 0), 0) / live.length) : 0;
    const name = by === "dept" ? (dept(k) || { name: "No department" }).name : memberName(k);
    const sub = by === "dept" ? "" : (member(k) ? (dept(member(k).department) || {}).name || "" : "");

async function sha(text) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
}
async function tryUnlock() {
  const d = S.dept, rec = S.security[d], pw = val("unlock-pw");
  if (!rec || !pw) return;
  if ((await sha(rec.salt + ":" + pw)) === rec.hash) { S.unlocked.add(d); saveUnlocked(); render(); toast(d === "CEO" ? "CEO unlocked: every department is open." : d === "ADMIN" ? "Admin unlocked: every department except Finance is open." : `${dept(d).name} unlocked.`); }
  else { const e = $("#unlock-err"); if (e) e.hidden = false; $("#unlock-pw").value = ""; $("#unlock-pw").focus(); }
}

      <td class="r nowrap"><button class="btn sm primary" type="button" data-setpw="${d.id}">${has ? "Change" : "Set"}</button>${has ? ` <button class="btn sm ghost danger" type="button" data-clearpw="${d.id}">Remove</button>` : ""}</td></tr>`; }).join("")}</tbody></table></div>
    <div style="font-size:13px;color:var(--muted)">Who sees what: <strong>CEO</strong> sees every department, <strong>Admin</strong> sees all except Finance, everyone else sees only their own department (from Directory). The CEO password opens everything; the Admin password opens everything except Finance.</div>
    <div class="notice" style="background:var(--surface-2);color:var(--muted);font-weight:500">These passwords keep each department's pages out of view for staff who don't need them. They aren't bank-level security: anyone you share this app with can technically reach its data. Share the app only with your team, and change a password when someone leaves.</div>
  </section>`;
}
async function setPassword(d, clear) {
  const next = { ...S.security };
  if (clear) delete next[d];
  else {
    const pw = val("pw-" + d);
    if (pw.length < 4) { toast("Use at least 4 characters."); return; }
    const salt = Math.random().toString(36).slice(2) + Date.now().toString(36);
    next[d] = { salt, hash: await sha(salt + ":" + pw), setAt: Date.now() };
  }
  await S.db?.doc("config/security").set(next);
  if (!S.db) S.security = next;
  render(); toast(clear ? `${dept(d).name} password removed.` : `${dept(d).name} password saved. Share it with that team.`);
}

/* ---------- orders: stats strip ---------- */
function rangeBounds() {
  const now = new Date(), start = new Date(today() + "T00:00:00").getTime();
  const days = { today: 1, "7d": 7, "30d": 30 }[S.of.range];
  const from = start - (days - 1) * 864e5, to = now.getTime() + 1;
  const len = start + 864e5 - from;
  return { from, to, prevFrom: from - len, prevTo: from, buckets: days === 1 ? 24 : days, bucketMs: days === 1 ? 36e5 : 864e5 };
}
function metricSeries(fn) {
  const b = rangeBounds();
  const series = Array(b.buckets).fill(0);
  let cur = 0, prev = 0;
  for (const o of S.orders) for (const [t, v] of fn(o)) {
    if (!t) continue;
    if (t >= b.from && t < b.to) { cur += v; const i = Math.min(b.buckets - 1, Math.floor((t - b.from) / b.bucketMs)); series[i] += v; }
    else if (t >= b.prevFrom && t < b.prevTo) prev += v;
  }
  return { cur, prev, series };
}
function spark(series) {
  const w = 90, h = 26, max = Math.max(1, ...series.map(Math.abs));
  const pts = series.map((v, i) => `${(i / Math.max(1, series.length - 1) * (w - 2) + 1).toFixed(1)},${(h - 2 - Math.abs(v) / max * (h - 4)).toFixed(1)}`).join(" ");
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" aria-hidden="true"><line x1="0" y1="${h - 1.5}" x2="${w}" y2="${h - 1.5}"/><polyline points="${pts}"/></svg>`;
}
function delta(cur, prev, invert) {
  if (!prev && !cur) return `<span class="delta flat">–</span>`;
  if (!prev) return `<span class="delta ${invert ? "down" : "up"}">new</span>`;
  const pct = Math.round((Math.abs(cur) - Math.abs(prev)) / Math.abs(prev) * 100);
  if (pct === 0) return `<span class="delta flat">0%</span>`;
  const up = pct > 0, good = invert ? !up : up;
  return `<span class="delta ${good ? "up" : "down"}">${up ? "↗" : "↘"} ${Math.abs(pct).toLocaleString("en-PH")}%</span>`;
}
function statsStrip() {
  const m = [
    ["Orders", metricSeries(o => [[o.createdAt, 1]]), v => v.toLocaleString("en-PH")],
    ["Items ordered", metricSeries(o => isVoid(o) ? [] : [[o.createdAt, itemCount(o)]]), v => v.toLocaleString("en-PH")],
    ["Sales reversals", metricSeries(o => isVoid(o) ? [[o.voidedAt || o.createdAt, -total(o)]] : []), v => peso2(v), true],
    ["Orders fulfilled", metricSeries(o => [[o.fulfilledAt, 1]]), v => v.toLocaleString("en-PH")],
    ["Orders delivered", metricSeries(o => [[o.deliveredAt, 1]]), v => v.toLocaleString("en-PH")],
  ];
  return `<div class="strip">
    <div><select id="of-range" aria-label="Date range">${[["today", "Today"], ["7d", "Last 7 days"], ["30d", "Last 30 days"]].map(([k, l]) => `<option value="${k}" ${S.of.range === k ? "selected" : ""}>${l}</option>`).join("")}</select></div>
    ${m.map(([name, s, f, inv]) => `<div><span class="metric-name">${name}</span><div class="metric-row"><span class="metric-val">${f(s.cur)}${delta(s.cur, s.prev, inv)}</span>${spark(s.series)}</div></div>`).join("")}
  </div>`;
}

function filteredOrders() {

  return S.orders.filter(o => {
    if (S.of.ful !== "all" && o.fulfillment !== S.of.ful) return false;
    if (S.of.sup && S.of.sup !== "all" && !(o.tags || []).some(t => t.toUpperCase() === S.of.sup)) return false;
    if (S.of.pay !== "all" && o.payment !== S.of.pay) return false;
    if (vw === "unfulfilled" && (o.fulfillment !== "unfulfilled" || isVoid(o))) return false;
    if (vw === "unpaid" && !(o.payment === "pending" || o.payment === "partial")) return false;
    if (vw === "on_hold" && o.fulfillment !== "on_hold") return false;
    if (vw === "open" && (isVoid(o) || !(OPEN_FUL.has(o.fulfillment) || o.payment !== "paid"))) return false;
    if (vw === "archived" && !(isVoid(o) || (o.payment === "paid" && !OPEN_FUL.has(o.fulfillment)))) return false;
    if (q && ![o.num, "#" + o.num, o.customer, o.email, o.ref, o.phone, o.tracking, ...(o.merged || []), memberName(o.assignee), plat(o.platform), ...(o.tags || []), ...(o.items || []).map(i => i.name)].join(" ").toLowerCase().includes(q)) return false;

}

const ORDER_SORTS = {
  num: o => Number(String(o.num).replace(/\D/g, "")) || 0, date: o => o.createdAt || 0, items: o => itemCount(o), customer: o => (o.customer || "").toLowerCase(),
  total: o => total(o), payment: o => PAYMENTS.findIndex(x => x.id === o.payment), fulfillment: o => FULFILLMENTS.findIndex(x => x.id === o.fulfillment),
  tracking: o => (o.tracking || "").toLowerCase(), tags: o => (o.tags || []).join(",").toLowerCase(),
  assigned: o => o.assignee ? memberName(o.assignee).toLowerCase() : "~", courier: o => courierOf(o), phone: o => o.phone || "", address: o => (o.address || "").toLowerCase(),
  waybill: o => (o.tracking || "").toLowerCase(),
};
function orderSorter(st = S.of) {
  const f = ORDER_SORTS[st.sort] || ORDER_SORTS.date, d = st.dir === "asc" ? 1 : -1;
  return (a, b) => { const x = f(a), y = f(b); const c = typeof x === "string" ? x.localeCompare(y, "en", { numeric: true }) : x - y; return c * d || (b.createdAt || 0) - (a.createdAt || 0); };
}
const sortTh = (k, label, cls = "", st = S.of, attr = "osort") => `<th class="sortable ${cls}" data-${attr}="${k}" aria-sort="${st.sort === k ? (st.dir === "asc" ? "ascending" : "descending") : "none"}">${label}<span class="sarr">${st.sort === k ? (st.dir === "asc" ? "↑" : "↓") : "↕"}</span></th>`;

/* click-to-sort for every other table: sorts the rows on screen, remembered per table */
S.tsort = {}; try { S.tsort = JSON.parse(localStorage.getItem("rs-tsort") || "{}"); } catch (e) {}
const tableKey = (t, i) => [S.view, S.dept, S.tab, i].join(":");
const cellVal = td => {
  if (!td) return "";
  if (td.dataset.sort !== undefined) { const n = Number(td.dataset.sort); return isNaN(n) ? td.dataset.sort.toLowerCase() : n; }
  const s = td.innerText.trim();
  const num = s.replace(/[₱,%\s]/g, "").replace(/^−/, "-");
  if (/^-?\d+(\.\d+)?$/.test(num)) return Number(num);
  if (/[A-Za-z]{3} \d{1,2},? \d{4}|^\d{4}-\d{2}-\d{2}/.test(s)) { const t = Date.parse(s.replace(/·.*$/, "")); if (!isNaN(t)) return t; }
  return s.toLowerCase();
};
function sortTable(t, col, dir) {
  const tb = t.tBodies[0]; if (!tb) return;
  const rows = [...tb.rows], d = dir === "asc" ? 1 : -1;
  rows.sort((a, b) => { const x = cellVal(a.cells[col]), y = cellVal(b.cells[col]); if (x === "" && y !== "") return 1; if (y === "" && x !== "") return -1; const c = typeof x === "number" && typeof y === "number" ? x - y : String(x).localeCompare(String(y), "en", { numeric: true }); return c * d; });
  rows.forEach(r => tb.appendChild(r));
  [...t.tHead.rows[0].cells].forEach((th, i) => { th.setAttribute("aria-sort", i === col ? (dir === "asc" ? "ascending" : "descending") : "none"); const a = th.querySelector(".sarr"); if (a) a.textContent = i === col ? (dir === "asc" ? "↑" : "↓") : "↕"; });
}
function enhanceTables() {
  document.querySelectorAll("#view table, #sheet table").forEach((t, i) => {
    if (t.dataset.own || !t.tHead || !t.tHead.rows[0] || !t.tBodies[0] || t.tBodies[0].rows.length < 2) return;
    const key = tableKey(t, i); t.dataset.skey = key;
    [...t.tHead.rows[0].cells].forEach((th, c) => { if (th.classList.contains("cb") || th.colSpan > 1 || !th.textContent.trim() || th.dataset.sidx) return; th.dataset.sidx = c; th.classList.add("sortable"); th.insertAdjacentHTML("beforeend", `<span class="sarr">↕</span>`); });
    const st = S.tsort[key]; if (st) sortTable(t, st.col, st.dir);
  });
}

const colPref = table => S.colprefs.find(p => p.id === `${S.dept}_${table}`);
function colOrder(table) {

  const order = [...(pr.order || []).filter(k => T.all.includes(k)), ...T.all.filter(k => !(pr.order || []).includes(k))];
  return { order, hidden: (pr.hidden || []).filter(k => T.all.includes(k)) };
}

async function archiveOrder(o, reason, extra = {}) {
  const upd = { archived: true, archivedAt: Date.now(), archivedBy: actor(), archivedReason: reason || "", archivedPrev: { payment: o.payment, fulfillment: o.fulfillment }, payment: "", fulfillment: "", log: logAdd(o, [reason ? `archived the order (${reason})` : "archived the order"]), ...extra };
  await patch("orders", o.id, upd);
  if (!S.db) { S.orders = S.orders.filter(x => x.id !== o.id); S.archived.push(Object.assign(o, upd)); }
  S.sel.delete(o.id);
}
async function restoreOrder(o) {
  const pv = o.archivedPrev || {};
  const upd = { archived: false, archivedAt: 0, archivedReason: "", mergedInto: "", payment: pv.payment || "pending", fulfillment: pv.fulfillment || "unfulfilled", log: logAdd(o, ["made the order active again"]) };
  if (S.db) await S.db.collection("orders").doc(o.id).update(upd);
  else { S.archived = S.archived.filter(x => x.id !== o.id); S.orders.push(Object.assign(o, upd)); render(); }
}
function openMerge() {
  const os = S.orders.filter(o => S.sel.has(o.id)).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
  if (os.length < 2) { toast("Select 2 or more orders to merge."); return; }
  const names = new Set(os.map(o => (o.customer || "").trim().toLowerCase()));
  openSheet(`<h3>Merge ${os.length} orders into 1 shipment</h3>
    ${names.size > 1 ? `<div class="notice">Heads up: these orders are for different customers.</div>` : ""}
    <div class="field"><label>Keep this order #</label>${os.map((o, i) => `<label class="radio-line"><input type="radio" name="mg-main" value="${o.id}" ${i === 0 ? "checked" : ""}> <b>${esc(onum(o))}</b> · ${esc(o.customer || "")} · ${itemsLabel(o)} · ${peso2(total(o))}</label>`).join("")}</div>
    <div style="font-size:13px">All items move into the order you keep, each marked with the order # it came from. The other orders go to <b>Archived orders</b> (you can unmerge later). Combined total <b>${peso2(os.reduce((a, o) => a + total(o), 0))}</b>.</div>
    <div id="sheet-err" class="confirm" hidden></div>
    <div class="sheet-foot"><button class="btn" type="button" data-act="close">Cancel</button><button class="btn primary" type="submit">Merge</button></div>`,
  async () => {
    const mainId = document.querySelector("input[name=mg-main]:checked").value;
    const main = os.find(o => o.id === mainId), rest = os.filter(o => o.id !== mainId);
    const tagIt = o => (o.items || []).map(i => ({ ...i, from: i.from || o.num }));
    const sum = k => rest.reduce((a, o) => a + (Number(o[k]) || 0), Number(main[k]) || 0);
    await patch("orders", main.id, {
      items: [...tagIt(main), ...rest.flatMap(tagIt)], merged: [...(main.merged || []), ...rest.flatMap(o => [o.num, ...(o.merged || [])])],
      mergedParts: [...(main.mergedParts || []), ...rest.map(o => ({ id: o.id, num: o.num, ref: o.ref || "", adjust: Number(o.adjust) || 0, discount: Number(o.discount) || 0, nums: [o.num, ...(o.merged || [])] }))],
      adjust: sum("adjust"), discount: sum("discount"), tags: [...new Set([...(main.tags || []), ...rest.flatMap(o => o.tags || [])])],
      log: logAdd(main, [`merged ${rest.map(onum).join(", ")} into this order for 1 shipment`]),
    });
    for (const o of rest) await archiveOrder(o, `merged into #${main.num}`, { mergedInto: main.id });
    S.sel.clear(); closeSheet(); render(); toast(`Merged into ${onum(findOrder(main.id) || main)}.`);
  });
}
async function unmergeOrder(o) {
  const parts = o.mergedParts || []; const nums = new Set(parts.flatMap(p => p.nums || [p.num]));
  for (const p of parts) { const a = S.archived.find(x => x.id === p.id); if (a) await restoreOrder(a); }
  const sub = k => (Number(o[k]) || 0) - parts.reduce((a, p) => a + (Number(p[k]) || 0), 0);
  await patch("orders", o.id, { items: (o.items || []).filter(i => !nums.has(i.from)), merged: [], mergedParts: [], adjust: sub("adjust"), discount: sub("discount"), log: logAdd(o, [`unmerged ${[...nums].map(n => "#" + n).join(", ")}`]) });
  toast("Unmerged. The other orders are active again.");
}
/* which order each item came from, for orders merged in Shopify (#RS2604 #RS2612) */
async function traceItems(o) {
  const nums = [...new Set((onum(o).match(/[A-Z]{1,4}\d{3,}/gi) || []).map(x => x.toUpperCase()))];
  if (!S.mcp) { toast("Open the app in claude.ai with Shopify connected to look this up."); return; }
  toast("Checking Shopify…");
  const map = new Map();
  for (const n of nums) {
    try {
      const p = await shopCall(`query RSByName($q: String!) { orders(first: 5, query: $q) { nodes { name lineItems(first: 50) { nodes { name quantity } } } } }`, { q: "name:" + n }, 5);
      for (const node of (dig(p, "orders") || {}).nodes || []) if (String(node.name).replace(/^#/, "").toUpperCase() === n) for (const li of (node.lineItems || {}).nodes || []) if (!map.has(li.name)) map.set(li.name, n);
    } catch (e) {}
  }
  if (!map.size) { toast("Shopify has no separate orders under those numbers."); return; }
  const items = (o.items || []).map(i => i.from || !map.has(i.name) ? i : { ...i, from: map.get(i.name) });
  await patch("orders", o.id, { items, log: logAdd(o, ["matched each item to its order # from Shopify"]) });
  closeSheet(); openOrderDetails(o.id); toast("Done. Each item now shows its order #.");
}

function shipOf(o) {
  if (o.ship && (o.ship.address1 || o.ship.city)) return { name: o.ship.name || o.customer || "", phone: o.ship.phone || o.phone || "", ...o.ship };
  const parts = (o.address || "").split(",").map(x => x.trim()).filter(Boolean);
  const country = /philippines/i.test(parts[parts.length - 1] || "") ? parts.pop() : "";
  const zip = /^\d{4}$/.test(parts[parts.length - 1] || "") ? parts.pop() : "";
  const province = parts.length > 2 ? parts.pop() : "", city = parts.length > 1 ? parts.pop() : "";
  const address2 = parts.length > 1 ? parts.pop() : "";
  return { name: o.customer || "", phone: o.phone || "", address1: parts.join(", "), address2, city, province, zip, country };
}
function jntRows() {
  const sel = S.orders.filter(o => S.sel.has(o.id));
  const list = sel.length ? sel : packList().filter(o => courierOf(o) === "J&T");
  return [["Order No.", "Receiver Name", "Receiver Phone", "Province", "City/Municipality", "Barangay", "Street Address", "Zip Code", "Item Name", "Quantity", "Weight (kg)", "COD Amount", "Declared Value", "Remarks"],
    ...list.map(o => { const sh = shipOf(o); return [onum(o), sh.name || o.customer, (sh.phone || o.phone || "").replace(/^\+63/, "0"), sh.province, sh.city, sh.address2, sh.address1, sh.zip, (o.items || []).map(i => `${i.qty}x ${i.name}`).join("; ").slice(0, 120), itemCount(o), "", o.payment === "paid" ? 0 : o.payment === "pending" ? total(o) : "", total(o), o.note || ""]; })];
}

async function jntCopy() {

async function bulkAction(kind) {
  const targets = S.orders.filter(o => S.sel.has(o.id));
  if (kind === "clear") { S.sel.clear(); render(); return; }
  if (kind === "archive") { for (const o of targets) await archiveOrder(o, ""); toast(`Archived ${targets.length} order${targets.length === 1 ? "" : "s"}.`); S.sel.clear(); render(); return; }
  if (kind === "tag") {
    const t = val("bulk-tag").toUpperCase(); if (!t) { toast("Type a tag first."); return; }
    for (const o of targets) if (!(o.tags || []).includes(t)) await updateOrder(o, { tags: [...(o.tags || []), t] });
    toast(`Added ${t} to ${targets.length} order${targets.length === 1 ? "" : "s"}.`);
  } else {
    const ch = kind === "paid" ? { payment: "paid" } : kind.startsWith("pay:") ? { payment: kind.slice(4) } : { fulfillment: kind.replace(/^ful:/, "") };
    for (const o of targets) await updateOrder(o, ch);
    toast(`Updated ${targets.length} order${targets.length === 1 ? "" : "s"}.`);
  }
  S.sel.clear(); render();
}

function customerList() {
  const map = new Map();
  for (const c of S.customers) {
    const k = custKey(c); if (!k) continue;
    map.set(k, { ...c, docId: c.id, platforms: new Set(c.shopifyOrders ? ["Website"] : []), base: { orders: c.shopifyOrders || 0, spent: c.shopifySpent || 0 }, imp: { orders: 0, spent: 0 }, man: { orders: 0, spent: 0 }, last: 0, orderIds: [], example: false });
  }
  for (const o of S.orders) {
    const name = (o.customer || "").trim();
    const k = (o.email && map.has(o.email.toLowerCase())) ? o.email.toLowerCase() : (o.email || name.toLowerCase());
    if (!k) continue;
    let c = map.get(k) || [...map.values()].find(x => x.name && x.name.toLowerCase() === name.toLowerCase());
    if (!c) { c = { name: name || o.email, email: o.email || "", phone: "", address: "", tags: [], platforms: new Set(), base: null, imp: { orders: 0, spent: 0 }, man: { orders: 0, spent: 0 }, last: 0, orderIds: [], example: true }; map.set(k, c); }
    if (!isVoid(o)) { const b = o.imported ? c.imp : c.man; b.orders++; b.spent += total(o); }
    c.platforms.add(plat(o.platform));
    if (!c.phone && o.phone) c.phone = o.phone;
    if (!c.address && o.address) c.address = o.address;
    if ((o.createdAt || 0) > c.last) c.last = o.createdAt;
    c.orderIds.push(o.id);
    if (!o.example) c.example = false;
  }
  return [...map.values()].map(c => {
    const shop = c.base && c.base.orders ? c.base : c.imp;
    return { ...c, orders: shop.orders + c.man.orders, spent: shop.spent + c.man.spent };
  }).sort((a, b) => b.spent - a.spent);
}

  document.querySelectorAll("#sheet .item-row").forEach(r => { t += (Number(r.querySelector(".it-q").value) || 0) * (Number(r.querySelector(".it-price").value) || 0); });

}

const editItemRow = (i = {}) => `<div class="ei-row" ${i.from ? `data-from="${esc(i.from)}"` : ""}><input class="ei-name" list="ei-products" value="${esc(i.name || "")}" placeholder="Item name" aria-label="Item"><input class="ei-q num" type="number" min="0" step="1" value="${i.qty ?? 1}" aria-label="Qty"><input class="ei-p num" type="number" min="0" step="0.01" value="${i.price ?? ""}" placeholder="Price" aria-label="Unit price"><button class="btn ghost sm" type="button" data-act="ei-rm" aria-label="Remove item">×</button></div>`;
function eiRead() {
  const items = [];
  document.querySelectorAll("#sheet .ei-row").forEach(r => {
    const name = r.querySelector(".ei-name").value.trim(), qty = Number(r.querySelector(".ei-q").value) || 0;
    if (!name || qty <= 0) return;
    const p = S.products.find(x => (x.name || "").toLowerCase() === name.toLowerCase());
    const pv = r.querySelector(".ei-p").value;
    items.push({ ...(r.dataset.from ? { from: r.dataset.from } : {}), productId: p ? p.id : "", name, sku: p ? p.sku || "" : "", qty, price: pv === "" ? (p ? Number(p.price) || 0 : 0) : Number(pv) || 0, cost: p ? Number(p.cost) || 0 : 0 });
  });
  return items;
}
function eiTotal() {
  const items = eiRead(), sub = items.reduce((a, i) => a + i.qty * i.price, 0);
  const pct = $("#ei-dtype") && $("#ei-dtype").value === "pct", dv = numv("ei-disc");
  const disc = pct ? Math.round(sub * dv) / 100 : dv;
  const el = $("#ei-total"); if (el) el.textContent = peso2(sub + numv("ei-adj") - disc);
  const ds = $("#ei-dshow"); if (ds) ds.textContent = disc ? "−" + peso2(disc) : "";
}
function openItemsEdit(id) {

    <div class="row">

/* ---------- waybill scan → tracking # → Shopify fulfillment ---------- */
async function saveWaybill(id, code) {
  const o = S.orders.find(x => x.id === id); if (!o || S.readOnly) return;
  const tracking = String(code).trim().replace(/\s+/g, ""), courier = courierOf(o);
  const dupe = S.orders.find(x => x.id !== id && x.tracking === tracking);
  if (dupe) { toast(`That waybill is already on #${dupe.num}.`); return; }
  await patch("orders", o.id, { tracking, courier, trackingAt: Date.now(), shopShipErr: "", log: logAdd(o, [`scanned waybill ${tracking} (${courier})`]) });
  Object.assign(o, { tracking, courier });
  if (S.wbShip !== false) {
    if (o.fulfillment !== "fulfilled" && o.fulfillment !== "delivered") await updateOrder(o, { fulfillment: "fulfilled" });
    toast(`#${o.num}: ${tracking} saved · shipped`);
    if ((o.ref && /^\d+$/.test(o.ref)) || (o.mergedParts || []).some(p => /^\d+$/.test(p.ref || ""))) await shopifyShip(o, false);
  } else toast(`#${o.num}: tracking ${tracking} saved`);
}
const SHIP_FO_Q = `query RSFO($id: ID!) { order(id: $id) { id displayFulfillmentStatus fulfillmentOrders(first: 10) { nodes { id status requestStatus } } } }`;
const SHIP_RELEASE_M = `mutation RSRelease($id: ID!) { fulfillmentOrderReleaseHold(id: $id) { fulfillmentOrder { id status } userErrors { field message } } }`;
const SHIP_CREATE_M = `mutation RSShip($fulfillment: FulfillmentInput!) { fulfillmentCreate(fulfillment: $fulfillment) { fulfillment { id status trackingInfo { number company url } } userErrors { field message } } }`;
async function shopMut(query, variables) {
  const p = shopPayload(await S.mcp.callTool(SHOP_SERVER, "graphql_mutation", { query, variables }));
  const ue = dig(p, "userErrors"), errs = dig(p, "errors");
  if (Array.isArray(ue) && ue.length) throw { code: "tool_error", message: ue.map(e => e.message).join("; ") };
  if (Array.isArray(errs) && errs.length) throw { code: "tool_error", message: errs.map(e => e.message || e).join("; ") };
  return p;
}
async function shopifyShip(o, manual) {
  if (!S.mcp) { const m = "Open the app in claude.ai with Shopify connected to send tracking."; await patch("orders", o.id, { shopShipErr: m }); if (manual) toast(m); return; }
  const refs = [o.ref, ...(o.mergedParts || []).map(p => p.ref)].filter(r => /^\d+$/.test(r || ""));
  try {
    for (const ref of refs) {
      const gid = "gid://shopify/Order/" + ref;
      let fos = ((dig(await shopCall(SHIP_FO_Q, { id: gid }, 10), "fulfillmentOrders") || {}).nodes || []);
      for (const fo of fos.filter(f => f.status === "ON_HOLD")) await shopMut(SHIP_RELEASE_M, { id: fo.id });
      if (fos.some(f => f.status === "ON_HOLD")) fos = ((dig(await shopCall(SHIP_FO_Q, { id: gid }, 10), "fulfillmentOrders") || {}).nodes || []);
      const open = fos.filter(f => ["OPEN", "IN_PROGRESS", "SCHEDULED"].includes(f.status));
      if (!open.length) { if (fos.some(f => f.status === "CLOSED")) continue; throw { code: "tool_error", message: "Shopify has nothing left to fulfill on order " + ref + "." }; }
      await shopMut(SHIP_CREATE_M, { fulfillment: { lineItemsByFulfillmentOrder: open.map(f => ({ fulfillmentOrderId: f.id })), trackingInfo: { number: o.tracking, company: SHOP_COMPANY[courierOf(o)] || "Other" }, notifyCustomer: true } });
    }
    const cur = findOrder(o.id) || o;
    await patch("orders", o.id, { shopShippedAt: Date.now(), shopShipErr: "", shopFul: "fulfilled", log: logAdd(cur, [`sent tracking ${o.tracking} to Shopify`]) });
    toast(`${onum(o)}: tracking sent to Shopify. The buyer can see it in their Order History.`);
  } catch (e) {
    const m = e && e.code === "needs_reauth" ? "Shopify needs you to sign in again (claude.ai → Settings → Connectors)." : e && e.code === "not_in_manifest" ? "Allow Shopify for this page in its Permissions menu." : "Shopify: " + ((e && e.message) || "couldn't send tracking.");
    await patch("orders", o.id, { shopShipErr: m }); toast(m);
  }
}

let zxingP = null;
function loadZXing() {
  if (window.ZXing) return Promise.resolve(window.ZXing);
  return zxingP ||= new Promise((ok, bad) => { const s = document.createElement("script"); s.src = "https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"; s.onload = () => ok(window.ZXing); s.onerror = () => { zxingP = null; bad(new Error("Couldn't load the scanner. Check your internet and try again.")); }; document.head.appendChild(s); });
}
async function decodeBarcode(file) {
  try {
    if ("BarcodeDetector" in window) { const bmp = await createImageBitmap(file); const r = await new window.BarcodeDetector().detect(bmp); if (r[0]) return r[0].rawValue; }
  } catch (e) {}
  try {
    const Z = await loadZXing(); const url = URL.createObjectURL(file);
    try { const hints = new Map([[Z.DecodeHintType.TRY_HARDER, true]]); const res = await new Z.BrowserMultiFormatReader(hints).decodeFromImageUrl(url); return res.getText(); }

}

  return target === "pack" ? handlePackScan(code) : handleScan(code);
}

  if (delta && !S.readOnly) { await adjustStock(p.id, delta); await patch("products", p.id, { webSync: "pending", editedAt: Date.now() }); }
  S.lastScan = { code, id: p.id, delta, at: Date.now() };
  render(); const s = $("#scan"); if (s) s.focus();
  toast(delta ? `${p.name}: ${delta > 0 ? "+1" : "−1"} → ${Number(p.stock) || 0} in stock` : `${p.name}: ${Number(p.stock) || 0} in stock`);
}

function parseCSV(text) {
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ",") { row.push(f); f = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(f); rows.push(row); row = []; f = ""; }
    else f += c;
  }
  if (f || row.length) { row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}
function shopifyTime(s) {

  return isNaN(t) ? 0 : t;
}
function shopifyOrders(text) {

  const col = name => h.indexOf(name.toLowerCase());

  const get = (r, name) => { const i = col(name); return i >= 0 ? (r[i] || "").trim() : ""; };
  const byName = new Map();
  for (const r of rows.slice(1)) {
    const name = get(r, "Name"); if (!name) continue;
    let o = byName.get(name);
    if (!o) {
      const fin = get(r, "Financial Status").toLowerCase(), fs = get(r, "Fulfillment Status").toLowerCase();
      const payment = { paid: "paid", pending: "pending", authorized: "pending", partially_paid: "partial", partially_refunded: "paid", refunded: "refunded", voided: "voided", expired: "voided" }[fin] || "pending";
      const createdAt = shopifyTime(get(r, "Created at"));
      const fulfilledAt = shopifyTime(get(r, "Fulfilled at"));
      const fulfillment = get(r, "Cancelled at") ? "cancelled" : fs === "fulfilled" ? "fulfilled" : (payment === "voided" ? "not_required" : "unfulfilled");
      o = {
        num: name.replace(/^#/, ""), createdAt, date: createdAt ? dstr(createdAt) : today(), platform: "website",
        customer: get(r, "Billing Name") || get(r, "Shipping Name") || get(r, "Email"),
        phone: cleanPhone(get(r, "Phone") || get(r, "Shipping Phone") || get(r, "Billing Phone")),
        email: get(r, "Email").toLowerCase(),
        address: [get(r, "Shipping Address1") || get(r, "Shipping Street"), get(r, "Shipping Address2"), get(r, "Shipping City"), get(r, "Shipping Province"), get(r, "Shipping Zip"), get(r, "Shipping Country")].filter(Boolean).join(", "),
        ref: get(r, "Id"), items: [], fees: 0, shipping: 0,
        ship: { name: get(r, "Shipping Name"), phone: cleanPhone(get(r, "Shipping Phone")), address1: get(r, "Shipping Address1") || get(r, "Shipping Street"), address2: get(r, "Shipping Address2"), city: get(r, "Shipping City"), province: get(r, "Shipping Province Name") || get(r, "Shipping Province"), zip: get(r, "Shipping Zip"), country: get(r, "Shipping Country") },
        courier: pickCourier(get(r, "Shipping Method"), !!(get(r, "Shipping Address1") || get(r, "Shipping Street"))), shipTitle: get(r, "Shipping Method"),
        shopifyTotal: Number(get(r, "Total")) || 0,

      byName.set(name, o);
    }
    const iname = get(r, "Lineitem name"), qty = Number(get(r, "Lineitem quantity")) || 0;
    if (iname && qty) {
      const sku = get(r, "Lineitem sku");
      const p = S.products.find(x => (sku && x.sku && x.sku.toLowerCase() === sku.toLowerCase()) || (x.name || "").toLowerCase() === iname.toLowerCase());
      o.items.push({ productId: p ? p.id : "", name: iname, sku, qty, price: Number(get(r, "Lineitem price")) || 0, cost: p ? Number(p.cost) || 0 : 0 });
    }
  }
  return [...byName.values()].map(o => { o.adjust = Math.round((o.shopifyTotal - itemsTotal(o)) * 100) / 100; delete o.shopifyTotal; o.fulfillment = fulFromTags(o.fulfillment, o.tags); return o; });
}
const cleanPhone = s => (s || "").replace(/^'+/, "").trim();
const safeId = s => String(s).replace(/[^A-Za-z0-9_\-.]/g, "").slice(0, 120) || uid("x");

function shopifyCustomers(text) {
  const rows = parseCSV(text.replace(/^﻿/, ""));
  const h = rows[0].map(x => x.trim().toLowerCase());
  const get = (r, ...names) => { for (const n of names) { const i = h.indexOf(n.toLowerCase()); if (i >= 0 && (r[i] || "").trim()) return r[i].trim(); } return ""; };
  return rows.slice(1).map(r => {

      phone: cleanPhone(get(r, "Phone", "Default Address Phone")),
      address: [get(r, "Default Address Address1", "Address1"), get(r, "Default Address Address2", "Address2"), get(r, "Default Address City", "City"), get(r, "Default Address Province Code", "Province", "Province Code"), get(r, "Default Address Zip", "Zip"), get(r, "Default Address Country Code", "Country")].filter(Boolean).join(", "),

let lastImportFile = null;
async function readImportFile(file) {
  lastImportFile = file;
  const prev = $("#imp-preview"), go = $("#imp-go");
  try {
    const text = await file.text();
    const kind = detectKind(text);
    if (!kind) throw new Error("This doesn't look like a Shopify orders or customers export. Export it from Shopify as CSV and try again.");
    const writes = []; let fresh = 0, updated = 0, sample = [], warn = "";
    if (kind === "orders") {
      const openOnly = S.impOpenOnly !== false;
      const have = new Map([...S.orders, ...S.archived].map(o => [o.id, o]));
      const parsed = shopifyOrders(text).filter(o => !openOnly || have.has(orderDocId(o)) || (OPEN_FUL.has(o.fulfillment) && !isVoid(o)));
      for (const o of parsed) {
        const id = orderDocId(o), ex = have.get(id);
        if (ex && ex.archived) continue;
        if (!ex) { o.pickup = o.courier === "SDD"; writes.push({ col: "orders", id, data: o }); fresh++; }
        else {

        }
      }
      sample = parsed.slice(0, 3).map(o => `#${esc(o.num)} · ${esc(o.customer)} · ${peso2(total(o))} · ${esc(pay(o.payment).name)}`);
      const unmatched = new Set(parsed.flatMap(o => o.items.filter(i => !i.productId).map(i => i.name)));
      if (unmatched.size) warn = `${unmatched.size} product name${unmatched.size === 1 ? "" : "s"} don't match your Inventory yet, so profit for those items won't include product cost. Add them in Inventory with the same name or SKU, then import again.`;
      prev.innerHTML = summary(parsed.length, "orders", fresh, updated, sample, warn, "Importing doesn't change your inventory counts.");
    } else {
      const parsed = shopifyCustomers(text);
      const have = new Map(S.customers.map(c => [c.id, c]));
      for (const c of parsed) {
        const id = custDocId(c), ex = have.get(id);
        if (!ex) { writes.push({ col: "customers", id, data: c }); fresh++; }
        else { writes.push({ col: "customers", id, data: { ...clean(ex), ...c, note: c.note || ex.note || "" } }); updated++; }
      }
      sample = parsed.slice(0, 3).map(c => `${esc(c.name)} · ${esc(c.email || c.phone)} · ${c.shopifyOrders} orders`);
      prev.innerHTML = summary(parsed.length, "customers", fresh, updated, sample, "", "");
    }
    pendingImport = { writes, kind };
    go.disabled = !writes.length;
    go.textContent = writes.length ? `Import ${writes.length.toLocaleString("en-PH")} ${kind}` : "Already up to date";
  } catch (e) {
    pendingImport = null; go.disabled = true;
    prev.innerHTML = `<div class="confirm">${esc(e.message || "Couldn't read that file.")}</div>`;
  }
}

function openAttForm(mid) {
  const date = S.att.date, r = attRec(date, mid) || {}, cur = r.status && r.status !== "present" ? r.status : (r.in ? "present" : "");
  openSheet(`
    <h3>${esc(memberName(mid))}</h3>
    <div style="color:var(--muted);font-size:13px">${longDate(date)} · times in Manila time</div>
    <div class="field"><label for="at-status">Status</label><select id="at-status">
      <option value="present" ${cur === "present" ? "selected" : ""}>Worked (Present / Late is automatic)</option>
      ${ATT_STATUS.filter(s => ["leave", "sick", "off", "holiday", "absent"].includes(s.id)).map(s => `<option value="${s.id}" ${cur === s.id ? "selected" : ""}>${s.name}</option>`).join("")}
      ${cur ? "" : `<option value="" selected>No record</option>`}
    </select></div>
    <div class="row">
      <div class="field"><label for="at-in">Time in</label><input id="at-in" type="time" value="${hhmm(r.in)}"></div>
      <div class="field"><label for="at-out">Time out</label><input id="at-out" type="time" value="${hhmm(r.out)}"></div>
    </div>
    <div class="field"><label for="at-note">Note</label><input id="at-note" value="${esc(r.note || "")}" placeholder="e.g. Half day, approved by CEO"></div>
    ${r.recordedByName ? `<div style="font-size:12px;color:var(--muted)">Last recorded by ${esc(r.recordedByName)}${r.updatedAt ? " · " + relTime(r.updatedAt) : ""}</div>` : ""}
    <div id="sheet-err" class="confirm" hidden></div>
    ${r.id ? `<div id="del-slot"><button class="btn danger sm" type="button" data-act="ask-del-att" data-id="${r.id}">Clear this record</button></div>` : ""}
    <div class="sheet-foot"><button class="btn" type="button" data-act="close">Cancel</button><button class="btn primary" type="submit">Save</button></div>`,
  async () => {
    const tin = fromHHMM(date, val("at-in")), tout = fromHHMM(date, val("at-out"));
    const status = val("at-status") || (tin ? "present" : "");
    if (!status) { closeSheet(); return; }
    if (status === "present" && !tin) return sheetError("Enter a time in, or choose a leave status.");
    if (tin && tout && tout < tin) return sheetError("Time out is earlier than time in.");
    const by = (member(myMemberId()) || {}).name || (S.me && S.me.name) || "";
    await save("attendance", attId(date, mid), { date, memberId: mid, status, in: status === "present" ? tin : 0, out: status === "present" ? tout : 0, note: val("at-note"), recordedByName: by, updatedAt: Date.now() });
    closeSheet(); toast("Attendance saved.");
  });
}

/* ---------- investors (Finance) ---------- */
function finishedSection(list) {
  if (!list.length) return "";
  const years = [...new Set(list.map(invYear))].sort().reverse();
  return `<section class="panel"><div class="head"><h2>Finished investments</h2><span style="font-size:13px;color:var(--muted)">${list.length} records · ${peso(list.reduce((a, v) => a + (Number(v.amount) || 0), 0))}</span></div>
    ${years.map((y, yi) => { const rows = list.filter(v => invYear(v) === y).sort((a, b) => (invEnd(b) || "").localeCompare(invEnd(a) || "")); return `<details ${yi === 0 ? "open" : ""}><summary class="yr"><strong>${esc(y)}</strong> <span>${rows.length} · ${peso(rows.reduce((a, v) => a + (Number(v.amount) || 0), 0))}</span></summary>
      <div class="table-wrap" style="margin-top:8px"><table class="otable inv">
        <thead><tr><th>INV Code</th><th>Investor's name</th><th class="r">Amount</th><th class="r">%</th><th class="r">Interest amount</th><th class="r">Duration</th><th class="r">Total interest</th><th>Start date</th><th>End date</th><th class="r">Amount due</th></tr></thead>
        <tbody>${rows.map(v => `<tr data-act="edit-inv" data-id="${v.id}"><td class="nowrap">${esc(v.code || "")}</td><td>${esc(v.name)}${v.fb && v.fb !== v.name ? `<div class="s">${esc(v.fb)}</div>` : ""}</td><td class="r num nowrap">${peso2(v.amount)}</td><td class="r num">${v.rate ? Number(v.rate) + "%" : ""}</td><td class="r num nowrap">${invMonthly(v) ? peso2(invMonthly(v)) : ""}</td><td class="r num nowrap">${esc(invDur(v))}</td><td class="r num nowrap">${invTotalInterest(v) ? peso2(invTotalInterest(v)) : ""}</td><td class="nowrap">${fmtLong(v.start)}</td><td class="nowrap">${fmtLong(invEnd(v))}</td><td class="r num nowrap">${invDue(v) ? peso2(invDue(v)) : ""}</td></tr>`).join("")}</tbody>
      </table></div></details>`; }).join("")}
  </section>`;
}
const ymNow = () => mToday().slice(0, 7);
function addMonths(d, k) {
  if (!d) return "";
  const [y, m, day] = d.split("-").map(Number);
  const lastOf = (yy, mm) => new Date(yy, mm, 0).getDate();
  const isLast = day === lastOf(y, m);
  const t = new Date(y, m - 1 + k, 1), ny = t.getFullYear(), nm = t.getMonth() + 1;
  const nd = isLast ? lastOf(ny, nm) : Math.min(day, lastOf(ny, nm));
  return `${ny}-${String(nm).padStart(2, "0")}-${String(nd).padStart(2, "0")}`;
}
const invMonthly = v => v.monthlyOverride ? Number(v.monthlyOverride) : Math.round((Number(v.amount) || 0) * (Number(v.rate) || 0)) / 100;
const invTotalInterest = v => v.totalOverride ? Number(v.totalOverride) : invMonthly(v) * (Number(v.months) || 0);
const invEnd = v => v.end || (v.start && v.months ? addMonths(v.start, Number(v.months) - 1) : "");
const invDue = v => v.dueOverride ? Number(v.dueOverride) : v.closed ? 0 : (Number(v.amount) || 0) + invMonthly(v);
const invDur = v => v.durationText || (v.months ? String(v.months) : "–");
const invYear = v => v.group || (invEnd(v) || v.start || "").slice(0, 4) || "Undated";
function invSchedule(v) {
  const n = Number(v.months) || 0; if (v.closed || !v.start || !n) return [];
  return Array.from({ length: n }, (_, i) => { const date = addMonths(v.start, i); return { i, date, ym: date.slice(0, 7), amount: invMonthly(v) + (i === n - 1 && v.kind !== "loan" ? Number(v.amount) || 0 : 0), final: i === n - 1, paid: (v.paid || []).includes(date.slice(0, 7)) }; });
}
function invStatus(v) {
  const t = mToday(), end = invEnd(v);
  if (v.closed) return { id: "finished", name: "Finished", cls: "" };
  if (!v.start) return { id: "incomplete", name: "Details missing", cls: "warn" };
  if (v.start > t) return { id: "upcoming", name: "Upcoming", cls: "info" };
  if (end && end < t) { const s = invSchedule(v); return s.length && s.every(p => p.paid) ? { id: "done", name: "Completed", cls: "" } : { id: "matured", name: "Matured", cls: "warn" }; }
  return { id: "active", name: "Active", cls: "good" };
}
const invMismatch = v => v.monthlyOverride && v.rate && Math.abs(Number(v.monthlyOverride) - Math.round((Number(v.amount) || 0) * Number(v.rate)) / 100) > 0.5;
const fmtLong = d => d ? new Date(d + "T12:00:00").toLocaleDateString("en-PH", { month: "short", day: "numeric", year: "numeric" }) : "";

      <div class="kpi"><span class="label">Next maturity</span><span class="value" style="font-size:18px">${next ? fmtLong(invEnd(next)) : "–"}</span><span class="sub">${next ? `${esc(next.code || next.name)} · ${peso(invDue(next))} due` : "None scheduled"}</span></div>
    </div>
    ${past.length && can ? `<div class="notice"><span>${past.length} past payout${past.length === 1 ? " isn't" : "s aren't"} marked paid yet. If they were all paid before you started using this app, mark them in one go.</span><span id="past-slot"><button class="btn sm" type="button" data-act="inv-past">Mark all past payouts paid</button></span></div>` : ""}
    <section class="panel"><h2>Payouts in ${monthLabel(ym)}</h2>
      ${thisMonth.length ? `<div class="list">${thisMonth.map(({ v, p }) => `<div class="li"><div class="main"><div class="t">${esc(v.code ? v.code + " · " : "")}${esc(v.name)}</div><div class="s">${fmtLong(p.date)} · payment ${p.i + 1} of ${v.months}${p.final && v.kind !== "loan" ? " · final, includes capital" : ""}${v.kind === "loan" ? " · loan payment" : ""}</div></div>

/* ---------- logins vault ---------- */
const b64 = u => btoa(String.fromCharCode(...new Uint8Array(u)));
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function vaultDerive(pass, salt, iter) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: unb64(salt), iterations: iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
}
async function vEnc(key, text) { const iv = crypto.getRandomValues(new Uint8Array(12)); const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, new TextEncoder().encode(text)); return { iv: b64(iv), ct: b64(ct) }; }
async function vDec(key, box) { const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(box.iv) }, key, unb64(box.ct)); return new TextDecoder().decode(pt); }
const VCHECK = "rs-vault-ok";
async function vaultSubmit() {
  const pass = val("v-pass");
  const err = m => { const e = $("#v-err"); if (e) { e.textContent = m; e.hidden = false; } };
  if (!S.vault) {
    if (pass.length < 8) return err("Use at least 8 characters.");
    if (pass !== val("v-pass2")) return err("The two passphrases don't match.");
    const salt = b64(crypto.getRandomValues(new Uint8Array(16))), iter = 210000;
    const key = await vaultDerive(pass, salt, iter);
    const v = { salt, iter, check: await vEnc(key, VCHECK), setAt: Date.now() };
    if (S.db) await S.db.doc("config/vault").set(v); S.vault = v; S.vaultKey = key; render(); toast("Logins vault created."); return;
  }
  try { const key = await vaultDerive(pass, S.vault.salt, S.vault.iter); if ((await vDec(key, S.vault.check)) !== VCHECK) throw 0; S.vaultKey = key; S.pwShown = {}; render(); }
  catch (e) { err("That passphrase isn't right."); const el = $("#v-pass"); if (el) { el.value = ""; el.focus(); } }
}
async function vaultChange() {
  const np = val("vc-new");
  if (np.length < 8) return toast("Use at least 8 characters.");
  if (np !== val("vc-new2")) return toast("The two passphrases don't match.");
  const salt = b64(crypto.getRandomValues(new Uint8Array(16))), iter = 210000, nk = await vaultDerive(np, salt, iter);
  const upd = [];
  for (const l of S.logins) if (l.pw) upd.push([l.id, { pw: await vEnc(nk, await vDec(S.vaultKey, l.pw)) }]);
  for (const [id, d] of upd) await patch("logins", id, d);
  const v = { salt, iter, check: await vEnc(nk, VCHECK), setAt: Date.now() };
  if (S.db) await S.db.doc("config/vault").set(v); S.vault = v; S.vaultKey = nk; S.pwShown = {};
  render(); toast("Passphrase changed. Share the new one with your Admin team.");
}
async function loginPwAction(id, act) {
  const l = S.logins.find(x => x.id === id); if (!l || !l.pw || !S.vaultKey) return;
  if (act === "hide") { delete S.pwShown[id]; render(); return; }
  const pw = await vDec(S.vaultKey, l.pw);
  if (act === "show") { S.pwShown[id] = pw; render(); return; }
  try { await navigator.clipboard.writeText(pw); toast(`${l.account} password copied.`); } catch (e) { S.pwShown[id] = pw; render(); toast("Couldn't copy here. The password is shown instead."); }

const DEFAULT_POSITIONS = [["Founders", 1400], ["Admin", 700], ["Marketing", 700], ["Finance", 550], ["Senior Sales", 650], ["Sales Associate", 600], ["Sales Associate (trainee)", 500], ["Packer", 550]];
const DEPT_POSITION = { CEO: "Founders", ADMIN: "Admin", MARKETING: "Marketing", FINANCE: "Finance", SALES: "Sales Associate", PACKING: "Packer" };
const payCfg = () => ({ positions: DEFAULT_POSITIONS.map(([name, rate]) => ({ name, rate })), deductLate: false, paidLeave: false, paidHoliday: false, ...(S.paySettings || {}) });
const positionOf = m => m.payPosition || DEPT_POSITION[m.department] || "";
const rateOf = m => { if (m.dailyRate) return Number(m.dailyRate); const p = payCfg().positions.find(x => x.name === positionOf(m)); return p ? Number(p.rate) : 0; };
function payPeriod() {
  const [y, mo] = S.pay.month.split("-").map(Number), dim = new Date(y, mo, 0).getDate();
  const half = S.pay.half;
  const from = half === 2 ? 16 : 1, to = half === 1 ? 15 : dim;
  const d = n => `${S.pay.month}-${String(n).padStart(2, "0")}`;
  const label = half === 0 ? monthLabel(S.pay.month) : `${new Date(y, mo - 1, from).toLocaleDateString("en-PH", { month: "short", day: "numeric" })}–${to}, ${y}`;
  return { start: d(from), end: d(to), key: `${S.pay.month}-${half === 0 ? "M" : half === 1 ? "A" : "B"}`, label };
}
const ADD_FIELDS = [["overtime", "Overtime"], ["holidayPay", "Holiday pay"], ["allowance", "Allowance"], ["incentives", "Incentives / commission"], ["otherAdd", "Other additions"]];
const DED_FIELDS = [["cashAdvance", "Cash advance"], ["sss", "SSS"], ["philhealth", "PhilHealth"], ["pagibig", "Pag-IBIG"], ["otherDed", "Other deductions"]];
function payCalc(m, per) {
  const cfg = payCfg(), rate = rateOf(m), rec = S.payroll.find(r => r.id === per.key + "_" + m.id) || {};
  const days = []; let worked = 0, late = 0, lateMin = 0, leave = 0, absent = 0, hol = 0, hours = 0;
  for (let t = new Date(per.start + "T12:00:00+08:00").getTime(); dstr(t) <= per.end; t += 864e5) {
    const d = mDate(t); if (d > mToday()) break;
    const st = attStatus(d, m.id), r = attRec(d, m.id);
    if (st === "present" || st === "late") { worked++; hours += hoursOf(r); if (st === "late") { late++; lateMin += Math.max(0, mMinutes(r.in) - toMin(attCfg().start)); } }
    if (st === "leave" || st === "sick") leave++;
    if (st === "absent") absent++;
    if (st === "holiday") hol++;
    if (st !== "off" && st !== "notin") days.push({ d, st, r });
  }
  const paidDays = (rec.daysOverride !== undefined && rec.daysOverride !== "" ? Number(rec.daysOverride) : worked + (cfg.paidLeave ? leave : 0) + (cfg.paidHoliday ? hol : 0));
  const basic = paidDays * rate;
  const lateDed = cfg.deductLate ? Math.round(lateMin * rate / 8 / 60 * 100) / 100 : 0;
  const adds = ADD_FIELDS.reduce((a, [k]) => a + (Number(rec[k]) || 0), 0);
  const deds = DED_FIELDS.reduce((a, [k]) => a + (Number(rec[k]) || 0), 0) + lateDed;
  return { m, rec, rate, worked, late, lateMin, leave, absent, hol, hours, paidDays, basic, lateDed, adds, deds, net: basic + adds - deds, days, status: rec.status || "draft" };
}
const PAY_STATUS = { draft: { name: "Draft", cls: "" }, approved: { name: "Approved", cls: "info" }, paid: { name: "Paid", cls: "good" } };

      <tfoot><tr><td colspan="7" style="font-weight:800">TOTAL</td><td class="r num" style="font-weight:800">${peso2(sum("basic"))}</td><td class="r num">${peso2(sum("adds"))}</td><td class="r num">${peso2(sum("deds"))}</td><td class="r num" style="font-weight:800">${peso2(sum("net"))}</td><td></td></tr></tfoot>
    </table>${rows.length ? "" : `<div class="empty" style="padding:16px">No active staff. Add them in Admin → Directory.</div>`}</div>
