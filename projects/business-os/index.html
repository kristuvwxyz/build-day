    </div>
    ${past.length && can ? `<div class="notice"><span>${past.length} past payout${past.length === 1 ? " isn't" : "s aren't"} marked paid yet. If they were all paid before you started using this app, mark them in one go.</span><span id="past-slot"><button class="btn sm" type="button" data-act="inv-past">Mark all past payouts paid</button></span></div>` : ""}
    <section class="panel"><h2>Payouts in ${monthLabel(ym)}</h2>
      ${thisMonth.length ? `<div class="list">${thisMonth.map(({ v, p }) => `<div class="li"><div class="main"><div class="t">${esc(v.code ? v.code + " · " : "")}${esc(v.name)}</div><div class="s">${fmtLong(p.date)} · payment ${p.i + 1} of ${v.months}${p.final && v.kind !== "loan" ? " · final, includes capital" : ""}${v.kind === "loan" ? " · loan payment" : ""}</div></div>
        <div style="display:flex;gap:8px;align-items:center"><span class="num" style="font-weight:700">${peso2(p.amount)}</span>${p.paid ? `<span class="chip good">Paid</span>${can ? ` <button class="btn ghost sm" type="button" data-invpay="${v.id}" data-ym="${p.ym}" data-paid="0">Undo</button>` : ""}` : can ? `<button class="btn sm primary" type="button" data-invpay="${v.id}" data-ym="${p.ym}" data-paid="1">Mark paid</button>` : `<span class="chip warn">Due</span>`}</div></div>`).join("")}</div>` : `<div class="empty">No payouts scheduled this month.</div>`}

// Files: the artifact's file storage when this person can use it, otherwise saved in the database in pieces.

    const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);

  try { if (meta.asset && S.assets) await S.assets.delete(meta.asset); else if (meta.fid) for (let i = 0; i < meta.chunks; i++) await wdb().collection("invfiles").doc(`${meta.fid}-${i}`).delete(); } catch (e) {}
}

async function invSetPaid(id) {

async function invDecide(id, ok) {

function viewDues() {

  const list = [...S.dues].sort((a, b) => DUE_KINDS.findIndex(k => k[0] === a.kind) - DUE_KINDS.findIndex(k => k[0] === b.kind) || (Number(a.day) || 0) - (Number(b.day) || 0));

/* ---------- logins vault ---------- */
const b64 = u => btoa(String.fromCharCode(...new Uint8Array(u)));
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function vaultDerive(pass, salt, iter) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: unb64(salt), iterations: iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
}
async function vEnc(key, text) { const iv = crypto.getRandomValues(new Uint8Array(12)); const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, new TextEncoder().encode(text)); return { iv: b64(iv), ct: b64(ct) }; }
async function vDec(key, box) { const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(box.iv) }, key, unb64(box.ct)); return new TextDecoder().decode(pt); }
const VCHECK = "rs-vault-ok";
async function vaultSubmit() {
  const pass = val("v-pass");
  const err = m => { const e = $("#v-err"); if (e) { e.textContent = m; e.hidden = false; } };
  if (!S.vault) {
    if (pass.length < 8) return err("Use at least 8 characters.");
    if (pass !== val("v-pass2")) return err("The two passphrases don't match.");
    const salt = b64(crypto.getRandomValues(new Uint8Array(16))), iter = 210000;
    const key = await vaultDerive(pass, salt, iter);
    const v = { salt, iter, check: await vEnc(key, VCHECK), setAt: Date.now() };
    if (S.db) await wdb().doc("config/vault").set(v); S.vault = v; S.vaultKey = key; render(); toast("Logins vault created."); return;
  }
  try { const key = await vaultDerive(pass, S.vault.salt, S.vault.iter); if ((await vDec(key, S.vault.check)) !== VCHECK) throw 0; S.vaultKey = key; S.pwShown = {}; render(); }
  catch (e) { err("That passphrase isn't right."); const el = $("#v-pass"); if (el) { el.value = ""; el.focus(); } }
}
async function vaultChange() {
  const np = val("vc-new");
  if (np.length < 8) return toast("Use at least 8 characters.");
  if (np !== val("vc-new2")) return toast("The two passphrases don't match.");
  const salt = b64(crypto.getRandomValues(new Uint8Array(16))), iter = 210000, nk = await vaultDerive(np, salt, iter);
  const upd = [];
  for (const l of S.logins) if (l.pw) upd.push([l.id, { pw: await vEnc(nk, await vDec(S.vaultKey, l.pw)) }]);
  for (const [id, d] of upd) await patch("logins", id, d);
  for (const m of S.team) if (m.govIds) { try { await patch("team", m.id, { govIds: await vEnc(nk, await vDec(S.vaultKey, m.govIds)) }); } catch (e) {} }
  const v = { salt, iter, check: await vEnc(nk, VCHECK), setAt: Date.now() };
  if (S.db) await wdb().doc("config/vault").set(v); S.vault = v; S.vaultKey = nk; S.pwShown = {};
  render(); toast("Passphrase changed. Share the new one with your Admin team.");
}
async function loginPwAction(id, act) {
  const l = S.logins.find(x => x.id === id); if (!l || !l.pw || !S.vaultKey) return;
  if (act === "hide") { delete S.pwShown[id]; render(); return; }
  const pw = await vDec(S.vaultKey, l.pw);
  if (act === "show") { S.pwShown[id] = pw; render(); return; }
  try { await navigator.clipboard.writeText(pw); toast(`${l.account} password copied.`); } catch (e) { S.pwShown[id] = pw; render(); toast("Couldn't copy here. The password is shown instead."); }
}

const DEFAULT_POSITIONS = [["Founders", 1400], ["Admin", 700], ["Marketing", 700], ["Finance", 550], ["Senior Sales", 650], ["Sales Associate", 600], ["Sales Associate (trainee)", 500], ["Packer", 550]];
const DEPT_POSITION = { CEO: "Founders", ADMIN: "Admin", MARKETING: "Marketing", FINANCE: "Finance", SALES: "Sales Associate", PACKING: "Packer" };
const payCfg = () => ({ positions: DEFAULT_POSITIONS.map(([name, rate]) => ({ name, rate })), deductLate: false, paidLeave: false, paidHoliday: false, ...(S.paySettings || {}) });
const positionOf = m => m.payPosition || DEPT_POSITION[m.department] || "";
const rateOf = m => { if (m.dailyRate) return Number(m.dailyRate); const p = payCfg().positions.find(x => x.name === positionOf(m)); return p ? Number(p.rate) : 0; };
function payPeriod(month = S.pay.month, half = S.pay.half) {
  const [y, mo] = month.split("-").map(Number), dim = new Date(y, mo, 0).getDate();
  const from = half === 2 ? 16 : 1, to = half === 1 ? 15 : dim;
  const d = n => `${month}-${String(n).padStart(2, "0")}`;
  const label = half === 0 ? monthLabel(month) : `${new Date(y, mo - 1, from).toLocaleDateString("en-PH", { month: "short", day: "numeric" })}–${to}, ${y}`;
  return { start: d(from), end: d(to), key: `${month}-${half === 0 ? "M" : half === 1 ? "A" : "B"}`, label };
}
// No overtime pay (K, 2026-10-08), so there's no Overtime line on payslips.
const ADD_FIELDS = [["holidayPay", "Holiday pay"], ["allowance", "Allowance"], ["incentives", "Incentives / commission"], ["otherAdd", "Other additions"]];
const DED_FIELDS = [["cashAdvance", "Cash advance"], ["sss", "SSS"], ["philhealth", "PhilHealth"], ["pagibig", "Pag-IBIG"], ["otherDed", "Other deductions"]];
function payCalc(m, per) {
  const cfg = payCfg(), rate = rateOf(m), rec = S.payroll.find(r => r.id === per.key + "_" + m.id) || {};
  const days = []; let worked = 0, late = 0, lateMin = 0, leave = 0, absent = 0, hol = 0, hours = 0;
  for (let t = new Date(per.start + "T12:00:00+08:00").getTime(); dstr(t) <= per.end; t += 864e5) {
    const d = mDate(t); if (d > mToday()) break;
    const st = attStatus(d, m.id), r = attRec(d, m.id);
    if (st === "present" || st === "late") { worked++; hours += hoursOf(r); if (st === "late") { late++; lateMin += Math.max(0, mMinutes(r.in) - shiftStart(d, m.id)); } }
    if (st === "leave" || st === "sick") leave++;
    if (st === "absent") absent++;
    if (st === "holiday") hol++;
    if (st !== "off" && st !== "notin") days.push({ d, st, r });
  }
  const paidDays = (rec.daysOverride !== undefined && rec.daysOverride !== "" ? Number(rec.daysOverride) : worked + (cfg.paidLeave ? leave : 0) + (cfg.paidHoliday ? hol : 0));
  const basic = paidDays * rate;
  const lateDed = cfg.deductLate ? Math.round(lateMin * rate / 8 / 60 * 100) / 100 : 0;
  const adds = ADD_FIELDS.reduce((a, [k]) => a + (Number(rec[k]) || 0), 0);
  const deds = DED_FIELDS.reduce((a, [k]) => a + (Number(rec[k]) || 0), 0) + lateDed;
  return { m, rec, rate, worked, late, lateMin, leave, absent, hol, hours, paidDays, basic, lateDed, adds, deds, net: basic + adds - deds, days, status: rec.status || "draft" };
}
const PAY_STATUS = { draft: { name: "Draft", cls: "" }, approved: { name: "Approved", cls: "info" }, paid: { name: "Paid", cls: "good" } };

    </div>

    <div class="table-wrap"><table class="otable">

      <tbody>${rows.map(r => `<tr data-act="payslip" data-mid="${r.m.id}">

        <td class="nowrap">${esc(positionOf(r.m) || "–")}</td>
        <td class="r num">${r.rate ? peso(r.rate) : '<span class="chip warn">Set rate</span>'}</td>
        <td class="r num">${r.paidDays}${r.rec.daysOverride !== undefined && r.rec.daysOverride !== "" ? ' <span class="chip" title="Adjusted manually">adj</span>' : ""}</td>
        <td class="r num" style="color:${r.late ? "var(--warn)" : "inherit"}">${r.late ? `${r.late} · ${r.lateMin}m` : "0"}</td>
        <td class="r num">${r.leave}</td>
        <td class="r num" style="color:${r.absent ? "var(--bad)" : "inherit"}">${r.absent}</td>
        <td class="r num nowrap">${peso2(r.basic)}</td>
        <td class="r num nowrap">${r.adds ? "+" + peso2(r.adds) : "–"}</td>
        <td class="r num nowrap">${r.deds ? "−" + peso2(r.deds) : "–"}</td>

      <tfoot><tr><td colspan="7" style="font-weight:800">TOTAL</td><td class="r num" style="font-weight:800">${peso2(sum("basic"))}</td><td class="r num">${peso2(sum("adds"))}</td><td class="r num">${peso2(sum("deds"))}</td><td class="r num" style="font-weight:800">${peso2(sum("net"))}</td><td></td></tr></tfoot>
    </table>${rows.length ? "" : `<div class="empty" style="padding:16px">No active staff. Add them in Admin → Directory.</div>`}</div>

async function savePayCfg() {
  const positions = val("pc-pos").split("\n").map(l => { const m = /^(.+?)\s*[:=\-]\s*₱?\s*([\d,.]+)/.exec(l.trim()); return m ? { name: m[1].trim(), rate: Number(m[2].replace(/,/g, "")) } : null; }).filter(Boolean);
  if (!positions.length) { toast("Add at least one position with a rate, like “Packer: 550”."); return; }
  const data = { positions, deductLate: $("#pc-late").checked, paidLeave: $("#pc-leave").checked, paidHoliday: $("#pc-hol").checked };
  if (S.db) await wdb().doc("config/payroll").set(data); else S.paySettings = data;
  for (const sel of document.querySelectorAll("[data-ppos]")) {
    const m = member(sel.dataset.ppos), rateIn = document.querySelector(`[data-prate="${sel.dataset.ppos}"]`);
    const upd = { payPosition: sel.value, dailyRate: rateIn.value === "" ? 0 : Number(rateIn.value) };
    if (m && (m.payPosition !== upd.payPosition || Number(m.dailyRate || 0) !== upd.dailyRate)) await patch("team", m.id, upd);
  }
  toast("Rates and settings saved."); render();
}

function payslipText(c, per) {
  const L = [`REGAL SPRITZ PAYSLIP`, `${c.m.name}${c.m.idNumber ? " (ID " + c.m.idNumber + ")" : ""}`, `${positionOf(c.m)} · Pay period ${per.label}`, ``,
    `Days worked: ${c.paidDays} × ${peso2(c.rate)} = ${peso2(c.basic)}`, `Late: ${c.late} day(s), ${c.lateMin} min · Leave: ${c.leave} · Absent: ${c.absent}`];
  const adds = ADD_FIELDS.filter(([k]) => Number(c.rec[k])); const deds = DED_FIELDS.filter(([k]) => Number(c.rec[k]));
  if (adds.length) { L.push("", "ADDITIONS"); adds.forEach(([k, n]) => L.push(`${n}: ${peso2(c.rec[k])}`)); }
  if (deds.length || c.lateDed) { L.push("", "DEDUCTIONS"); if (c.lateDed) L.push(`Late (${c.lateMin} min): ${peso2(c.lateDed)}`); deds.forEach(([k, n]) => L.push(`${n}: ${peso2(c.rec[k])}`)); }
  L.push("", `NET PAY: ${peso2(c.net)}`);
  if (c.rec.notes) L.push("", "Notes: " + c.rec.notes);
  return L.join("\n");
}

  <h2>Earnings</h2><table><tr><td>Basic pay (${c.paidDays} day${c.paidDays === 1 ? "" : "s"} × ${peso2(c.rate)})</td><td class="r">${peso2(c.basic)}</td></tr>${rowsA}</table>

  <p class="muted" style="margin-top:40px">Received by: ____________________ &nbsp; Date: __________</p></body></html>`;
}

function openPayslip(mid) {

/* ---------- Listings: drag the corner of a cell (like Excel / Google Sheets) to copy its value down or up ---------- */
let fillH = null, fillDrag = null, fillEndAt = 0;
window.addEventListener("click", e => { if (Date.now() - fillEndAt < 400) { e.stopPropagation(); e.preventDefault(); } }, true);
function fillShow(el) {
  if (!el || !el.closest(".ltable") || S.readOnly || el.dataset.lset === "barcode") return;
  if (!fillH) { fillH = document.createElement("span"); fillH.className = "fillh"; fillH.title = "Drag to copy this value to other rows"; fillH.addEventListener("pointerdown", fillStart); }
  const td = el.closest("td"); if (!td) return; td.classList.add("fill-host"); td.appendChild(fillH); fillH.dataset.f = el.dataset.lset; fillH.dataset.id = el.dataset.id;
}

function fillStart(ev) {

}

}

  if (tr && tr !== fillDrag.to) { fillDrag.to = tr; fillPaint(); }

}
async function fillEnd() {
  const d = fillDrag; fillDrag = null; document.body.classList.remove("filling");

  fillEndAt = Date.now();

  if (!ids.length) return;

  let n = 0;
  for (const id of ids) { const el = document.querySelector(`.ltable [data-lset="${d.f}"][data-id="${id}"]`); if (!el) continue; el.value = v; if (await listSet(el, true)) n++; }
  const lab = { eta: "ETA", status: "Status", size: "Size", ptype: "Type", kind: "On hand / Pre-order", price: "SRP", compareAt: "Compare at", cost: "Cost", stock: "In stock", category: "Collection" }[d.f] || d.f;
  toast(n ? `${lab} copied to ${n} more listing${n === 1 ? "" : "s"}.` : "Those listings already had that value."); if (!S.db) render();
}
document.addEventListener("focusin", e => { if (e.target.dataset && e.target.dataset.lset) fillShow(e.target); });
document.addEventListener("pointerover", e => { if (fillDrag || !e.target.closest) return; const el = e.target.closest("td") && e.target.closest("td").querySelector("[data-lset]"); if (el && e.pointerType === "mouse") fillShow(el); });

      if (!conn) throw { code: "tool_error", message: "Shopify sent back an unexpected answer." };
      for (const n of conn.nodes || (conn.edges || []).map(e => e.node)) {
        const o = shopToOrder(n);
        if (!OPEN_FUL.has(o.shopFul) || n.cancelledAt) continue;
        seen.add(orderDocId(o)); changed += await shopApply(o, true);
      }
      const pi = conn.pageInfo || {}; after = pi.hasNextPage ? pi.endCursor : null;
    } while (after && ++pages < 40);
    // orders still open here but no longer open in Shopify → fetch their real status
    const stale = S.orders.filter(o => o.ref && /^\d+$/.test(o.ref) && OPEN_FUL.has(o.fulfillment) && !seen.has(o.id) && o.id.startsWith("sh-"));
    for (let i = 0; i < stale.length; i += 50) {
      const p = await shopCall(SHOP_NODES_Q, { ids: stale.slice(i, i + 50).map(o => "gid://shopify/Order/" + o.ref) }, 50);
      for (const n of (dig(p, "nodes") || []).filter(Boolean)) if (n.id) changed += await shopApply(shopToOrder(n), false);
    }
    S.shop = { state: "ok", at: Date.now(), msg: "", n: seen.size };
    if (manual) toast(changed ? `Shopify synced · ${changed} order${changed === 1 ? "" : "s"} added or updated.` : "Shopify synced · everything is up to date.");
  } catch (e) {
    const code = e && e.code;
    const msg = code === "needs_reauth" ? "Shopify needs you to sign in again: claude.ai → Settings → Connectors → Shopify → Reconnect."
      : code === "server_not_connected" ? "Connect Shopify for live orders: claude.ai → Settings → Connectors → add Shopify."
      : code === "not_in_manifest" ? "Shopify isn't allowed for this page. Open the artifact's Permissions menu and allow Shopify."
      : code === "blocked_by_policy" || code === "approval_required" ? "Your organization blocks Shopify for this page."
      : code === "selection_required" ? "Pick which Shopify connection to use in the prompt claude.ai showed."
      : (e && e.message) ? "Shopify sync failed: " + e.message : "Shopify sync failed. It will try again in 30 minutes, or press Sync now.";
    S.shop = { ...S.shop, state: ["needs_reauth", "server_not_connected", "not_in_manifest", "blocked_by_policy", "approval_required"].includes(code) ? "blocked" : "error", msg };
    if (manual) toast(msg);
  } finally { shopBusy = false; paintShop(); }
}
// The Shopify plan is cancelled (Oct 2026): hide every Shopify control until it's reopened.
const SHOPIFY_ON = false;
function shopChip() {
  if (!SHOPIFY_ON) return "";
  if (!canSee("SALES") && !canSee("PACKING")) return "";
  const st = S.shop;
  if (st.state === "off") return S.mcp === null ? `<span class="shop-chip off" title="Live Shopify sync works when the app is open in claude.ai">Shopify sync off in this view</span>` : "";
  const label = st.state === "syncing" ? "Syncing Shopify…" : st.state === "ok" ? `Shopify live · ${st.n} open · ${new Date(st.at).toLocaleTimeString("en-PH", { hour: "numeric", minute: "2-digit", timeZone: "Asia/Manila" })}` : st.state === "blocked" ? "Shopify not connected" : "Shopify sync paused";
  return `<button type="button" class="shop-chip ${st.state}" data-act="shop-sync" title="${esc(st.msg || "Syncs unfulfilled Shopify orders every minute. Click to sync now.")}"><i></i>${esc(label)}</button>${st.msg && st.state !== "ok" ? `<span class="shop-msg">${esc(st.msg)}</span>` : ""}`;
}
function paintShop() { document.querySelectorAll(".shop-slot").forEach(el => { el.innerHTML = shopChip(); }); }
async function reconcileStages() {
  if (S.readOnly || S.viewAs) return;
  const t0 = Date.now();
  while (S.db && !S.loaded.orders) { if (Date.now() - t0 > 20000) return; await new Promise(r => setTimeout(r, 300)); }
  // One-time clean-up: old stage tags become the Fulfillment Status and are removed from Tags.
  const fix = [...S.orders, ...S.archived].filter(o => (o.tags || []).some(t => STAGE_TAGS.has(normTag(t))));
  const upd = o => { const st = tagStage(o.tags), u = { tags: stripStage(o.tags) }; if (!o.archived && st && OPEN_FUL.has(o.fulfillment)) u.fulfillment = st; if (o.archived && st && o.archivedPrev && OPEN_FUL.has(o.archivedPrev.fulfillment)) u.archivedPrev = { ...o.archivedPrev, fulfillment: st }; return u; };
  for (let i = 0; i < fix.length; i += 8) await Promise.all(fix.slice(i, i + 8).map(o => patch("orders", o.id, upd(o)).catch(() => {})));
}
/* One-time Shopify history check (the plan is cancelled, Oct 2026): when an owner or admin opens the app,
   every Shopify order that isn't in Orders yet is brought in once. Existing orders and stock are never changed.
   The result is kept in config/shopBackfill. */
const SHOP_HIST_IDS_Q = `query RSHistIds($after: String) { orders(first: 250, after: $after, sortKey: CREATED_AT) { pageInfo { hasNextPage endCursor } nodes { id name } } }`;
const SHOP_HIST_FILL_Q = `query RSHistFill($ids: [ID!]!) { nodes(ids: $ids) { ... on Order { ${SHOP_FIELDS} } } }`;
/* Our own copy of every listing photo (owner request): photos on WebCake/Shopify servers are copied into RS OS storage
   (Supabase bucket listing-photos) and the listing switches to the copy; the website then gets the new links on the next push.
   Runs quietly in the background for an owner/admin, a few photos at a time, and picks up where it left off. */
const OWN_PHOTO = /\/storage\/v1\/object\/public\/listing-photos\//;
let photoCopyBusy = false;
async function photoCopyRun() {
  if (photoCopyBusy || !S.photos || !S.db || S.readOnly || S.viewAs || !canAll() || !S.loaded.products) return;
  const todo = S.products.filter(p => galListingImgs(p).some(u => !OWN_PHOTO.test(u) && !(p.photoGone || []).includes(u)));
  if (!todo.length) return;
  photoCopyBusy = true; let done = 0, n = 0, failed = 0, lastError = "";
  const report = extra => wdb().collection("config").doc("photoCopy").set({ at: Date.now(), by: actor(), listingsLeft: todo.length - done, copied: n, failed, lastError, ...(extra || {}) }).catch(() => {});
  await report({ startedAt: Date.now() });
  try {
    for (const p0 of todo) {
      const p = S.products.find(x => x.id === p0.id); if (!p) continue;
      const list = galListingImgs(p), out = [], gone = [...(p.photoGone || [])]; let changed = false;
      for (const u of list) {
        if (OWN_PHOTO.test(u) || gone.includes(u)) { out.push(u); continue; }
        const r = await S.photos.save(String(u).startsWith("data:") ? { data: u } : { url: u }).catch(() => null);
        if (r && r.ok && r.url) { out.push(r.url); changed = true; n++; }
        else { out.push(u); failed++; lastError = String((r && r.error) || "no answer from /api/photo").slice(0, 200); if (r && r.gone) { gone.push(u); changed = true; }
          if (failed === 1 && !n) toast("Photo copy problem: " + lastError); }
      }
      if (changed) { const cur = S.products.find(x => x.id === p.id); if (!cur) continue;
        await patch("products", p.id, { photo: out[0] || "", imgs: out.filter(u => !String(u).startsWith("data:")), photoGone: gone, photoSrc: (cur.photoSrc && cur.photoSrc.length ? cur.photoSrc : list.filter(u => !String(u).startsWith("data:"))), webSync: "pending" }); }
      done++;
      if (done % 10 === 0) { toast(`Saving our own copy of listing photos: ${done} of ${todo.length} listings…`); report(); }
      if (failed >= 20 && !n) { report({ stoppedAt: Date.now() }); return; } // nothing works yet: stop and keep the error for us to see
    }
    await report({ doneAt: Date.now() });
    if (n) toast(`${n.toLocaleString("en-PH")} listing photos now saved in RS OS. The website gets the new links automatically.`);
  } finally { photoCopyBusy = false; }
}
async function shopHistoryBackfill(c) {
  if (!S.db || S.readOnly || S.viewAs || !canAll()) return;
  const cfg = S.db.doc("config/shopBackfill");
  let st = {}; try { const s = await cfg.get(); st = s.exists ? s.data() : {}; } catch (e) { return; }
  if (st.doneAt || (st.startedAt && Date.now() - st.startedAt < 20 * 60000)) return;
  const mcp = c?.use ? await c.use("mcp").catch(() => null) : null; if (!mcp) return;
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const t0 = Date.now();
  while (!S.loaded.orders || !S.loaded.products) { if (Date.now() - t0 > 60000) return; await wait(500); }
  try { await cfg.set({ ...st, startedAt: Date.now(), by: actor() }); } catch (e) { return; }
  const call = async (q, v, first) => { for (let i = 0; ; i++) { try { return await shopCall(q, v, first, mcp); } catch (e) { if (i >= 4) throw e; await wait(2000 * 2 ** i); } } };
  const stay = (msg, ms) => { toast(msg); clearTimeout(toastT); toastT = setTimeout(() => $("#toast").hidden = true, ms); };
  try {
    const all = []; let after = null;
    do {
      const conn = dig(await call(SHOP_HIST_IDS_Q, after ? { after } : {}, 250), "orders"); if (!conn) throw new Error("Shopify sent back an unexpected answer.");
      all.push(...(conn.nodes || []));
      after = conn.pageInfo && conn.pageInfo.hasNextPage ? conn.pageInfo.endCursor : null;
    } while (after);
    const docId = n => orderDocId({ num: String(n.name || "").replace(/^#/, "") });
    const missing = all.filter(n => !findOrder(docId(n)));
    let added = 0;
    for (let i = 0; i < missing.length; i += 20) {
      const nodes = (dig(await call(SHOP_HIST_FILL_Q, { ids: missing.slice(i, i + 20).map(n => n.id) }, 20), "nodes") || []).filter(n => n && n.id);
      const rows = nodes.map(shopToOrder).filter(o => o.num && !findOrder(orderDocId(o))).map(o => ({ path: "orders/" + orderDocId(o), data: { ...o, source: "shopify-backfill-2026-10-06", log: [{ at: Date.now(), by: "Shopify", msg: "brought in from Shopify order history" }] } }));
      if (typeof S.db._bulkSet === "function") await S.db._bulkSet(rows); else for (const r of rows) await save("orders", r.path.slice(7), r.data);
      added += rows.length;
      stay(`Bringing in past Shopify orders: ${Math.min(i + 20, missing.length).toLocaleString("en-PH")} of ${missing.length.toLocaleString("en-PH")}. Keep this page open.`, 60000);
    }
    await cfg.set({ doneAt: Date.now(), by: actor(), shopifyTotal: all.length, alreadyIn: all.length - missing.length, added, missing: missing.slice(0, 3000).map(n => n.name) });
    stay(`Shopify check done: ${all.length.toLocaleString("en-PH")} Shopify orders. ${added ? `${added.toLocaleString("en-PH")} were missing and are now in Orders.` : "All of them were already in Orders."}`, 20000);
  } catch (e) {
    try { await cfg.set({ ...st, startedAt: 0, lastError: String((e && e.message) || e).slice(0, 300), lastErrorAt: Date.now() }); } catch (e2) {}
  }
}
// One-time copy of Shopify's "Cost per item" into listings (matched by the listing's website handle, which came from Shopify).
// Runs once in the owner's app; fills only listings with no cost yet, so costs typed in RS OS are kept.
const SHOP_COST_Q = `query RSCost($first: Int!, $after: String) { productVariants(first: $first, after: $after) { pageInfo { hasNextPage endCursor } nodes { product { handle } inventoryItem { unitCost { amount } } } } }`;
async function costImportOnce(c) {
  if (!S.realOwner || S.readOnly || !S.db || S.viewAs) return;
  const t0 = Date.now();
  while (!S.loaded.products || !S.loaded.webmeta) { if (Date.now() - t0 > 60000) return; await new Promise(r => setTimeout(r, 1000)); }
  if (S.webmeta.some(d => d.id === "_costimp")) return;
  const mcp = S.mcp || (c?.use ? await c.use("mcp").catch(() => null) : null); if (!mcp) return;
  try {
    const cost = new Map(); let after = null, pages = 0;
    do {
      const res = await shopCall(SHOP_COST_Q, after ? { first: 50, after } : { first: 50 }, 50, mcp);
      const conn = dig(res, "productVariants"); if (!conn) throw new Error("Shopify sent back an unexpected answer.");
      for (const n of conn.nodes || []) { const h = n.product && n.product.handle, v = Number(n.inventoryItem && n.inventoryItem.unitCost && n.inventoryItem.unitCost.amount) || 0; if (h && v > 0) cost.set(h, Math.max(cost.get(h) || 0, v)); }
      const pi = conn.pageInfo || {}; after = pi.hasNextPage ? pi.endCursor : null;
    } while (after && ++pages < 200);
    let n = 0;
    for (const p of S.products) {
      if (Number(p.cost) > 0 || !p.webId) continue;
      const w = p.webId, h = [w, w.replace(/^preorder-/, ""), "preorder-" + w].find(x => cost.has(x)); if (!h) continue;
      UNDO.at = 0; // a background import, not a Ctrl+Z step
      await patch("products", p.id, { cost: cost.get(h), costFrom: "Shopify", log: logAdd(p, [`cost set to ${peso(cost.get(h))} from Shopify`]) }); n++;
    }
    await save("webmeta", "_costimp", { at: Date.now(), count: n, handles: cost.size });
    if (n) toast(`Imported Shopify cost for ${n} listing${n === 1 ? "" : "s"}.`);
  } catch (e) { console.warn("cost import", e); }
}
async function startShopSync(c) {
  costImportOnce(c);
  reconcileStages();
  shopHistoryBackfill(c);
  if (c?.use) Promise.resolve().then(() => c.use("photos")).then(ph => { if (!ph || !ph.save) return; S.photos = ph; const go = () => { if (S.loaded.products) photoCopyRun(); else setTimeout(go, 2000); }; setTimeout(go, 8000); setInterval(photoCopyRun, 30 * 60e3); }).catch(() => {});
  if (!SHOPIFY_ON) return;
  S.mcp = c?.use ? await c.use("mcp").catch(() => null) : null;
  if (!S.mcp) { paintShop(); return; }
  S.shop.state = "syncing"; paintShop();
  const t0 = Date.now();
  while (S.db && (!S.loaded.orders || !S.loaded.products)) { if (Date.now() - t0 > 20000) break; await new Promise(r => setTimeout(r, 300)); }
  await shopSync(false);
  shopTimer = setInterval(() => { if (S.shop.state !== "blocked") shopSync(false); }, SHOP_EVERY);
  document.addEventListener("visibilitychange", () => { if (!document.hidden && S.shop.state !== "blocked" && Date.now() - S.shop.at > SHOP_EVERY) shopSync(false); });
}

/* ---------- boot ---------- */
try { S.courier = localStorage.getItem("rs-courier") || ""; S.wbShip = localStorage.getItem("rs-wbship") !== "0"; } catch (e) {}
S.att.date = mToday(); S.att.month = S.att.date.slice(0, 7);

    db.doc("config/payroll").onSnapshot(s => { S.paySettings = s.exists ? s.data() : {}; keep(); }, () => {});
    db.doc("config/attendance").onSnapshot(s => { S.attSettings = s.exists ? s.data() : {}; keep(); }, () => {});

    for (const col of ["colprefs", "products", "orders", "expenses", "customers", "tasks", "team", "attendance", "investments", "payroll", "scents", "logins", "fixedexp", "dues", "checks", "payrecords", "bir", "birtax", "reviews", "eom", "eomvotes", "accessreq", "invoices", "gallery", "webmeta"]) {
      db.collection(col).onSnapshot(snap => {
