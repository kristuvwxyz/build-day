/* ---------- attendance ---------- */
const TZ = "Asia/Manila";
const mDate = t => new Date(t).toLocaleDateString("en-CA", { timeZone: TZ });
const mToday = () => mDate(Date.now());
const mMinutes = t => { const p = new Date(t).toLocaleTimeString("en-GB", { timeZone: TZ, hour: "2-digit", minute: "2-digit", hour12: false }).split(":"); return Number(p[0]) % 24 * 60 + Number(p[1]); };
const mTime = t => t ? new Date(t).toLocaleTimeString("en-PH", { timeZone: TZ, hour: "numeric", minute: "2-digit" }).replace(/\s?(AM|PM)/i, (m, x) => " " + x.toLowerCase()) : "";
const hhmm = t => t ? new Date(t).toLocaleTimeString("en-GB", { timeZone: TZ, hour: "2-digit", minute: "2-digit", hour12: false }) : "";
const fromHHMM = (date, v) => v ? new Date(`${date}T${v}:00+08:00`).getTime() : 0;
const toMin = v => { const [h, m] = (v || "09:00").split(":").map(Number); return h * 60 + (m || 0); };
const ATT_STATUS = [
  { id: "present", name: "Present", cls: "good", short: "P" },
  { id: "late", name: "Late", cls: "warn", short: "L" },
  { id: "leave", name: "On leave", cls: "info", short: "VL" },
  { id: "sick", name: "Sick leave", cls: "info", short: "SL" },
  { id: "off", name: "Day off", cls: "", short: "OFF" },
  { id: "holiday", name: "Holiday", cls: "", short: "H" },
  { id: "absent", name: "Absent", cls: "bad", short: "A" },
  { id: "notin", name: "Not in yet", cls: "", short: "" },
];
const astat = id => ATT_STATUS.find(s => s.id === id) || ATT_STATUS[7];
const attCfg = () => ({ start: "09:00", end: "18:00", grace: 15, workdays: [1, 2, 3, 4, 5, 6], ...(S.attSettings || {}) });
const attId = (date, mid) => date + "_" + mid;
const attRec = (date, mid) => S.attendance.find(a => a.id === attId(date, mid));
const isWorkday = d => attCfg().workdays.includes(new Date(d + "T12:00:00+08:00").getDay());
function attStatus(date, mid) {
  const r = attRec(date, mid);
  if (r && r.status && r.status !== "present") return r.status;
  if (r && r.in) return mMinutes(r.in) > toMin(attCfg().start) + (Number(attCfg().grace) || 0) ? "late" : "present";
  if (!isWorkday(date)) return "off";
  if (date < mToday()) return "absent";
  return "notin";
}
const hoursOf = r => r && r.in ? ((r.out || (mDate(r.in) === mToday() ? Date.now() : r.in)) - r.in) / 36e5 : 0;
const fmtHours = h => h > 0 ? `${Math.floor(h)}h ${String(Math.round((h % 1) * 60)).padStart(2, "0")}m` : "–";

async function clock(mid, dir) {
  const date = mToday(), id = attId(date, mid), r = attRec(date, mid), now = Date.now();
  const by = (member(myMemberId()) || {}).name || (S.me && S.me.name) || "";
  if (dir === "in") {
    if (r && r.in) { toast(`${memberName(mid)} already timed in at ${mTime(r.in)}.`); return; }
    await save("attendance", id, { ...(r ? clean(r) : {}), date, memberId: mid, in: now, out: 0, status: "present", recordedByName: by, updatedAt: now });
    toast(`${memberName(mid)} timed in at ${mTime(now)}.`);
  } else {
    if (!r || !r.in) { toast("Time in first."); return; }
    await patch("attendance", id, { out: now, updatedAt: now });
    toast(`${memberName(mid)} timed out at ${mTime(now)} · ${fmtHours((now - r.in) / 36e5)}.`);
  }
}
function clockButtons(mid, date) {
  if (S.readOnly || date !== mToday()) return "";
  const r = attRec(date, mid);
  if (r && r.status && !["present"].includes(r.status)) return "";
  if (!r || !r.in) return `<button class="btn sm primary" type="button" data-clock="in" data-mid="${mid}">Time in</button>`;
  if (!r.out) return `<button class="btn sm" type="button" data-clock="out" data-mid="${mid}">Time out</button>`;
  return "";
}
function myClockCard() {
  const mid = myMemberId(); if (!mid || !member(mid)) return "";
  const r = attRec(mToday(), mid), st = attStatus(mToday(), mid);
  return `<section class="panel clock-card"><div class="head"><h2>My attendance today</h2><span class="chip ${astat(st).cls}">${astat(st).name}</span></div>
    <div class="clock-row"><div><div class="clock-big num" data-live-clock>${mTime(Date.now())}</div><div style="font-size:12px;color:var(--muted)">Manila time · shift ${esc(attCfg().start)}–${esc(attCfg().end)}</div></div>
    <div style="font-size:13px">${r && r.in ? `In <b>${mTime(r.in)}</b>${r.out ? ` · Out <b>${mTime(r.out)}</b>` : ""} · ${fmtHours(hoursOf(r))}` : "Not timed in yet"}</div>
    <div class="actions">${clockButtons(mid, mToday())}</div></div></section>`;
}
setInterval(() => document.querySelectorAll("[data-live-clock]").forEach(e => e.textContent = mTime(Date.now())), 20000);

function attSummary(date) {
  const ms = S.team, n = ms.length, c = id => ms.filter(m => attStatus(date, m.id) === id).length;
  const leave = c("leave") + c("sick");
  const parts = [["present", "Present", c("present")], ["late", "Late", c("late")], ["leave", "On leave", leave], ["absent", "Absent", c("absent")], ["notin", "Not in yet", c("notin")], ["off", "Day off / holiday", c("off") + c("holiday")]].filter(p => p[2] || ["present", "late", "absent"].includes(p[0]));
  return `<div class="tsum"><div class="tsum-line">${parts.map(([id, nm, v]) => `<span class="tsum-part a-${id}"><b class="num">${v}/${n}</b> ${nm}</span>`).join('<span class="tsum-sep">|</span>')}</div>
    <div class="tsum-bar" aria-hidden="true">${n ? parts.map(([id, , v]) => `<i class="a-${id}" style="width:${v / n * 100}%"></i>`).join("") : ""}</div>
    <div class="tsum-label">${longDate(date)}${isWorkday(date) ? "" : " · not a work day"}</div></div>`;
}

  const team = S.team.filter(m => !A.dept || m.department === A.dept).sort((a, b) => (a.name || "").localeCompare(b.name || ""));
  let body;

      <tbody>${team.map(m => { const r = attRec(A.date, m.id), st = astat(attStatus(A.date, m.id)); return `<tr data-att="${m.id}">
        <td style="font-weight:600">${esc(m.name)}${m.id === myMemberId() ? ' <span class="chip">You</span>' : ""}</td>

  } else {

    const rows = team.map(m => {
      const cells = days.map(d => d > mToday() ? null : attStatus(d, m.id));
      const cnt = id => cells.filter(c => c === id).length;
      const hrs = days.reduce((a, d) => a + hoursOf(attRec(d, m.id)), 0);
      return { m, cells, p: cnt("present") + cnt("late"), late: cnt("late"), abs: cnt("absent"), lv: cnt("leave") + cnt("sick"), hrs };
    });
    body = `<div class="toolbar">${seg}${deptSel}<span style="flex:1"></span>
      <div class="pager"><button class="btn sm" type="button" data-amonth="-1" aria-label="Previous month">‹</button><strong style="min-width:140px;text-align:center">${monthLabel(A.month)}</strong><button class="btn sm" type="button" data-amonth="1" aria-label="Next month">›</button></div></div>
    <div class="table-wrap"><table class="att-sheet">
      <thead><tr><th class="sticky">Team member</th>${days.map(d => `<th class="${isWorkday(d) ? "" : "wk"}${d === mToday() ? " now" : ""}" title="${longDate(d)}">${Number(d.slice(8))}<br><small>${"SMTWTFS"[new Date(d + "T12:00:00+08:00").getDay()]}</small></th>`).join("")}<th class="r">Present</th><th class="r">Late</th><th class="r">Absent</th><th class="r">Leave</th><th class="r">Hours</th></tr></thead>
      <tbody>${rows.map(r => `<tr><td class="sticky" style="font-weight:600">${esc(r.m.name)}</td>${r.cells.map((c, i) => `<td class="ac ${c ? "a-" + c : ""}" data-aday-pick="${days[i]}" title="${esc(r.m.name)} · ${fmtDate(days[i])}${c ? " · " + astat(c).name : ""}">${c && c !== "notin" ? astat(c).short : ""}</td>`).join("")}
        <td class="r num">${r.p}</td><td class="r num" style="color:${r.late ? "var(--warn)" : "inherit"}">${r.late}</td><td class="r num" style="color:${r.abs ? "var(--bad)" : "inherit"}">${r.abs}</td><td class="r num">${r.lv}</td><td class="r num nowrap">${fmtHours(r.hrs)}</td></tr>`).join("")}</tbody>
    </table></div>
    <div class="legend">${ATT_STATUS.filter(s => s.short).map(s => `<span><span class="ac a-${s.id}" style="display:inline-block;min-width:28px;text-align:center;border-radius:4px">${s.short}</span> ${s.name}</span>`).join("")}</div>`;
  }
  const c = attCfg();
  const settings = S.canEdit ? `<details class="panel"><summary style="font-weight:700;cursor:pointer">Attendance settings</summary>
    <form id="att-cfg" style="display:flex;flex-direction:column;gap:12px;margin-top:12px">
      <div class="row"><div class="field"><label for="ac-start">Shift starts</label><input id="ac-start" type="time" value="${esc(c.start)}"></div><div class="field"><label for="ac-end">Shift ends</label><input id="ac-end" type="time" value="${esc(c.end)}"></div></div>
      <div class="field"><label for="ac-grace">Grace period before "Late" (minutes)</label><input id="ac-grace" type="number" min="0" step="1" value="${Number(c.grace) || 0}"></div>
      <fieldset class="field" style="border:0;padding:0;margin:0"><legend style="font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px">Work days</legend><div style="display:flex;gap:10px;flex-wrap:wrap">${["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].map((d, i) => `<label style="display:flex;gap:4px;align-items:center;font-size:13px"><input type="checkbox" name="ac-wd" value="${i}" ${c.workdays.includes(i) ? "checked" : ""}> ${d}</label>`).join("")}</div></fieldset>
      <div><button class="btn primary" type="submit">Save settings</button></div>
    </form></details>` : "";
  return body + settings;
}

function openAttForm(mid) {
  const date = S.att.date, r = attRec(date, mid) || {}, cur = r.status && r.status !== "present" ? r.status : (r.in ? "present" : "");
  openSheet(`
    <h3>${esc(memberName(mid))}</h3>
    <div style="color:var(--muted);font-size:13px">${longDate(date)} · times in Manila time</div>
    <div class="field"><label for="at-status">Status</label><select id="at-status">
      <option value="present" ${cur === "present" ? "selected" : ""}>Worked (Present / Late is automatic)</option>
      ${ATT_STATUS.filter(s => ["leave", "sick", "off", "holiday", "absent"].includes(s.id)).map(s => `<option value="${s.id}" ${cur === s.id ? "selected" : ""}>${s.name}</option>`).join("")}
      ${cur ? "" : `<option value="" selected>No record</option>`}
    </select></div>
    <div class="row">
      <div class="field"><label for="at-in">Time in</label><input id="at-in" type="time" value="${hhmm(r.in)}"></div>
      <div class="field"><label for="at-out">Time out</label><input id="at-out" type="time" value="${hhmm(r.out)}"></div>
    </div>
    <div class="field"><label for="at-note">Note</label><input id="at-note" value="${esc(r.note || "")}" placeholder="e.g. Half day, approved by CEO"></div>
    ${r.recordedByName ? `<div style="font-size:12px;color:var(--muted)">Last recorded by ${esc(r.recordedByName)}${r.updatedAt ? " · " + relTime(r.updatedAt) : ""}</div>` : ""}
    <div id="sheet-err" class="confirm" hidden></div>
    ${r.id ? `<div id="del-slot"><button class="btn danger sm" type="button" data-act="ask-del-att" data-id="${r.id}">Clear this record</button></div>` : ""}
    <div class="sheet-foot"><button class="btn" type="button" data-act="close">Cancel</button><button class="btn primary" type="submit">Save</button></div>`,
  async () => {
    const status = val("at-status"), tin = fromHHMM(date, val("at-in")), tout = fromHHMM(date, val("at-out"));
    if (!status) { closeSheet(); return; }
    if (status === "present" && !tin) return sheetError("Enter a time in, or choose a leave status.");
    if (tin && tout && tout < tin) return sheetError("Time out is earlier than time in.");
    const by = (member(myMemberId()) || {}).name || (S.me && S.me.name) || "";
    await save("attendance", attId(date, mid), { date, memberId: mid, status, in: status === "present" ? tin : 0, out: status === "present" ? tout : 0, note: val("at-note"), recordedByName: by, updatedAt: Date.now() });
    closeSheet(); toast("Attendance saved.");
  });
}

/* ---------- export ---------- */
function csv(rows) { return rows.map(r => r.map(c => { const s = String(c ?? ""); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(",")).join("\n"); }
async function exportCol(col) {
  let rows;
  if (col === "orders") rows = [["Order", "Date", "Channel", "Platform ref", "Customer", "Phone", "Items", "Item count", "Total", "Payment status", "Fulfillment status", "Tags", "Fees", "Shipping paid", "Product cost", "Profit", "Note"], ...filteredOrders().map(o => ["#" + o.num, new Date(o.createdAt).toLocaleString("en-PH"), plat(o.platform), o.ref, o.customer, o.phone, (o.items || []).map(i => `${i.qty}x ${i.name}`).join("; "), itemCount(o), total(o), pay(o.payment).name, ful(o.fulfillment).name, (o.tags || []).join(", "), o.fees, o.shipping, cogs(o), profit(o), o.note])];
  if (col === "attendance") {
    const [y, mo] = S.att.month.split("-").map(Number), dim = new Date(y, mo, 0).getDate();
    rows = [["Date", "Team member", "Department", "Status", "Time in", "Time out", "Hours", "Note"]];
    for (let i = 1; i <= dim; i++) { const d = `${S.att.month}-${String(i).padStart(2, "0")}`; if (d > mToday()) break; for (const m of S.team) { const r = attRec(d, m.id); rows.push([d, m.name, (dept(m.department) || {}).name || "", astat(attStatus(d, m.id)).name, mTime(r && r.in), mTime(r && r.out), Math.round(hoursOf(r) * 100) / 100, r && r.note || ""]); } }
  }
  if (col === "products") rows = [["Name", "SKU", "Category", "Price", "Cost", "Stock", "Reorder at", "Batch", "Best before"], ...S.products.map(p => [p.name, p.sku, p.category, p.price, p.cost, p.stock, p.reorder, p.batch, p.expiry])];
  if (col === "expenses") rows = [["Date", "Category", "Note", "Amount"], ...S.expenses.map(e => [e.date, e.category, e.note, e.amount])];
  if (col === "customers") rows = [["Name", "Email", "Phone", "Address", "Channels", "Orders", "Amount spent", "Last order", "Tags", "Note"], ...customerList().map(c => [c.name, c.email, c.phone, c.address, [...c.platforms].join("; "), c.orders, c.spent, c.last ? new Date(c.last).toLocaleDateString("en-CA") : "", (c.tags || []).join(", "), c.note])];
  try { await S.dl.save({ data: csv(rows), filename: col === "attendance" ? `regal-spritz-attendance-${S.att.month}.csv` : `regal-spritz-${col}-${today()}.csv` }); toast("Export ready."); }
  catch (e) { if (e && e.code !== "declined") toast("Couldn't export. Try again in a moment."); }
}

/* ---------- events ---------- */
let toastT;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 3200); }
function guard(fn) { return async (...a) => { try { await fn(...a); } catch (e) { writeErr(e); } }; }

document.addEventListener("click", guard(async ev => {
  const nav = ev.target.closest("[data-nav]");
  if (nav) { if ($("#scrim").hidden === false) closeSheet(); S.view = nav.dataset.nav; S.sel.clear(); saveNav(); render(); window.scrollTo(0, 0); return; }
  const dp = ev.target.closest("[data-dept]");
  if (dp) { S.view = "dept"; if (S.dept !== dp.dataset.dept) { S.dept = dp.dataset.dept; S.tab = dept(S.dept).tabs[0]; } S.sel.clear(); saveNav(); render(); window.scrollTo(0, 0); return; }
  const tb = ev.target.closest("[data-tab]");
  if (tb) { S.tab = tb.dataset.tab; S.sel.clear(); saveNav(); render(); return; }
  const sl = ev.target.closest("[data-slide]");
  if (sl) { S.slide = Number(sl.dataset.slide); applySlide(); return; }
  const ss = ev.target.closest("[data-slidestep]");
  if (ss) { S.slide = (S.slide + Number(ss.dataset.slidestep) + 4) % 4; applySlide(); return; }
  const tsc = ev.target.closest("[data-tscope]");
  if (tsc) { S.t.scope = tsc.dataset.tscope; render(); return; }
  const tmo = ev.target.closest("[data-tmode]");
  if (tmo) { S.t.mode = tmo.dataset.tmode; render(); return; }
  const tmn = ev.target.closest("[data-tmonth]");
  if (tmn) { const k = Number(tmn.dataset.tmonth); if (!k) { S.t.month = today().slice(0, 7); S.t.day = today(); } else { const [y, m] = S.t.month.split("-").map(Number); const d = new Date(y, m - 1 + k, 1); S.t.month = dstr(d.getTime()).slice(0, 7); S.t.day = S.t.month === today().slice(0, 7) ? today() : S.t.month + "-01"; } render(); return; }
  const wp = ev.target.closest("[data-wperson]");
  if (wp) { if (S.view === "dept") { S.view = "tasks"; saveNav(); } S.t.scope = "person"; S.t.person = wp.dataset.wperson; render(); return; }
  const wd = ev.target.closest("[data-wdept]");
  if (wd) { if (S.view === "dept") { S.view = "tasks"; saveNav(); } S.t.scope = "dept"; S.t.dept = wd.dataset.wdept; render(); return; }

  if (nt) return openTaskForm(null, nt.dataset.date, S.view === "dept" ? S.dept : null);
  const dy = ev.target.closest("[data-day]");
  if (dy) { S.t.day = dy.dataset.day; render(); return; }
  const fu = ev.target.closest("[data-ful]");
  if (fu) { const o = S.orders.find(x => x.id === fu.dataset.ful); if (o) { await updateOrder(o, { fulfillment: fu.dataset.to }); toast(`#${o.num} ${ful(fu.dataset.to).name.toLowerCase()}.`); } return; }
  const th = ev.target.closest("[data-theme-set]");
  if (th) return setTheme(th.dataset.themeSet);
  const ck = ev.target.closest("[data-clock]");
  if (ck) return clock(ck.dataset.mid, ck.dataset.clock);
  const am = ev.target.closest("[data-amode]");
  if (am) { S.att.mode = am.dataset.amode; if (S.att.mode === "month") S.att.month = S.att.date.slice(0, 7); render(); return; }
  const ad = ev.target.closest("[data-aday]");
  if (ad) { const k = Number(ad.dataset.aday); S.att.date = k ? dstr(new Date(S.att.date + "T12:00:00").getTime() + k * 864e5) : mToday(); render(); return; }
  const amo = ev.target.closest("[data-amonth]");
  if (amo) { const [y, m] = S.att.month.split("-").map(Number); S.att.month = dstr(new Date(y, m - 1 + Number(amo.dataset.amonth), 1).getTime()).slice(0, 7); render(); return; }
  const ap = ev.target.closest("[data-aday-pick]");
  if (ap) { S.att.date = ap.dataset.adayPick; S.att.mode = "day"; render(); return; }
  const sp = ev.target.closest("[data-setpw]");
  if (sp) return setPassword(sp.dataset.setpw, false);
  const cp = ev.target.closest("[data-clearpw]");
  if (cp) return setPassword(cp.dataset.clearpw, true);
  const per = ev.target.closest("[data-period]");
  if (per) { S.period = per.dataset.period; render(); return; }
  if (ev.target === $("#scrim")) { closeSheet(); return; }
  const cpg = ev.target.closest("[data-cpage]");
  if (cpg) { S.cpage += Number(cpg.dataset.cpage); render(); return; }
  const pg = ev.target.closest("[data-page]");
  if (pg) { S.page += Number(pg.dataset.page); render(); return; }
  const bk = ev.target.closest("[data-bulk]");
  if (bk) return bulkAction(bk.dataset.bulk);
  const at = ev.target.closest("[data-addtag]");
  if (at) { const el = $("#o-tags"); const cur = parseTags(el.value); if (!cur.includes(at.dataset.addtag)) cur.push(at.dataset.addtag); el.value = cur.join(", "); return; }
  if (ev.target.matches("input[type=checkbox]")) return;
  const op = ev.target.closest("[data-open]");
  if (op) return openOrderDetails(op.dataset.open);
  const ct = ev.target.closest("[data-cust]");
  if (ct) return openCustomer(ct.dataset.cust);
  const tr = ev.target.closest("tr[data-row]");
  if (tr) return openOrderDetails(tr.dataset.row);
  const b = ev.target.closest("[data-act]"); if (!b) return;
  const id = b.dataset.id;
  switch (b.dataset.act) {
    case "new-order": return openOrderForm();
    case "lock-dept": S.unlocked.delete(S.dept); saveUnlocked(); render(); toast(`${dept(S.dept).name} locked.`); return;
    case "lock-all": S.unlocked.clear(); saveUnlocked(); render(); toast("All departments locked on this device."); return;
    case "edit-home": closeSheet(); S.view = "dept"; S.dept = "ADMIN"; S.tab = "homecontent"; saveNav(); render(); return;
    case "new-member": return openMemberForm();
    case "edit-att": return openAttForm(b.dataset.mid);
    case "del-att": await remove("attendance", id); closeSheet(); toast("Attendance record cleared."); return;
    case "edit-member": return openMemberForm(id);
    case "del-task": await remove("tasks", id); closeSheet(); toast("Task deleted."); return;
    case "del-member": await remove("team", id); closeSheet(); toast("Removed from team."); return;
    case "import": return openImport();
    case "new-product": return openProductForm();
    case "edit-product": return openProductForm(id);
    case "restock": return openRestock(id);
    case "new-expense": return openExpenseForm();
    case "edit-expense": return openExpenseForm(id);
    case "close": return closeSheet();
    case "add-item": $("#items").insertAdjacentHTML("beforeend", itemRow()); return;
    case "rm-item": if (document.querySelectorAll("#sheet .item-row").length > 1) b.closest(".item-row").remove(); updateOrderTotal(); return;
    case "export": return exportCol(b.dataset.col);
    case "clear-ex": $("#clear-slot").innerHTML = `<span class="confirm">Delete all example rows? <button class="btn sm danger" type="button" data-act="clear-ex-yes">Yes, clear</button><button class="btn sm" type="button" data-act="clear-ex-no">Keep</button></span>`; return;
    case "clear-ex-no": render(); return;
    case "clear-ex-yes": return clearExamples();
    case "ask-del-order": case "ask-del-product": case "ask-del-expense": case "ask-del-task": case "ask-del-member": case "ask-del-att": {
      const kind = b.dataset.act.slice(8);
      const extra = kind === "order" ? " Stock is not changed; set payment to Voided first if you want items back in stock." : "";
      $("#del-slot").innerHTML = `<div class="confirm">Delete this ${({ att: "attendance record", member: "team member" })[kind] || kind}? This can't be undone.${extra} <button class="btn sm danger" type="button" data-act="del-${kind}" data-id="${id}">Delete</button><button class="btn sm" type="button" data-act="close">Keep</button></div>`;
      return;
    }
    case "del-order": await remove("orders", id); closeSheet(); toast("Order deleted."); return;
    case "del-product": await remove("products", id); closeSheet(); toast("Product deleted."); return;
    case "del-expense": await remove("expenses", id); closeSheet(); toast("Expense deleted."); return;
  }
}));

document.addEventListener("change", guard(async ev => {
  const t = ev.target;
  if (t.dataset.sel) { t.checked ? S.sel.add(t.dataset.sel) : S.sel.delete(t.dataset.sel); render(); return; }
  if (t.id === "sel-all") { const ids = filteredOrders().slice(S.page * PAGE, S.page * PAGE + PAGE).map(o => o.id); ids.forEach(id => t.checked ? S.sel.add(id) : S.sel.delete(id)); render(); return; }
  if (t.id === "imp-file" && t.files[0]) return readImportFile(t.files[0]);
  if (t.id === "a-date") { if (t.value) S.att.date = t.value; render(); return; }
  if (t.id === "a-dept") { S.att.dept = t.value; render(); return; }
  if (t.id === "t-person") { S.t.person = t.value; render(); return; }
  if (t.id === "t-dept") { S.t.dept = t.value; render(); return; }
  if (t.id === "k-status" && t.value === "done") { $("#k-prog").value = 100; $("#k-prog-val").textContent = "100%"; return; }
  if (t.id === "my-member") { const data = { ...S.profile, memberId: t.value }; S.profile = data; if (S.db && S.uid) await S.db.doc("data/users/" + S.uid + "/profile").set(data); render(); toast(t.value ? `Linked to ${memberName(t.value)}.` : "Unlinked."); return; }
  if (t.id === "of-platform") { S.of.platform = t.value; S.page = 0; render(); }
  if (t.id === "of-view") { S.of.view = t.value; S.page = 0; render(); }
  if (t.id === "of-range") { S.of.range = t.value; render(); }
  if (t.matches(".it-p")) { const p = S.products.find(x => x.id === t.value); const pr = t.closest(".item-row").querySelector(".it-price"); if (p) pr.value = p.price ?? ""; updateOrderTotal(); }
}));

document.addEventListener("input", ev => {
  const t = ev.target;
  if (t.matches(".it-q, .it-price")) return updateOrderTotal();
  if (t.id === "k-prog") { $("#k-prog-val").textContent = t.value + "%"; return; }
  const key = { "of-q": "of", pq: "pq", cq: "cq" }[t.id];
  if (!key) return;
  if (key === "of") { S.of.q = t.value; S.page = 0; } else { S[key] = t.value; S.cpage = 0; }
  const pos = t.selectionStart; render();
  const el = document.getElementById(t.id); if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (e) {} }
});

$("#sheet").addEventListener("submit", guard(async ev => {
  ev.preventDefault();
  if (!sheetSubmit) return;
  const btn = $("#sheet").querySelector('[type="submit"]'); if (btn) btn.disabled = true;
  try { await sheetSubmit(); } finally { if (btn && document.body.contains(btn)) btn.disabled = false; }
}));
document.addEventListener("submit", guard(async ev => {
  if (ev.target.id === "unlock-form") { ev.preventDefault(); return tryUnlock(); }
  if (ev.target.id === "att-cfg") {
    ev.preventDefault();
    const data = { start: val("ac-start") || "09:00", end: val("ac-end") || "18:00", grace: Math.max(0, Math.round(numv("ac-grace"))), workdays: [...document.querySelectorAll('input[name="ac-wd"]:checked')].map(x => Number(x.value)) };
    if (S.db) await S.db.doc("config/attendance").set(data); else S.attSettings = data;
    toast("Attendance settings saved."); render(); return;
  }
  if (ev.target.id === "home-form") {
    ev.preventDefault();
    const data = { welcome: val("h-welcome"), mission: val("h-mission"), vision: val("h-vision"), goals: val("h-goals"), updatedAt: Date.now() };
    if (S.db) await S.db.doc("config/home").set(data); else S.home = data;
    toast("Home page saved."); render();
  }
}));
document.addEventListener("keydown", ev => { if (ev.key === "Escape" && !$("#scrim").hidden) closeSheet(); });

/* ---------- boot ---------- */
S.att.date = mToday(); S.att.month = S.att.date.slice(0, 7);
renderThemeSwitch();
render();
(async () => {
  const c = window.claude;
  const [db, user, dl] = await Promise.all([
    c?.use ? c.use("db").catch(() => null) : null,
    c?.use ? c.use("user").catch(() => null) : null,
    c?.use ? c.use("downloads").catch(() => null) : null,
  ]);
  S.db = db; S.dl = dl; S.user = user; S.dbChecked = true;
  if (user) {
    try { const w = await user.can("data.write"); if (w === false) S.readOnly = true; } catch (e) {}
    try { S.me = await user.me(); S.uid = S.me.id; S.isOwner = !!S.me.isOwner; S.canEdit = !!S.me.canEdit; } catch (e) {}
  }
  $("#sync").textContent = db ? "Saved to the cloud · syncs live" : "Not saving in this view";
  if (db) {
    const keep = () => { if ($("#scrim").hidden) render(); else renderNav(); };
    db.doc("config/home").onSnapshot(s => { S.home = s.exists ? s.data() : {}; keep(); }, () => {});
    db.doc("config/attendance").onSnapshot(s => { S.attSettings = s.exists ? s.data() : {}; keep(); }, () => {});
    db.doc("config/security").onSnapshot(s => { S.security = s.exists ? s.data() : {}; keep(); }, () => {});
    if (S.uid) db.doc("data/users/" + S.uid + "/profile").onSnapshot(s => { S.profile = s.exists ? s.data() : {}; keep(); }, () => {});
    for (const col of ["products", "orders", "expenses", "customers", "tasks", "team", "attendance"]) {
      db.collection(col).onSnapshot(snap => {
        S[col] = snap.docs.map(d => { const r = { id: d.id, ...d.data() }; return col === "orders" ? norm(r) : r; });
        S.loaded[col] = true;
        if ($("#scrim").hidden) render(); else renderNav();
      }, () => { S.loaded[col] = true; $("#sync").textContent = "Connection lost · reload the page"; render(); });
    }
  }
  render();
})();
})();
</script>
